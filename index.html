   实测深色模式下 Surface 底色亮度 106：深字(30) 差 76 看不清，浅字(255) 差 149 清晰。 */
// 主页开关：与顶栏月亮按钮控制同一个全局状态（bgDim / body.dark / 图标）
const menuThemeEl = document.getElementById('menuThemeItem');
const menuFabIconEl = menuThemeEl.querySelector('svg');
// 按住时玻璃里亮起内透光（与场景按钮同一个 shader 分支）
let fabPressed = false;
// 注意：不能用全局的 toDevice() —— 它按场景 canvas 的 rect 换算，
// 而场景 canvas 在主页面时整体平移到屏幕右侧外了（translateX(100%)），
// 算出来的 x 会偏一整屏（实测 −80）。这里按主页自己那块 canvas 换算。
function fabToDevice(e) {
  const r = document.getElementById('menu-glass-canvas').getBoundingClientRect();
  const cssX = (e.clientX - r.left) / r.width * PHONE_W;
  const cssY = (e.clientY - r.top) / r.height * PHONE_H;
  return [cssX * SCALE, cssY * SCALE];
}
menuThemeEl.addEventListener('pointerdown', e => {
  const [px, py] = fabToDevice(e);
  const g = fabGlass;
  if (!g) return;              // WebGL 不可用时 fabGlass 建不出来，别在这里炸
  g.glowX = px; g.glowY = H - py;
  g.glowTX = px; g.glowTY = H - py;   // 尾点归到头点：否则会从上次位置拉出一条长尾
  g.glowVX = 0; g.glowVY = 0; g.prevGlowX = undefined; g.prevGlowY = undefined;
  g.glowAmtS = 0; g.glowSDX = 1; g.glowSDY = 0;
  if (g.glowAmt < GLOW_TAP_MIN) g.glowAmt = GLOW_TAP_MIN;   // 按下即亮（垫底）
  g._ox = 0; g._oy = 0;                 // 拉扯量从按下点起算
  g.jTr = 0; g.jTrV = 0; g.jHeld = true;
  fabPressed = true;
  fabDrag = { sx: px, sy: py, moved: 0 };
  suppressFabClick = false;
  try { menuThemeEl.setPointerCapture(e.pointerId); } catch (_) {}
});
/* 移动/松手一律绑在 window 上：
   手指划出 40x40 的按钮后就收不到元素上的 pointermove 了（除非 pointer capture
   一直有效，而某些浏览器在触屏上会丢失）。绑 window 最稳。
   其它拖动（场景 canvas / 开关）松手时也会走到这里，但 fabDrag 为 null 直接返回。 */
window.addEventListener('pointermove', e => {
  if (!fabDrag) return;
  const [px, py] = fabToDevice(e);
  const g = fabGlass;
  if (!g) return;
  magnetize(g, px, py);                 // 与场景同一套：形状内 1:1，形状外沿边界走
  fabDrag.moved = Math.max(fabDrag.moved, Math.hypot(px - fabDrag.sx, py - fabDrag.sy));
  g._ox = px - fabDrag.sx;              // 只记「拽了多少」，位移由弹簧决定
  g._oy = py - fabDrag.sy;
});
function fabEnd() {
  fabPressed = false;
  if (!fabDrag) return;
  const g = fabGlass;
  g.jHeld = false;                      // 松手 → 目标归零 → 弹回
  g._ox = 0; g._oy = 0;
  jellyRelease(g);                      // 松手 → 果冻回弹（与场景同一个函数）
  suppressFabClick = fabDrag.moved > TAP_SLOP;   // 拖过容差就不算点击
  fabDrag = null;
}
window.addEventListener('pointerup',     fabEnd);
window.addEventListener('pointercancel', fabEnd);
function syncMenuTheme() {
  const dark = document.body.classList.contains('dark');
  menuThemeEl.setAttribute('aria-checked', dark ? 'true' : 'false');
  // 图标跟着状态走：深色=月亮，浅色=太阳（与顶栏同一个语义）
  document.getElementById('menuMoonPath').setAttribute('d', dark
    ? 'M12 7.5a4.5 4.5 0 1 0 4.5 4.5A3.6 3.6 0 0 1 12 7.5zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4'
    : 'M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z');
}
menuThemeEl.addEventListener('click', () => {
  if (suppressFabClick) { suppressFabClick = false; return; }   // 是拖拽，不是点击
  toggleTheme();
});

function applyLabelContrast(dark) {
  glasses.forEach((g, i) => {
    const el = labelEls[i];
    if (!el) return;                       // 顶栏图标 / 选择图片没有文字元素
    const light = dark ? true : !!g.textLight;
    el.classList.toggle('label-light', light);
    el.classList.toggle('label-dark', !light);
  });
}
// 鼠标点击由 canvas 命中玻璃后触发（DOM 按钮已穿透）；键盘 Enter/Space 仍走这里
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
// 键盘 Enter / Space 触发的 click 不受 pointer-events 影响，仍能用
// （鼠标点击走上面的 label 命中层，不会走到这里，所以不会重复打开）
pickBtnEl.addEventListener('click', () => { fileInputEl.click(); });
fileInputEl.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) setImageBackground(f);
  e.target.value = '';
});

/* ================= 主页圆形玻璃按钮：复用场景同一套着色器 =================
   CSS 的 backdrop-filter 手搓不出场景那个材质（折射 / 色散 / rim / 内透光都在
   fragmentShader 里）。所以这里直接开第二个 WebGL 上下文，用 material.clone()
   拿到同一份 vertexShader + fragmentShader，参数照抄顶栏月亮按钮。 */
let mRenderer = null, mScene = null, mCamera = null, mMaterial = null;
let menuBgTex = null;

// 主页背景的可绘制副本：给玻璃当折射源（白底 + 几团很淡的渐变，与 CSS ::before 一致）
function createMenuBgTexture() {
  const dark = document.body.classList.contains('dark');
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = dark ? '#17191d' : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  const blobs = dark
    ? [[0.12, 0.08, 'rgba(56,189,248,0.16)'],
       [0.92, 0.88, 'rgba(129,140,248,0.14)'],
       [0.90, 0.05, 'rgba(56,189,248,0.22)']]
    : [[0.12, 0.08, 'rgba(37,99,235,0.11)'],
       [0.92, 0.88, 'rgba(234,88,12,0.09)'],
       [0.90, 0.05, 'rgba(56,189,248,0.24)']];
  for (const [fx, fy, col] of blobs) {
    const g = ctx.createRadialGradient(fx * W, fy * H, 0, fx * W, fy * H, Math.max(W, H) * 0.6);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

function initMenuGlass(canvasEl) {
  /* preserveDrawingBuffer 原来恒为 true，但全站搜不到任何 readPixels /
      toDataURL —— 它是纯开销：驱动每帧必须保留整块绘制缓冲（在移动端通常
     意味着一次额外的全屏拷贝/回读），而这块画布是整屏 780×1688。
     与主 renderer 同样改成 false。 */
  mRenderer = new THREE.WebGLRenderer({ antialias: false, canvas: canvasEl, alpha: true, preserveDrawingBuffer: false });
  mRenderer.setPixelRatio(1);
  mRenderer.setSize(W, H, false);
  canvasEl.style.width = PHONE_W + 'px';
  canvasEl.style.height = PHONE_H + 'px';
  mRenderer.setClearColor(0x000000, 0);
  mRenderer.autoClear = false;
  mScene = new THREE.Scene();
  mCamera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 1, 1000);
  mCamera.position.z = 100;
  mMaterial = material.clone();          // ← 同一份着色器、同一套参数名
  mScene.add(new THREE.Mesh(new THREE.PlaneGeometry(W, H), mMaterial));
}

function setMenuGlassUniforms(g) {
  const u = mMaterial.uniforms;
  u.resolution.value.set(W, H);
  u.glassCenter.value.set(g.x, H - g.y);
  u.glassSize.value.set(g.width, g.height);
  u.borderRadius.value = g.borderRadius;
  u.refractStrength.value = g.refractStrength;
  u.dispersion.value = g.dispersion;
  u.edgeWidth.value = g.edgeWidth;
  u.edgeWidthPx.value = g.edgeWidthPx;
  u.edgeWidthMode.value = 0;
  u.edgeBend.value = g.edgeBend;
  u.rimStrength.value = g.rim;
  u.bgDim.value = 0;                     // 主页背景本来就是白/深色，不用再压
  u.bgScale.value = 1;
  u.bgOffset.value.set(0, 0);
  u.bgTexSize.value.set(W, H);
  u.tDiffuse.value = menuBgTex;
  u.tDiffuseSharp.value = menuBgTex;
  u.tBackdrop.value = menuBgTex;
  u.blurRadius.value = g.blur || 0;
  u.edgeClarity.value = 0;
  u.tintColor.value.setStyle(g.tint.color || '#ffffff');
  u.tintStrength.value = (g.tint.strength != null ? g.tint.strength : 0) / 100;
  u.tintMode.value = 0;
  // 果冻形变必须用真实状态：之前写死 (1,0,0,0) 等于永远无形变。
  // 屏幕 y 向下、GL y 向上，轴的 y 分量要翻符号（与场景 setGlassUniforms 一致）。
  u.jelly.value.set(fabGlass.jDirX || 0, -(fabGlass.jDirY || 0),
                    fabGlass.jAmt || 0, fabGlass.jTr || 0);
  u.jellyFollow.value = JELLY_FOLLOW;
  u.jellySqueeze.value = JELLY_SQUEEZE;
  u.jellyCorner.value = CORNER_GAIN;
  u.glowPos.value.set(g.glowX, g.glowY);
  u.pointerAmt.value = g.glowAmt;
  // 与场景完全同一个公式（glowR）：等效半边长 × GLOW_R_EQ 和 短边 × GLOW_R_SIDE 取小。
  // 之前这里只写了短边那一项，结果主页光斑是场景的两倍大、铺得太开。
  // 主页背景不缩放，所以 scale 传 1。
  u.glowRadius.value = glowR(g, 1);
  u.glowStretchDir.value.set(g.glowSDX || 1, g.glowSDY || 0);
  u.glowStretchAmt.value = g.glowAmtS || 0;
  u.glowPlateau.value = GLOW_PLATEAU;
  u.glowEdgeFadePx.value = GLOW_EDGE_FADE_PX;
  u.glowGain.value = GLOW_GAIN;
  u.glowLens.value = GLOW_LENS;
  u.uTime.value = clockT;
}

// 主页圆形按钮每帧推进：复用场景同一套拖尾 / 弹簧 / 淡出常量。
// 不能把它塞进 glasses 数组 —— 那样 hitGlass 会在 (350,60) 抢在顶栏月亮之前命中它，
// 场景里点月亮就抓错对象了。这里单独跑一份，位置钉死在顶栏（只保留形变，不位移）。
let suppressFabClick = false;
function fabStep(dt) {
  const g = fabGlass;
  if (!g) return;              // WebGL 不可用时 fabGlass 建不出来，别在这里炸
  // ---- 拖尾（同 tickPointer 那段）----
  const px = g.glowX, py = g.glowY;
  const ppx = (g.prevGlowX === undefined) ? px : g.prevGlowX;
  const ppy = (g.prevGlowY === undefined) ? py : g.prevGlowY;
  g.prevGlowX = px; g.prevGlowY = py;
  const rvx = (px - ppx) / Math.max(dt, 1e-4), rvy = (py - ppy) / Math.max(dt, 1e-4);
  const kv = 1 - Math.exp(-dt / GLOW_TAIL_VTAU);
  g.glowVX += (rvx - g.glowVX) * kv;
  g.glowVY += (rvy - g.glowVY) * kv;
  const R = glowR(g, 1);        // 主页背景不缩放 → scale 传 1，与 uniform 一致
  let lenv = Math.hypot(g.glowVX, g.glowVY) * GLOW_TAIL_TAU;
  lenv = Math.min(lenv, R * GLOW_TAIL_MAX);
  const sp = Math.hypot(g.glowVX, g.glowVY);
  if (sp > 1e-3) { g.glowSDX = g.glowVX / sp; g.glowSDY = g.glowVY / sp; }
  let tx = px - (g.glowSDX || 0) * lenv, ty = py - (g.glowSDY || 0) * lenv;
  const d = deformedRect(g);
  const cx = Math.max(d.cx - d.hx, Math.min(d.cx + d.hx, tx));
  const cy = Math.max(d.cy - d.hy, Math.min(d.cy + d.hy, ty));
  const remain = Math.hypot(cx - px, cy - py);
  g.glowAmtS = (R > 1e-3) ? Math.min(remain, lenv) / R : 0;
  g.glowTX = tx; g.glowTY = ty;
  // ---- 内透光：按下亮起、松手渐隐（与场景同一套速率）----
  const ftgt = fabPressed ? 1 : 0;
  const ftau = fabPressed ? 0.06 : 0.25;
  g.glowAmt += (ftgt - g.glowAmt) * (1 - Math.exp(-dt / ftau));
  if (g.glowAmt < 1e-4) g.glowAmt = 0;
  // ---- 果冻弹簧（与场景同一套 stepGlass）----
  stepGlass(g, dt);
  // 图标跟上玻璃：玻璃在形变、上面的图案纹丝不动，看着就是两层分离的东西。
  // 与场景 iconEls 完全同一套（jellyTransform + LABEL_SQUASH）。
  if (menuFabIconEl) menuFabIconEl.style.transform = jellyTransform(g, LABEL_SQUASH);
  g.x = g.homeX; g.y = g.homeY;   // 顶栏按钮：钉死位置，只保留形变
  // 收尾判据要和 stepGlass 自带的（6e-4 / 4e-3）同量级：
  // 之前这里写 1e-4 更严，结果弹簧已停、残余 −0.0013 却永远清不掉。
  if (!fabPressed && !fabDrag &&
      Math.abs(g.jAmt) < 0.002 && Math.abs(g.jTr) < 0.002 &&
      Math.abs(g.jVel) < 0.01 && Math.abs(g.jTrV) < 0.01) {
    g.jAmt = 0; g.jTr = 0; g.jVel = 0; g.jTrV = 0;
  }
}

/* ================= 滑块玻璃（开关：白点浮起 → 变成玻璃） =================
   做法：轨道保持 iOS 的实色（浅灰白 / systemGreen），只有滑块变化。
   滑块原本是 DOM 里的一个白色圆点；按住或拖动时它「浮起」：
     ① 白色圆点 opacity 1 → 0（淡出）
     ② 一块圆形玻璃 uAlpha 0 → 1（淡入），压在同一位置、略大一点（浮起）
     ③ 投影同步张开
   两者交叉淡入淡出，观感就是「那个白点变成了玻璃」，松开按弹簧原路变回去。
   玻璃用与按钮完全同一个 ShaderMaterial.clone()，折射/色散/rim 全部一致。
   折射采样的纹理里画的正是 4 条轨道 —— 所以玻璃透出的是脚下的轨道色，物理正确。
   注意：浮起后的玻璃会明显超出 51×31 的轨道（按住变宽 35px 再乘浮起放大），
   这是 iOS 的原生行为，所以这块 canvas 覆盖整屏、不做任何裁剪。 */
let tRenderer = null, tMaterial = null, tScene = null, tCamera = null;
let thumbTex = null, thumbTexDirty = true;
let thumbShadowEls = [], thumbEls = [], trackEls = [];
/* ---- 折射纹理的「局部上传」----
   整张纹理是 780×1688 = 5.02MB。实测拖动时每帧都要重画 + 上传一次，
   上传占整帧耗时的 82%（8.08ms/帧，绘制只要 0.2ms）—— 这就是拖起来发涩、
   「不是性能问题但就是卡」的原因。
   真正会变的内容只有「那一条轨道」：拖动时只有手指底下那一行在动。
   所以改成只把变化的那几行的包围盒 texSubImage2D 上去，实测 600×160 只要 0.4ms，
   比整屏 4.9ms 快 12 倍。 */
let texScratch = [];          // 每行一块尺寸固定的中转 canvas
let texRowSig = [];           // 每行上次绘制时的参数签名，用来判断要不要重画/重传
let texNeedFull = true;       // 换背景 / 切场景 / 深浅色切换 → 整屏重铺，必须整传一次
// 浮起放大倍率。iOS 的滑块按住时会拉长到 35px，再乘这个系数就明显超出 51×31 的轨道 ——
// 那是原生行为，不是溢出。0.10 太小：27→29.7px 仍缩在 31px 的轨道里，看着"没浮起来"。
/* 玻璃必须是正圆，直径只跟滑块「高」走，不能跟宽 ——
   按住时滑块会从 34 拉长到 58，若宽度也跟着乘，玻璃就成了 79×41 的扁长条，
   根本不是参考图里那颗圆珠。所以 gw/gh 都用 hCss（30）算，宽高比恒为 1。 */
const LIFT_THUMB_SCALE = 0.30;   // 横向：滑块 58 → 玻璃宽 75（再按底座半宽钳制）
/* 纵向倍率单独取更大的值：玻璃必须「高出去」才叫浮起来。
   之前把高度钳在 SW_TRACK_H 内，玻璃完全缩在底座里，看着就是没浮。
   现在按 iOS 的做法：满浮起时玻璃高 = 2 × 轨道高 = 52，
   轨道内 26 / 轨道外 26（上下各探出 13）—— 正好「伸出去一半」。
   注意：GLASS_H_AT_FULL 必须定义在 SW_TRACK_H 之后（const 有暂时性死区 TDZ），
   放在这里会在脚本加载阶段抛 ReferenceError，导致整个文件后面的点击绑定全部失效。
   实际定义见下方 SW_TRACK_H 附近。 */
const LIFT_THUMB_RISE  = 0;      // 抬升保持 0：高出底座靠尺寸，不靠位移。
                                  // 一旦抬升，上下探出量就不相等（上多下少），又会变成偏上歪。
/* 变大必须发生在上浮「之后」——顺序不能反：
     浮起（玻璃出现）→ 上浮（只升高、尺寸不变）→ 到 LIFT_GROW_START 之后才慢慢变大
     → 升到顶（撞到头）时变形完成 → 才开始下沉。
   之前 scale 是线性跟随整个 lift，等于「一开始就一边升一边变大」，
   看着就是你说的反着的。现在放大只由 grow 驱动，grow 在 lift 后段才起来。
   下沉时同一条曲线反向播：先缩回原尺寸，再沉到底。 */
const LIFT_GROW_START = 0.55;
/* 滑块浮起弹簧：与场景玻璃那套 lift 同一个方程，但刚度/阻尼独立取值。
   按住中 ζ=1.0 —— 稳稳升到顶，不抖（手指压着时玻璃一直在颤就很廉价）。
   松开后刚度调软（520 → 300，ω 22.8 → 17.3）：沉得更慢、更有重量，这就是阻尼感；
   ζ 取 0.55 保留一次轻微回弹 —— 完全单调收敛看着就是「啪」地掉下去，中间断一截。 */
const THUMB_K_HELD = 420;      // （已停用，保留供参考）按住中略软
const THUMB_C_HELD = 45.6;    // （已停用）
const THUMB_K_FREE = 240;     // （已停用）
const THUMB_C_FREE = 19.1;    // （已停用）
/* ---- 浮起时间轴（现用）----
   三段各自用一条速度连续的 easing，段间速度都为 0，所以整段没有加速度跳变：
     rise  300ms  easeOutQuad     起步立刻有响应，末尾速度→0（浮到顶停住）
     hold   90ms  lift 恒为 1     撞到头后的顶点停留，让"变形完成"看得见
     fall  400ms  smootherstep    起步速度 0（从顶点平滑离开）、末尾速度 0（平滑归位）
   总时长按住不放时停在 hold；松手后 90 + 400 = 490ms 走完沉降。 */
const LIFT_RISE_MS = 240;
const LIFT_HOLD_MS = 0;      // 顶点不再停留：到顶立刻开始下沉
const LIFT_FALL_MS = 340;
/* grow = lift^POW。POW>1 → 前段 grow 远小于 lift（只浮起、尺寸几乎不动），
   后段才快速鼓起，且 lift 到 1 时 grow 同时到 1 = "撞到头刚好完成变形"。 */
const LIFT_GROW_POW = 1.6;
/* 最短浮起：点击（不是拖动）时手指很快就离开，lift 才升到 0.3 就被撤力，
   于是「刚冒头就缩回去」—— 这就是点击时那一下闪跳。
   判据：已松手、仍在上升、且没升到这个值 → 继续用 held 参数升满，再进入沉降。 */
const LIFT_MIN_RISE = 0.92;
/* 负向过冲的视觉折扣：弹簧必须允许沉到 0 以下再回来（否则曲线不连贯），
   但把负值原样作用在尺寸上，玻璃会缩到比原尺寸还小再弹回 —— 那正是「跳一下」。
   打折后曲线照旧连续，尺寸上几乎看不出来。 */
const LIFT_NEG_VIS  = 0.22;
/* 淡入淡出的交接区间：lift 从 0 到 0.30 就完成「白点 → 玻璃」的交叉。
   若线性跟随整个 lift，中间会有很长一段时间白点和玻璃同时半透明 ——
   两层大小不同的图形叠着就是重影，看着就是「玻璃歪了」。提前交接完，
   后面的 lift 0.30 → 1 就纯粹是玻璃在浮起。 */
const THUMB_FADE_END = 0.30;
/* 白点（滑块本体）在玻璃鼓起时「缩小」：参考图里玻璃内部能看到一个明显变小的滑杆本体，
   而不是一个和玻璃差不多大的白片 —— 后者会出现「外圈厚边框 + 内部椭圆」的双层重影。
   缩到 45% 后它就是玻璃里的一枚小芯，玻璃才是主体。
   用 CSS 的 scale 属性（独立于 transform），这样不影响 translateX 的位移与过冲回弹，
   且以中心为原点缩放，圆心自动保持不变。 */
/* 滑杆本体（.sw-track）保持原版固定，不缩放。
   之前这里写 0.20 让本体缩到 80%，但用户要的是「玻璃和滑杆一样长」，
   滑杆本身是 iOS 原版固定的，只有玻璃鼓起/探出，本体不该变形。
   置 0 后：DOM 轨道恒为 66×26，折射纹理里的轨道也随之回到 66×26，两边严格一致。 */
const TRACK_SHRINK_AT_FULL = 0;
/* 上面这个 0 只管 DOM 滑杆本体（保持原版固定）。
   玻璃里折射出来的那条轨道用这个独立参数，让它随浮起缩小 ——
   玻璃浮得越高、离背景越远，透过玻璃看到的滑杆影像越小，
   这样玻璃才明显「裹住」一条比自己小的轨道（参考图的效果）。 */
/* 玻璃里折射出的影像缩小多少（0 = 原尺寸）。
   滑块场景用户要求不缩（那条线本来就细），开关场景保留 0.28。
   两场景共用同一套渲染代码，所以这里用 let，由 applySwGeometry 按场景改写，
   改一个场景不会影响另一个。 */
/* 按场景取值（见 applySwGeometry）：
     · 滑块场景 = 0    —— 那条轨道只有 8px 高，再缩就几乎看不见了，用原尺寸
     · 开关场景 = 0.28 —— 66×26 的粗轨道，缩一点才有「玻璃离背景更远」的层次
   两个场景共用同一套渲染代码，所以必须是 let 而不是 const，由场景切换改写。 */
let TEX_TRACK_SHRINK_AT_FULL = 0.28;
/* 纹理里那条轨道在**横向**额外延长多少（0 = 不延长，负数 = 缩短）。
   只有标签栏用得上：选中框玻璃拖到最左/最右时会探出条外，而纹理里的条又是
   按 TEX_TRACK_SHRINK_AT_FULL 缩过的，于是玻璃边缘到条边缘那一段（折射的是背景）
   比上下两端宽得多（实测 34.5 vs 13.2）—— 看着像条被切短了一截。
   要求「左右空隙与上下一样宽」，所以横向要**反向**加长，把那一段补回来。
   其余场景保持 0，渲染代码是共用的，改一个场景不影响另一个。 */
let TEX_TRACK_X_EXT_AT_FULL = 0;
const THUMB_SHRINK_AT_FULL = 0.15;
/* 白点淡出的下限：不再淡到全透明。完全消失就看不到「缩小的滑杆」了，
   参考图里玻璃内部那枚小芯是可见的。保留 0.35 让它成为玻璃里的高光核。 */
const THUMB_KEEP_ALPHA = 0.35;

// 白色染色压到 8：18 仍会把折射出来的轨道色洗得很亮，看着还是偏"白点"。
// 8 只做一点点提亮，主体是玻璃对轨道的折射 —— 开着时透出 systemGreen 的绿玻璃，
// 关着时透出轨道的浅灰白，这才看得出"白点变成了玻璃"而不是"白点被盖住"。
// 放大后玻璃面积更大，洗白会更明显，所以要比原来更低。
const thumbParam = makeGlass(30, '', SW_X, SW_Y[0], 34, 30,
                             { color: '#ffffff', strength: 8 }, 0.85, false, 0);

function initThumbGlass(canvasEl) {
  tRenderer = new THREE.WebGLRenderer({ antialias: false, canvas: canvasEl, alpha: true, preserveDrawingBuffer: false });
  tRenderer.setPixelRatio(1);
  tRenderer.setSize(W, H, false);
  canvasEl.style.width = PHONE_W + 'px';
  canvasEl.style.height = PHONE_H + 'px';
  tRenderer.setClearColor(0x000000, 0);
  tRenderer.autoClear = false;        // 一块 canvas 上叠 4 块玻璃，不能每次自动清
  tScene = new THREE.Scene();
  tCamera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 1, 1000);
  tCamera.position.z = 100;
  tMaterial = material.clone();       // 同一份着色器
  // 必须显式开透明：ShaderMaterial 默认 transparent=false，
  // 那样 gl_FragColor.a 只是写进缓冲的 alpha 通道、不参与混合，
  // 淡入淡出（uAlpha 0→1）会变成"突然出现"。
  tMaterial.transparent = true;
  tMaterial.depthTest = false;
  tMaterial.depthWrite = false;
  tScene.add(new THREE.Mesh(new THREE.PlaneGeometry(W, H), tMaterial));
}

/* 折射用的背景纹理：4 条实色轨道（颜色随开关状态）。
   原来只在状态切换时重画一次 —— 但 DOM 轨道是 .30s 渐变的，纹理却瞬间跳到目标色，
   于是点击切换那一瞬间，玻璃折射出的轨道色和脚下的轨道对不上，玻璃颜色「跳一下」。
   现在纹理也按同一条 0.30s 线性插值逐帧重画（只重画轨道那几条窄带，开销很小）。
   整屏背景只在「换了背景图 / 切了深色」时重铺，平常不动。 */
let thumbTexCanvas = null, thumbTexCtx = null, thumbTexDim = -1, thumbTexFull = true;
/* 轨道色插值位置：0 = 关闭色、1 = 开启色，与 DOM 轨道的 .30s linear 同一条曲线。 */
let thumbTweenT = [];
const TRACK_OFF = [[244, 247, 250], [221, 227, 234]];   // #f4f7fa → #dde3ea
const TRACK_ON  = [[63, 215, 106], [43, 179, 80]];      // #3fd76a → #2bb350
const mixRGB = (a, b, t) => 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ','
                                  + Math.round(a[1] + (b[1] - a[1]) * t) + ','
                                  + Math.round(a[2] + (b[2] - a[2]) * t) + ')';

/* 本体缩放（grow）变化检测：只要有一个开关的 grow 动了，折射纹理就要重画，
   否则玻璃里透出的轨道尺寸停留在上一帧。返回是否需要重画。 */
let thumbShrinkPrev = null;
function stepThumbShrinkTween() {
  let dirty = false;
  if (!thumbShrinkPrev) {
    thumbShrinkPrev = swThumbs.map(t => t ? t.grow : 0);
    return true;                       // 首帧建基线
  }
  for (let i = 0; i < swThumbs.length; i++) {
    const g = swThumbs[i] ? swThumbs[i].grow : 0;
    if (Math.abs(g - (thumbShrinkPrev[i] || 0)) > 0.0015) {
      thumbShrinkPrev[i] = g; dirty = true;
    }
  }
  return dirty;
}

function stepThumbTrackTween(dt) {
  /* 这条补间是开关场景专用的：目标只有 0 / 1（SWITCH_ROWS[i].on 是布尔）。
     滑块场景是连续值（0 ~ 1），若继续走这条，thumbTweenT 会被写成开关那几行的
     0/1，而纹理绘制处 thumbTweenT[i] !== undefined 会优先取它 ——
     于是玻璃里那条进度条被按开关的布尔状态画成「全满」或「全空」，
     跟滑块自己的位置完全无关。这里直接让位给 swRowT()（拖动时 setT 已改
     row.on 并置 dirty）。切回开关场景前要清空，避免残留值继续生效。 */
  if (sceneMode === 'slider' || sceneMode === 'tabbar') {
    if (thumbTweenT.length) { thumbTweenT = []; return true; }
    return false;
  }
  let dirty = false;
  for (let i = 0; i < SWITCH_ROWS.length; i++) {
    const target = SWITCH_ROWS[i].on ? 1 : 0;
    let cur = thumbTweenT[i];
    if (cur === undefined) { thumbTweenT[i] = target; continue; }
    if (Math.abs(cur - target) < 0.002) {
      if (cur !== target) { thumbTweenT[i] = target; dirty = true; }
      continue;
    }
    const d = dt / 0.30;                       // 与 CSS 的 .30s 同步
    thumbTweenT[i] = target > cur ? Math.min(target, cur + d) : Math.max(target, cur - d);
    dirty = true;
  }
  return dirty;
}

/* 折射纹理里「标签栏那条」的高斯模糊半径（设备像素）：
   直接取标签栏条玻璃（glasses[7]）自己的 blur —— 那条在外面就是毛玻璃，
   透过选中框看到的影像如果画成锐利的白条，两块质感对不上（看着像塑料片）。
   取同一个值就永远不会各改各的。
   mul 用来微调观感：图标会先糊，太糊就往 0.5 收，不够再往上。

   【为什么不能只给白色渐变加 ctx.filter】—— 只给条加 ctx.filter 时，肉眼只看得
   出「边缘变软了」，条内部毫无变化。原因是高斯模糊对**平滑区域**几乎不产生
   可见差异：那条本身就是一个 0.32→0.16 的线性渐变，低频信号，糊与不糊一样。
   真正的模糊由玻璃 shader 做（见 setGlassUniforms 里 blurRadius 那段）：纹理里
   必须铺**锐利**的原背景，让 shader 有东西可糊；预糊一遍再让 shader 糊一次是
   双重模糊，等于把细节全抹平（实测：预糊后条内高频从 7.8 掉到 1.8，图标白像素
   从 2240 掉到 11，糊得什么都看不见）。 */
const TBAR_TEX_BLUR_MUL = 1.0;
const TBAR_TEX_BLUR_PX = (glasses[7] ? glasses[7].blur : 6 * SCALE) * TBAR_TEX_BLUR_MUL;
/* Canvas2D 的 filter: blur(R) 里 R 就是标准差 σ。
   这里**直接用 glasses[7].blur（12 设备px）当 σ**，与外面那条真实标签栏一致：
     · 主玻璃的 tDiffuse 本身是「预糊好的模糊副本」（getBgTextureForBlur →
       drawBlurred，用的就是 canvas filter blur(12px)），拿到它之后着色器反而把
       blurRadius 设成 0（1671 行：bgTex !== texture 时不再糊第二次）；
     · 选中框玻璃的 blurRadius 同样是 0（setThumbUniforms 里写死），
       所以纹理里必须自带**全部**模糊量，一步都不能少。
   曾经按「着色器里 σ = blurRadius*0.5」乘 0.5 → σ=6，实测纹理里的条比外面那条
   清晰一倍（剖面峰谷 113 vs 屏幕 19），两块对不上；改回 1.0 后峰谷 17 vs 19，吻合。
   mul 只用于微调观感：嫌糊改 0.8，不够改 1.2。 */
const TBAR_TEX_BLUR_SIGMA = TBAR_TEX_BLUR_PX * 1.0;

function trackRegion(i) {
  /* 标签栏留更大的余量：玻璃（109.8×1.06=116.4 宽）比单个标签宽得多，
     最左/最右时会撑到条外面去，折射要取到条外的背景 —— 只留 12css 的话
     那一片是没画过的空洞（玻璃边缘出现脏边）。20css 足够覆盖探出量。
     其它场景维持 12，区域大小不影响画面（画的是同一张背景），只是上传多一点。 */
  const pad = (sceneMode === 'tabbar' ? 20 : 12) * SCALE;   // 折射会取到轨道外一点，包围盒留余量
  /* 高度必须按「玻璃满浮起时的高度」来留，不能只按轨道：
     滑块场景的轨道只有 8px 高、玻璃却有约 39px，只按轨道算会把玻璃上下
     折射到的那一片裁掉，纹理里出现没画的空洞（表现为玻璃边缘一圈脏边）。 */
  const hHalf = Math.max(SW_TRACK_H, GLASS_BASE_H * (1 + GLASS_H_SCALE_AT_FULL)) / 2;
  return { x: (SW_X - SW_TRACK_W / 2) * SCALE - pad, y: (swRowY[i] - hHalf) * SCALE - pad,
           w: SW_TRACK_W * SCALE + pad * 2, h: hHalf * 2 * SCALE + pad * 2 };
}

function roundPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
}

/* 把源画布上「目标矩形 + 偏移」那一块画到目标矩形。
   就是 shader 里「采样位置 = 片元位置 − normalDir × offset」这一步的 canvas 2D 版本
   （见片元着色器 875~891 行）。
   调用前外层必须已经 clip 好：canvas 的 clip 是累积相交的，
   所以这里再 clip 一个 rect 就等于「胶囊 ∩ 这一条带」。
   src 的 (0,0) 对应主画布的 (sx0, sy0)，故源坐标要减掉这个原点。 */
function drawTexBand(ctx, src, sx0, sy0, dx, dy, dw, dh, offX, offY) {
  if (!src || dw <= 0 || dh <= 0) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(dx, dy, dw, dh);
  ctx.clip();
  try {
    ctx.drawImage(src, dx + offX - sx0, dy + offY - sy0, dw, dh, dx, dy, dw, dh);
  } catch (e) {}
  ctx.restore();
}

/* ---- 标签栏图标 / 文字画进折射纹理 ----
   折射采样的是 thumbTexCanvas，纹理里没有图标，玻璃浮起来就只能折射出一片空白 ——
   这就是「框移过去看不见下面的标签图标」。所以要把三个标签的图标和文字也画进去。
   坐标是进场景时量一次 DOM 得到的（纹理坐标 = css × SCALE），
   这样折射出来的影像和 DOM 上真正看见的图标严格重合，不会重影。 */
let tbarTexItems = null;
function measureTbarTexItems() {
  const panel = document.getElementById('tabbarPanel');
  const phone = document.querySelector('.phone-ui');
  if (!panel || !phone) return null;
  const base = phone.getBoundingClientRect();
  if (!base.width) return null;                 // 还没排版（display:none）时量不到
  /* 手机框在设计坐标里是 390 宽。实际量到的可能是别的（页面整体缩放、
     或者菜单打开时框被缩小），所以先算出「屏幕像素 → 设计 css」的比例 k，
     再乘 SCALE 得到纹理坐标 —— 这样无论框被怎么缩放，画出来的位置都正确。
     之前直接用 (left − base.left) 当 css 用，遇到缩放就整体偏移（实测偏 390px）。 */
  const k = (W / SCALE) / base.width;
  const out = [];
  panel.querySelectorAll('.tbar-item').forEach((it) => {
    const svg = it.querySelector('svg'), sp = it.querySelector('span');
    if (!svg || !sp) return;
    const rs = svg.getBoundingClientRect(), rp = sp.getBoundingClientRect();
    /* 缓存的必须是**静止坐标**：绘制时条不放大、图标按 tbarBounce 放大（见绘制处
       的 gx/gy），所以这里统一先还原成静止值，绘制时再各自乘回去。
       量到的是 DOM 实时位置 —— 若此刻整条正被等比放大 bs 倍，坐标是
       以整排中心为原点放大后的结果。所以除掉 bs 还原静止坐标：
         静止 = 整排中心 + (量到 − 整排中心) / bs
       x、y 都要除，只除 y 会留下横向偏移（三个标签会被整体拉向两边）。
       图标尺寸和字号同样要除 —— 否则弹起时纹理里的图标会跟着大一圈。 */
    const bs = 1 + tbarBounce;
    const ux = (v) => (bs === 1 ? v : TBAR_ROW_CX + (v - TBAR_ROW_CX) / bs);
    const uy = (v) => (bs === 1 ? v : TBAR_Y      + (v - TBAR_Y)      / bs);
    const ix = ux((rs.left - base.left + rs.width / 2) * k) * SCALE;
    const iy = uy((rs.top  - base.top  + rs.height / 2) * k) * SCALE;
    const is = rs.width * k * SCALE / bs;
    const tx = ux((rp.left - base.left + rp.width / 2) * k) * SCALE;
    const ty = uy((rp.top  - base.top  + rp.height / 2) * k) * SCALE;
    if (ix < 0 || ix > W || iy < 0 || iy > H) return;    // 量歪了就别画
    out.push({ ix, iy, is, tx, ty, fs: 11 * k * SCALE / bs, text: sp.textContent });
  });
  tbarTexItems = (out.length === 3) ? out : null;
  return tbarTexItems;
}
/* 按 24×24 的 viewBox 绘制，与 DOM 里那三个 SVG 同一套路径 */
function drawTbarGlyph(ctx, idx, cx, cy, s, lw) {
  const k = s / 24;
  ctx.save();
  ctx.translate(cx - 12 * k, cy - 12 * k);
  ctx.scale(k, k);
  /* 比 DOM 上那支（1.8）粗一点：玻璃会模糊，细线透过折射几乎剩不下。
     lw 可覆盖：纹理里先描一圈更粗的暗边（把白图标从白条里抠出来），再压白色主体。 */
  ctx.lineWidth = (lw === undefined ? 2.4 : lw);
  if (idx === 0) {                       // 日历
    roundPath(ctx, 3, 5, 18, 16, 3); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8, 3); ctx.lineTo(8, 7);
    ctx.moveTo(16, 3); ctx.lineTo(16, 7);
    ctx.moveTo(3, 10); ctx.lineTo(21, 10);
    ctx.stroke();
  } else if (idx === 1) {                // 火箭
    ctx.beginPath();
    ctx.moveTo(12, 2.5);
    ctx.bezierCurveTo(16, 5, 18, 9, 18, 13.5);
    ctx.lineTo(15.5, 16); ctx.lineTo(8.5, 16); ctx.lineTo(6, 13.5);
    ctx.bezierCurveTo(6, 9, 8, 5, 12, 2.5);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, 9.5, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8.5, 14.5); ctx.lineTo(6, 16); ctx.lineTo(6.8, 19); ctx.lineTo(9, 18);
    ctx.moveTo(15.5, 14.5); ctx.lineTo(18, 16); ctx.lineTo(17.2, 19); ctx.lineTo(15, 18);
    ctx.stroke();
  } else {                               // 四格
    const cells = [[3, 3], [13, 3], [3, 13], [13, 13]];
    for (let n = 0; n < cells.length; n++) {
      roundPath(ctx, cells[n][0], cells[n][1], 8, 8, 2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---- 把「标签栏自己对背景的折射」画进纹理 ----
   外面那条标签栏（glasses[7]）本身是一块毛玻璃，由 shader 渲染，它的画面 =
     「背景按 SDF 外法线偏移采样（折射）」→「高斯模糊」→「白染色」。
   透过选中框看到的既然是同一条标签栏，纹理里就必须把**折射那一步也画出来** ——
   之前这里只铺了「模糊背景 + 白蒙层」，等于把条的折射属性整块丢掉了，
   于是玻璃滑块里看到的就是一块普通毛玻璃（用户：为什么没有折射）。

   【改的是「纹理里那条标签栏怎么画」，不是选中框玻璃自己的参数】
   THUMB_REFRACT_MUL / THUMB_EDGE_W_MUL / THUMB_EDGE_BEND 一律不碰，
   下面每一个参数都从 glasses[7] 本身读（refractStrength / edgeWidth / edgeBend /
   blur），所以透过玻璃看到的条与外面那条永远同步，不会各改各的。
   公式与着色器 858~869 行逐行对齐（bandWidth / edgeFactor / maxOffset / offset），
   只是把采样搬到 Canvas2D 上做。高斯模糊与平移可交换，所以「先糊后移」在这里
   与 shader 的「先移后糊」等价 —— 不会变成双重模糊，也不会糊到图标
   （图标在这之后才画，见下面 ②）。 */
/* 采样顺序：false = 先糊后移（与外面那条条逐字一致，**保持 false**）；
   true = 先移后糊（会多糊一遍，折射被抹平 → 看着不明显）。见 tbarSharpBg 上方注释。 */
const TBAR_TEX_SHIFT_FIRST = false;
const TBAR_TEX_REFRACT_MUL = 1.0;   // 1.0 = 与外面那条条完全同一强度（不再额外加成）
const TBAR_TEX_EW_MUL      = 1.00;  // 折射带【厚度】乘数：1.0 = 与外面那条条完全一致，改小 = 更薄

let tbarRefCv = null, tbarRefCtx = null, tbarBlurCache = null, tbarRefrCache = null;
let tbarSharpCv = null, tbarSharpCtx = null, tbarSharpCache = null;
let tbarTmpCv = null, tbarTmpCtx = null, tbarTmp2Cv = null, tbarTmp2Ctx = null;

/* 与着色器 roundedRectSDF 同一条公式 */
function tbarRoundedSDF(px, py, bx, by, r) {
  const qx = Math.abs(px) - bx + r, qy = Math.abs(py) - by + r;
  const mx = qx > 0 ? qx : 0, my = qy > 0 ? qy : 0;
  const mn = Math.min(Math.max(qx, qy), 0);
  return mn + Math.sqrt(mx * mx + my * my) - r;
}

/* 取一块「已经高斯模糊过」的背景像素。
   带缓存：背景不变、区域不变就只算一次 —— 拖动时每帧只做逐像素采样，
   模糊（最贵的那一步）不会重跑。换背景 / 切场景 / 深浅色切换时会失效（见下面
   createThumbBgTexture 里整屏重铺那一段把 tbarBlurCache 置空）。 */
function tbarBlurredBg(rx, ry, rw, rh) {
  const key = rx + ',' + ry + ',' + rw + ',' + rh + '|' + bgDim.toFixed(3) + '|' + bgScrollKey();
  if (tbarBlurCache && tbarBlurCache.key === key) return tbarBlurCache;
  if (!tbarRefCv) {
    tbarRefCv = document.createElement('canvas');
    tbarRefCtx = tbarRefCv.getContext('2d');
  }
  /* 源矩形外扩 2×半径：模糊会采样到矩形外一圈，只画矩形内那一块的话
     边缘会因为「外面是透明」被拉暗，出现一圈脏边。 */
  const p = Math.ceil(TBAR_TEX_BLUR_SIGMA * 3) + 2;
  const cw = rw + p * 2, ch = rh + p * 2;
  if (tbarRefCv.width < cw) tbarRefCv.width = cw;
  if (tbarRefCv.height < ch) tbarRefCv.height = ch;
  const c = tbarRefCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, tbarRefCv.width, tbarRefCv.height);
  if (TBAR_TEX_BLUR_SIGMA > 0 && supportsCanvasFilter()) {
    c.filter = 'blur(' + TBAR_TEX_BLUR_SIGMA.toFixed(2) + 'px)';
  }
  try {
    bgDrawImage(c, rx - p, ry - p, cw, ch, 0, 0, cw, ch);
  } catch (e) {}
  c.filter = 'none';
  if (bgDim > 0) {
    c.fillStyle = 'rgba(0,0,0,' + Math.min(1, bgDim) + ')';
    c.fillRect(0, 0, cw, ch);
  }
  tbarBlurCache = { key, x: rx, y: ry, w: rw, h: rh,
                    data: c.getImageData(p, p, rw, rh).data };
  return tbarBlurCache;
}

/* 【先糊后移：与外面那条标签栏**逐字一致** —— 这是本函数的正确性依据】
   外面那条标签栏（glasses[7]）在 shader 里的实际渲染顺序，由 setGlassUniforms 决定：
     1977  const bgTex = getBgTextureForBlur(blurPx);   // 预糊好的模糊副本（canvas filter blur(12px)）
     1978  u.tDiffuse.value      = bgTex;               // ← 采样源就是这张**已模糊**的
     1980  u.blurRadius.value    = (bgTex === texture) ? blurPx : 0;   // bgTex≠texture → **0**
     1981  u.edgeClarity.value   = glass.clarity (标签栏 = 0)
   于是 shader 里：
     982  centerUv = vUv - offset*pixelSize;      // 折射位移
     1006 sigma    = blurRadius*0.5 = 0;          // 模糊半径是 0，Vogel 那 16 次采样整段跳过
     1034 gl_FragColor = mix(blurred, sharp, 0)   // clarity=0 → 恒取 blurred
   也就是说：**外面那条条 = 在预糊好的 σ=12 背景上做一次折射位移采样，之后不再模糊**。
   即「先糊 → 后移」，一步不多、一步不少。

   曾经我把这里改成「先移后糊」（在清晰背景上位移采样、再整块模糊 σ=12），理由是
   「模糊与位移不可交换、先糊会抹掉高频」。那个推断在数学上没错，但**搞错了参照物**：
   用户要的是「透过玻璃看到的条 ≡ 外面那条条」，而外面那条条本身就是先糊后移。
   改成先移后糊之后，折射结构被多出来的那道 σ=12 抹平 —— 这正是「又不明显了」的来源。

   现在改回与 shader 完全同序：采样源 = tbarBlurredBg（预糊副本），
   逐像素只做位移采样，最后**不再**模糊。参数仍全部从 glasses[7] 读。 */
function tbarSharpBg(rx, ry, rw, rh) {
  const key = rx + ',' + ry + ',' + rw + ',' + rh + '|' + bgDim.toFixed(3) + '|' + bgScrollKey();
  if (tbarSharpCache && tbarSharpCache.key === key) return tbarSharpCache;
  if (!tbarSharpCv) {
    tbarSharpCv = document.createElement('canvas');
    tbarSharpCtx = tbarSharpCv.getContext('2d');
  }
  if (tbarSharpCv.width < rw) tbarSharpCv.width = rw;
  if (tbarSharpCv.height < rh) tbarSharpCv.height = rh;
  const c = tbarSharpCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.filter = 'none';
  c.clearRect(0, 0, tbarSharpCv.width, tbarSharpCv.height);
  try { bgDrawImage(c, rx, ry, rw, rh, 0, 0, rw, rh); } catch (e) {}
  if (bgDim > 0) {
    c.fillStyle = 'rgba(0,0,0,' + Math.min(1, bgDim) + ')';
    c.fillRect(0, 0, rw, rh);
  }
  tbarSharpCache = { key, x: rx, y: ry, w: rw, h: rh,
                     data: c.getImageData(0, 0, rw, rh).data };
  return tbarSharpCache;
}

/* 把「模糊 + 折射」的背景写进 (x,yy,w,h) 这个胶囊内部。
   putImageData 不受 clip 影响，所以胶囊遮罩由这里自己按 SDF 判，
   形状外的像素原样保留（先 getImageData 读回来，只改内部那批）。 */
function drawTbarRefractedBg(ctx, x, yy, w, h, r) {
  const g = glasses[7];
  const bend  = (g && g.edgeBend != null) ? g.edgeBend : 2.0;
  const fixed = !!(g && g.edgeMode === 'fixed');
  const ew    = ((g && g.edgeWidth != null) ? g.edgeWidth : 0.32) * TBAR_TEX_EW_MUL;
  const ewPx  = (g && g.edgeWidthPx != null) ? g.edgeWidthPx : 50;
  const rf    = ((g && g.refractStrength != null) ? g.refractStrength : REFRACT)
              * TBAR_TEX_REFRACT_MUL;

  const bx = w / 2, by = h / 2;
  const minSide = Math.min(bx, by);
  const bandWidth = Math.min(Math.max(fixed ? ewPx : minSide * ew, 2), minSide);
  const maxOff = minSide * rf * 0.01;

  /* 退化路径：折射为 0 就直接铺模糊背景（与改动前完全一致）。
     判据写成 maxOff >= 0 而不是 > 0.01，是为了让 TBAR_TEX_REFRACT_MUL = 0
     也走下面那条逐像素路径（位移恒为 0 → 采样点就是自身）—— 这样 A/B 对照时
     两边走的是**同一段代码**，量出来的差异才纯粹是折射造成的。 */
  if (!(maxOff >= 0)) {
    if (TBAR_TEX_BLUR_SIGMA > 0 && supportsCanvasFilter()) {
      ctx.filter = 'blur(' + TBAR_TEX_BLUR_SIGMA.toFixed(2) + 'px)';
      const pad = Math.ceil(TBAR_TEX_BLUR_SIGMA * 3);
      const sx = Math.max(0, x - pad), sy = Math.max(0, yy - pad);
      const sw = Math.min(W - sx, w + (x - sx) + pad);
      const sh = Math.min(H - sy, h + (yy - sy) + pad);
      bgDrawImage(ctx, sx, sy, sw, sh, sx, sy, sw, sh);
      ctx.filter = 'none';
    } else {
      bgDrawImage(ctx, x, yy, w, h, x, yy, w, h);
    }
    return;
  }

  const bpad = Math.ceil(TBAR_TEX_BLUR_SIGMA * 3) + 2;
  const pad = Math.ceil(maxOff + 4) + bpad;   // +bpad：模糊要采样到形状外一圈
  const rx = Math.max(0, Math.floor(x - pad)), ry = Math.max(0, Math.floor(yy - pad));
  const rx2 = Math.min(W, Math.ceil(x + w + pad)), ry2 = Math.min(H, Math.ceil(yy + h + pad));
  const rw = Math.max(1, rx2 - rx), rh = Math.max(1, ry2 - ry);
  /* 逐像素那一步只跟「胶囊的几何」和「背景」有关，跟滑块位置（t）无关 ——
     拖动时位置每帧都在变、纹理每行都要重画，但条这一层其实一模一样。
     所以把结果整块缓存起来：命中就直接 putImageData，省掉整趟逐像素循环
     （实测整行重画 4.33ms/帧 → 0.5ms/帧）。 */
  const rkey = rx + ',' + ry + ',' + rw + ',' + rh + '|' + x.toFixed(2) + ',' + yy.toFixed(2)
             + ',' + w.toFixed(2) + ',' + h.toFixed(2) + ',' + r.toFixed(2)
             + '|' + maxOff.toFixed(2) + '|' + bandWidth.toFixed(2) + '|' + bend.toFixed(2)
             + '|' + bgScrollKey();
  if (tbarRefrCache && tbarRefrCache.key === rkey) {
    ctx.putImageData(tbarRefrCache.data, rx, ry);
    return;
  }
  const src = tbarBlurredBg(rx, ry, rw, rh);   // 先糊：与 shader 的 tDiffuse 对应
  const sd = src.data, sw = src.w, sh = src.h;
  const out = ctx.getImageData(rx, ry, rw, rh);
  const od = out.data;
  /* tmp = 折射采样结果（形状外保留原样像素，供后面模糊时卷积取到形状外一圈）；
     covA = 每个像素的胶囊覆盖率，模糊完按它把结果混回原图。 */
  const tmp = new Uint8ClampedArray(od);
  const td = tmp;
  const covA = new Float32Array(rw * rh);
  const cx = x + w / 2, cy = yy + h / 2;
  const eps = 1.0;
  const invBw = 1 / bandWidth;

  for (let py = 0; py < rh; py++) {
    const ay = ry + py + 0.5;
    const ly = ay - cy;
    for (let px = 0; px < rw; px++) {
      const ax = rx + px + 0.5;
      const lx = ax - cx;
      const d = tbarRoundedSDF(lx, ly, bx, by, r);
      if (d >= 0.5) continue;                     // 形状外：原样保留
      const dfe = -d;
      let su = ax, sv = ay;
      if (dfe < bandWidth) {
        const gx = tbarRoundedSDF(lx + eps, ly, bx, by, r) - d;
        const gy = tbarRoundedSDF(lx, ly + eps, bx, by, r) - d;
        const gl = Math.sqrt(gx * gx + gy * gy);
        if (gl > 0.001) {
          let ef = 1 - (dfe * invBw < 0 ? 0 : (dfe * invBw > 1 ? 1 : dfe * invBw));
          ef = Math.pow(ef, bend);
          const off = ef * maxOff;
          /* 与着色器 913 行同号：centerUv = vUv − offset·pixelSize，
             offset 沿外法线 → 采样点往形状内部偏。 */
          su = ax - (gx / gl) * off;
          sv = ay - (gy / gl) * off;
        }
      }
      /* 双线性采样（注意减 0.5：不减的话位移为 0 时 fx=fy=0.5，
         会凭空把相邻 4 个像素平均掉一格，中心区凭空多出 1.5 的差值）。 */
      let u = su - rx - 0.5, v = sv - ry - 0.5;
      let i0 = Math.floor(u), j0 = Math.floor(v);
      const tu = u - i0, tv = v - j0;
      let i1 = i0 + 1, j1 = j0 + 1;
      if (i0 < 0) i0 = 0; if (j0 < 0) j0 = 0;
      if (i1 < 0) i1 = 0; if (j1 < 0) j1 = 0;
      if (i0 > sw - 1) i0 = sw - 1; if (j0 > sh - 1) j0 = sh - 1;
      if (i1 > sw - 1) i1 = sw - 1; if (j1 > sh - 1) j1 = sh - 1;
      const o00 = (j0 * sw + i0) << 2, o10 = (j0 * sw + i1) << 2;
      const o01 = (j1 * sw + i0) << 2, o11 = (j1 * sw + i1) << 2;
      const w00 = (1 - tu) * (1 - tv), w10 = tu * (1 - tv);
      const w01 = (1 - tu) * tv,       w11 = tu * tv;
      const R = sd[o00] * w00 + sd[o10] * w10 + sd[o01] * w01 + sd[o11] * w11;
      const G = sd[o00 + 1] * w00 + sd[o10 + 1] * w10 + sd[o01 + 1] * w01 + sd[o11 + 1] * w11;
      const B = sd[o00 + 2] * w00 + sd[o10 + 2] * w10 + sd[o01 + 2] * w01 + sd[o11 + 2] * w11;
      /* 边缘 1px 覆盖率过渡：不这么做的话 putImageData 写出来的胶囊边是硬锯齿。 */
      let cov = 0.5 - d;
      if (cov > 1) cov = 1; else if (cov < 0) cov = 0;
      const o = (py * rw + px) << 2;
      td[o] = R; td[o + 1] = G; td[o + 2] = B; td[o + 3] = 255;
      covA[py * rw + px] = cov;
    }
  }
  /* 【先糊后移 → 这里**不再**模糊】
     对应 shader 1980 行：bgTex !== texture 时 blurRadius = 0，模糊已经全部发生在
     采样源（tbarBlurredBg）里了，位移采样之后不会再糊第二次。
     这里若再糊一次就是「糊两遍」—— 正是之前折射被抹平、看着不明显的原因。 */
  if (TBAR_TEX_SHIFT_FIRST && TBAR_TEX_BLUR_SIGMA > 0 && supportsCanvasFilter()) {
    if (!tbarTmpCv) {
      tbarTmpCv = document.createElement('canvas');
      tbarTmpCtx = tbarTmpCv.getContext('2d');
    }
    if (tbarTmpCv.width < rw) tbarTmpCv.width = rw;
    if (tbarTmpCv.height < rh) tbarTmpCv.height = rh;
    tbarTmpCtx.setTransform(1, 0, 0, 1, 0, 0);
    tbarTmpCtx.putImageData(new ImageData(td, rw, rh), 0, 0);
    if (!tbarTmp2Cv) {
      tbarTmp2Cv = document.createElement('canvas');
      tbarTmp2Ctx = tbarTmp2Cv.getContext('2d');
    }
    if (tbarTmp2Cv.width < rw) tbarTmp2Cv.width = rw;
    if (tbarTmp2Cv.height < rh) tbarTmp2Cv.height = rh;
    const t2 = tbarTmp2Ctx;
    t2.setTransform(1, 0, 0, 1, 0, 0);
    t2.clearRect(0, 0, tbarTmp2Cv.width, tbarTmp2Cv.height);
    t2.filter = 'blur(' + TBAR_TEX_BLUR_SIGMA.toFixed(2) + 'px)';
    t2.drawImage(tbarTmpCv, 0, 0, rw, rh, 0, 0, rw, rh);
    t2.filter = 'none';
    const bd = t2.getImageData(0, 0, rw, rh).data;
    for (let i = 0; i < rw * rh; i++) {
      const cv = covA[i];
      if (cv <= 0) continue;
      const o = i << 2;
      od[o]     += (bd[o]     - od[o])     * cv;
      od[o + 1] += (bd[o + 1] - od[o + 1]) * cv;
      od[o + 2] += (bd[o + 2] - od[o + 2]) * cv;
      od[o + 3] += (255       - od[o + 3]) * cv;
    }
  } else {
    for (let i = 0; i < rw * rh; i++) {
      const cv = covA[i];
      if (cv <= 0) continue;
      const o = i << 2;
      od[o]     += (td[o]     - od[o])     * cv;
      od[o + 1] += (td[o + 1] - od[o + 1]) * cv;
      od[o + 2] += (td[o + 2] - od[o + 2]) * cv;
      od[o + 3] += (255       - od[o + 3]) * cv;
    }
  }
  ctx.putImageData(out, rx, ry);
  tbarRefrCache = { key: rkey, data: out };
}

function createThumbBgTexture() {
  if (!thumbTexCanvas) {
    thumbTexCanvas = document.createElement('canvas');
    thumbTexCanvas.width = W; thumbTexCanvas.height = H;
    thumbTexCtx = thumbTexCanvas.getContext('2d');
    thumbTexFull = true;
  }
  const ctx = thumbTexCtx;
  /* ① 先铺整屏真实背景（不是留透明）。
     滑块玻璃的折射位移最大 = minSide × REFRACT × 0.01 ≈ 21.6 设备px，
     而滑块离轨道边只有 2 CSS px（= 4 设备px）—— 采样点会落到轨道外面去。
     轨道之外若留着 alpha=0，WebGL 上传时会反预乘成 rgb(0,0,0)，
     于是玻璃上下两侧折射出一道黑弧，看着像脏边。 */
  if (thumbTexFull || thumbTexDim !== bgDim) {
    try {
      const src = bgSourceEl;
      if (src) bgDrawImage(ctx, 0, 0, W, H, 0, 0, W, H);
    } catch (e) {}
    // ② 深色模式：背景压暗（与 shader 里 bgDim 一致）。
    //    轨道是 DOM 画的、不参与 shader 压暗，所以必须在画轨道之前只压背景这一层。
    if (bgDim > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, bgDim) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    thumbTexDim = bgDim; thumbTexFull = false;
    texNeedFull = true;      // 背景整屏重铺过 → 纹理必须整传一次
    /* 缓存的「模糊背景 / 折射结果」同样作废：背景换了、深浅色变了，
       缓存里那批像素就是旧的。 */
    tbarBlurCache = null; tbarRefrCache = null;
  }
  const fullRedraw = texNeedFull;
  /* ③ 四条轨道：只重画「参数变了」的那几条。
     签名覆盖这一行绘制用到的全部输入（进度 t、本体缩放 bs、深浅、场景几何）。
     拖动时只有手指底下那一行的 t 在变，其余三行直接跳过 —— 重画和上传都省掉。 */
  const dirty = [];
  for (let i = 0; i < swRowY.length; i++) {
    const thSt0 = swThumbs[i];
    const bs0 = thSt0 ? 1 - Math.max(0, thSt0.grow) * TEX_TRACK_SHRINK_AT_FULL : 1;
    const t0 = (sceneMode === 'slider')
      ? swRowT(i)
      : (thumbTweenT[i] === undefined ? swRowT(i) : thumbTweenT[i]);
    /* 标签栏要把弹起倍率算进签名：图标在纹理里是跟着 tbarBounce 放大的，
       不进签名的话浮起/沉降那几百毫秒里纹理一次都不重画，
       玻璃里的图标就永远停在静止尺寸 —— 「图标不跟着弹起」。
       浮起完成后 bounce 恒定，签名不动，纹理不再重画（拖动时零开销）。 */
    const sig = sceneMode + '|' + SW_TRACK_W + 'x' + SW_TRACK_H + '|'
              + (+t0).toFixed(4) + '|' + bs0.toFixed(4) + '|' + bgDim.toFixed(3)
              + (sceneMode === 'tabbar' ? '|b' + tbarBounce.toFixed(4) : '')
              /* 选中色的渐变进度也要进签名：绯红是画在纹理里的，
                 不进签名的话玻璃里的颜色只会硬跳一次，跟不上 DOM 的淡入淡出。
                 量化到 0.02（50 档）：120ms 的补间里约重画 8 帧，够了；
                 补间结束后 amt 恒为 0/1，签名不动 → 不再重画。 */
              + (sceneMode === 'tabbar'
                   ? '|c' + tbarColorAmt.map(a => Math.round(a * 50) / 50).join(',')
                   : '');
    if (!fullRedraw && texRowSig[i] === sig) continue;
    texRowSig[i] = sig;
    const r = trackRegion(i);
    dirty.push({ r, slot: i });
    ctx.clearRect(r.x, r.y, r.w, r.h);
    try {
      bgDrawImage(ctx, r.x, r.y, r.w, r.h, r.x, r.y, r.w, r.h);
    } catch (e) {}
    if (bgDim > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, bgDim) + ')';
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    /* 滑块场景是连续值，只认 swRowT()（= row.on，拖动时 setT 已更新）；
       开关场景才走那条 0/1 的 thumbTweenT 补间。
       （上面算签名时已经取过一次，这里直接复用，避免同一帧里取两遍。） */
    const t = t0;
    /* 折射纹理里的轨道必须跟着「本体缩小」一起缩 —— 之前这里是写死的
       66 × SW_TRACK_H（圆角 13），本体缩到 80% 后，DOM 上看到的是小轨道，
       玻璃里折射出来的却还是原尺寸的大轨道，对不上。
       现在用与 DOM 完全同一个 bodyShrink，几何严格一致。 */
    const thSt = swThumbs[i];
    /* 用独立的 TEX_TRACK_SHRINK_AT_FULL，而不是 DOM 用的 TRACK_SHRINK_AT_FULL（=0）。
       这两者现在是分离的：
         · DOM 滑杆本体   —— 用户直接看到的那根，保持原版 66×26 固定，不变形
         · 玻璃里折射出的影像 —— 玻璃浮起后离背景更远，透过它看到的范围变大、
            里面的东西显得更小（参考图里玻璃明显裹住一条缩小的滑杆）
       所以纹理里的轨道要缩，DOM 上的不缩。 */
    /* 滑块场景（细调节杆）不缩：那条线本来就只有 8px 高，再缩就更细、玻璃里
       几乎看不见了。只有开关场景才缩 —— 那边是 66×26 的粗轨道，缩一点才有
       「玻璃离背景更远、里面的东西显得更小」的层次。 */
    const bs = bs0;
    /* 横向单独一个系数：纵向照旧按 TEX_TRACK_SHRINK_AT_FULL 缩（玻璃里的条比外面
       小半号），横向按 TEX_TRACK_X_EXT_AT_FULL **延长**。
       两者必须分开 —— 合成一个 bs 的话，拖到边缘时左右空隙会远大于上下
       （实测 34.5 vs 13.2），条看着像被切短了一截。 */
    const bsx = (sceneMode === 'tabbar')
      ? 1 + Math.max(0, thSt ? thSt.grow : 0) * TEX_TRACK_X_EXT_AT_FULL : bs;
    const twCss = SW_TRACK_W * bsx, thCss = SW_TRACK_H * bs;
    const x = (SW_X - twCss / 2) * SCALE, yy = (swRowY[i] - thCss / 2) * SCALE;
    const w = twCss * SCALE, h = thCss * SCALE;
    if (sceneMode === 'tabbar') {
      /* 标签栏：选中框玻璃背后那条就是整条标签栏，纹理里必须画出来 ——
         否则选中框折射出来的是纯背景，看着像悬空的一块玻璃，
         没有「贴在某条东西上」的层次。
         斜向明暗是必要的：纯色没有细节可折射，玻璃会像塑料片。 */
      /* 【模糊不在这里做】外面那条标签栏本身是 blur 6 的毛玻璃（glasses[7]），
         而选中框玻璃的模糊半径在 setThumbUniforms 里曾被写死成 0 —— 那是
         「透过玻璃的标签栏没有模糊」的真正原因，不是纹理没画。
         现在那里按场景取 glasses[7].blur，本分支只负责给 shader **提供可糊的
         内容**：铺锐利的原背景 + 白色蒙层 + 锐利图标，由 shader 统一模糊。
         曾经试过在纹理里预糊（ctx.filter），两个反例否掉了它：
           · 只糊条：条是平滑渐变，糊与不糊长得一样，肉眼只看得出边缘变软
             （用户反馈「为什么是边缘糊」）；
           · 条与图标一起糊：图标白像素 3296 → 11、峰值 255 → 207，糊没了，
             而 shader 那道模糊还会再糊一次（双重模糊）。 */
      ctx.save();
      roundPath(ctx, x, yy, w, h, (thCss / 2) * SCALE);   // 胶囊：圆角 = 半高 = 32
      ctx.clip();
      /* ① 条内铺「glasses[7] 这块玻璃透出来的样子」—— 模糊 + 折射，两样都要。
            之前这里只铺一层高斯模糊的背景，透过滑块玻璃看到的就是一团普通糊背景：
            没有边缘折射带，玻璃的厚度感、边缘那圈把背景「顶」开的效果全丢了
            （用户反馈：玻璃滑块内的标签栏是普通高斯模糊，不是玻璃材质）。
            现在按片元着色器 875~891 行**同一套公式**把折射位移也画进去，
            参数直接取 glasses[7]，与静态（没有滑块浮起时）那条标签栏严格一致：
              bandWidth   = clamp(minSide × edgeWidth, 2, minSide)
              edgeFactor  = pow(1 − distFromEdge / bandWidth, edgeBend)
              maxOffset   = minSide × refractStrength × 0.01
              采样位置     = 片元位置 − normalDir × edgeFactor × maxOffset
            顺序与 shader 一致：先取模糊后的背景（shader 里是预生成的模糊纹理，
            blurRadius 反而为 0），再按折射位移去采样它 —— 不是先折射后模糊。 */
      const g7 = glasses[7];
      const rf7 = (g7 && g7.refractStrength != null) ? g7.refractStrength : 80;
      const ew7 = (g7 && g7.edgeWidth      != null) ? g7.edgeWidth      : 0.32;
      const bd7 = (g7 && g7.edgeBend       != null) ? g7.edgeBend       : 2.0;
      const minSidePx = Math.min(w, h) / 2;
      const bandPx = Math.max(2, Math.min(minSidePx * ew7, minSidePx));
      const maxOffPx = minSidePx * rf7 * 0.01;
      /* 源矩形要向外留够两样：折射会把条外的背景拉进边缘（最多 maxOffPx），
         模糊自身也要 pad（2×半径）。少任何一样边缘都会发暗发脏。 */
      const pad = Math.ceil(TBAR_TEX_BLUR_PX * 2 + maxOffPx) + 2;
      const sx0 = Math.max(0, Math.round(x - pad));
      const sy0 = Math.max(0, Math.round(yy - pad));
      const sx1 = Math.min(W, Math.round(x + w + pad));
      const sy1 = Math.min(H, Math.round(yy + h + pad));
      const srw = sx1 - sx0, srh = sy1 - sy0;
      if (srw > 0 && srh > 0) {
        /* 模糊单独画在一张暂存画布上：后面每条折射带都要「从这张糊过的图上取样」，
           直接在主画布上糊的话，分带绘制会一遍遍重复触发 filter，慢且会重复糊。 */
        const sc = ensureScratch(i, srw, srh);
        const sctx = sc.ctx;
        sctx.setTransform(1, 0, 0, 1, 0, 0);
        sctx.clearRect(0, 0, srw, srh);
        if (TBAR_TEX_BLUR_PX > 0 && supportsCanvasFilter()) {
          sctx.filter = 'blur(' + TBAR_TEX_BLUR_PX.toFixed(2) + 'px)';
        }
        try { sctx.drawImage(bgSourceEl, sx0, sy0, srw, srh, 0, 0, srw, srh); } catch (e) {}
        sctx.filter = 'none';
        /* 中心区：distFromEdge ≥ bandWidth → edgeFactor = 0 → 不偏移，原样铺。 */
        try { ctx.drawImage(sc.canvas, 0, 0, srw, srh, sx0, sy0, srw, srh); } catch (e) {}
        /* 折射带：沿法线切成 N 条，每条带内偏移量取带中点的值。
           canvas 2D 没有逐像素着色器，只能这样分段近似；
           带宽压到 ≤1 CSS px 时与真折射的差异看不出来。 */
        const NB = Math.max(4, Math.min(16, Math.ceil(bandPx / SCALE)));
        for (let b = 0; b < NB; b++) {
          const d0 = bandPx * b / NB, d1 = bandPx * (b + 1) / NB;
          const dm = (d0 + d1) * 0.5;
          const mag = Math.pow(1 - dm / bandPx, bd7) * maxOffPx;
          const stp = d1 - d0;
          /* 采样位置 = 片元 − normalDir×mag：
             上边缘 normalDir=(0,−1) → 取下方 +mag 处的背景；
             下/左/右同理，符号相反。 */
          drawTexBand(ctx, sc.canvas, sx0, sy0, x, yy + d0,      w, stp,  0,  mag);
          drawTexBand(ctx, sc.canvas, sx0, sy0, x, yy + h - d1,  w, stp,  0, -mag);
          drawTexBand(ctx, sc.canvas, sx0, sy0, x + d0,     yy, stp, h,  mag, 0);
          drawTexBand(ctx, sc.canvas, sx0, sy0, x + w - d1, yy, stp, h, -mag, 0);
        }
      }
      /* ② 再叠半透明白蒙层 —— 就是 DOM 上那条标签栏玻璃的染色。 */
      const g = ctx.createLinearGradient(x, yy, x + w, yy + h);
      g.addColorStop(0, 'rgba(255,255,255,0.34)');
      g.addColorStop(1, 'rgba(255,255,255,0.18)');
      ctx.fillStyle = g; ctx.fillRect(x, yy, w, h);
      ctx.restore();
      /* 图标与文字必须画进纹理，而且是**真身**（白色，与 DOM 一致）：
         选中框玻璃已经压在内容层之上（见 .tbar-item 的注释），玻璃遮住的那块
         只能靠这张纹理提供画面 —— 纹理里没有图标，玻璃下就是一片空白；
         纹理里画成暗影，玻璃下就是一个暗斑（之前 alpha 0.25 深色的版本即如此）。
         画成与 DOM 同样的白色，玻璃内外的图标才能接得上，只有折射带把它推歪。 */
      const items = (tbarTexItems && tbarTexItems.length) ? tbarTexItems : measureTbarTexItems();
      if (items) {
        /* 条随浮起缩小（TEX_TRACK_SHRINK_AT_FULL），但**图标与文字不跟着条缩** ——
           它们只跟着「整排弹起」放大（以整排中心为原点），与外面 DOM 上那三个
           图标严格同一个变换。
           之前图标是「先按条中心缩 bs、再按整排中心放大 bsB」，两次变换的原点
           不同（条中心 157 vs 整排中心 195），两端的图标净位移不为零：实测最左
           偏 +10.40、最右偏 −9.40，玻璃顶到头时图标对不准玻璃中心（中间那个
           恰好在条中心上，所以一直是对的 —— 这也是之前没发现的原因）。
           现在把它与 DOM 统一，玻璃中心 ≡ 图标中心，任何位置都对齐。
           不缩会不会让图标飘到条外？条缩到 bs 后是 [157−132bs, 157+132bs]，
           tex=0.12 时 [40.8, 273.2]，两端图标（弹起后 68.5 / 240.9）仍在条内，安全；
           若把 tex 调到 0.28 以上，条会收到 [62.9, 251.1]，图标就开始贴边了。
           缓存的 it.* 是静止坐标（measureTbarTexItems 已除掉 DOM 的放大），
           这里乘回来即可，不必每帧重量 DOM。 */
        const bsB = 1 + tbarBounce;
        const bx = TBAR_ROW_CX * SCALE, by = TBAR_Y * SCALE;
        const gx = (v) => (bsB === 1 ? v : bx + (v - bx) * bsB);
        const gy = (v) => (bsB === 1 ? v : by + (v - by) * bsB);
        ctx.save();
        /* 图标与文字在纹理里保持锐利 —— 模糊统一由玻璃 shader 做。
           在纹理里预糊是错的：实测 0.30 倍时白色像素从 3296 掉到 11、峰值 255→207，
           图标直接糊没，而 shader 那道模糊还会再糊一次。锐利画进去，由 shader
           决定糊多少，才和外面那些玻璃是同一套机制。 */
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (let k = 0; k < items.length; k++) {
          const it = items[k];
          const ix = gx(it.ix), iy = gy(it.iy), isz = it.is * bsB;
          /* 按渐变进度 amt 在「白 ↔ 绯红」之间插值 —— 与 DOM 上 .tbar-item 的
             inline color 用同一个函数 tbarItemColor()，玻璃内外永远同色、同步渐变。
             （不再用 isSel 二值取色：那样玻璃里是硬跳变，跟不上 DOM 的淡入淡出。）
             先描一圈极淡的暗边再压主体：白图标盖在 22% 白的条上对比会不足，
             这圈暗边把图标轮廓从条里「抠」出来，透过玻璃才认得出是图标。
             （绯红那一项同样先描暗边：红在浅色条上边缘发虚，描边能收住轮廓。） */
          const main = tbarItemColor(tbarColorAmt[k] || 0);
          ctx.strokeStyle = 'rgba(6,16,30,0.45)';
          ctx.fillStyle = 'rgba(6,16,30,0.45)';
          ctx.lineWidth = 4.2;
          drawTbarGlyph(ctx, k, ix, iy, isz, 4.2);
          ctx.font = '600 ' + (it.fs * bsB).toFixed(2)
                   + 'px -apple-system, "PingFang SC", system-ui, sans-serif';
          ctx.fillText(it.text, gx(it.tx), gy(it.ty));
          ctx.strokeStyle = main;
          ctx.fillStyle = main;
          drawTbarGlyph(ctx, k, ix, iy, isz, 2.4);
          ctx.fillText(it.text, gx(it.tx), gy(it.ty));
        }
        ctx.restore();
      }
      /* ④ 边缘高光（rim）—— 玻璃材质最关键的一笔，也是「普通高斯模糊」与
            「玻璃」的分界。
            静态、没有滑块浮起时，那条标签栏的高光由 shader 画（见 1038~1047 行）：
              rimW = clamp(minSide × 0.025, 1.1, 2.0)   —— 贴边一圈极细的白线
              amt  = exp(−d³×2) × (迎光 0.26+0.74·facing + 背光 0.25) × rimStrength
            纹理里之前完全没画这一圈 —— 于是透过滑块看到的条只剩「糊背景 + 白蒙层
            + 图标」，糊背景把折射位移也抹平了，整体看着就是普通高斯模糊，
            没有玻璃的厚度感。这里按 glasses[7].rim 同一套强度把它补上。
            线宽取 2×rimW：stroke 以路径为中心，外半被 clip 掉，只剩内半 ≈ rimW。
            迎光/背光用一条纵向渐变近似（上亮下淡），与 shader 的 dirw 同向。 */
      const rim7 = (g7 && g7.rim != null) ? g7.rim : 0.60;
      if (rim7 > 0) {
        ctx.save();
        roundPath(ctx, x, yy, w, h, (thCss / 2) * SCALE);
        ctx.clip();
        const rimW = Math.max(1.1, Math.min(2.0, minSidePx * 0.025));
        ctx.lineWidth = rimW * 2;
        const rg = ctx.createLinearGradient(0, yy, 0, yy + h);
        rg.addColorStop(0.00, 'rgba(255,255,255,' + (0.85 * rim7).toFixed(3) + ')');
        rg.addColorStop(0.50, 'rgba(255,255,255,' + (0.32 * rim7).toFixed(3) + ')');
        rg.addColorStop(1.00, 'rgba(255,255,255,' + (0.16 * rim7).toFixed(3) + ')');
        ctx.strokeStyle = rg;
        ctx.lineJoin = 'round';
        roundPath(ctx, x, yy, w, h, (thCss / 2) * SCALE);
        ctx.stroke();
        ctx.restore();
      }
    } else if (sceneMode === 'slider') {
      /* 滑块场景：一条细线，左侧（已走过）亮蓝、右侧淡蓝，分界 = 滑块位置 t。
         用 clip 保证左边那一头也是圆角 —— 直接画个矩形会把左端的圆角切掉。 */
      const rr = Math.min(w, h) / 2;
      ctx.save();
      roundPath(ctx, x, yy, w, h, rr);
      ctx.clip();
      ctx.fillStyle = SL_TRACK_OFF; ctx.fillRect(x, yy, w, h);
      const fw = Math.max(0, Math.min(w, w * sliderFillFrac(t)));
      if (fw > 0.5) {
        /* 亮蓝那一头要圆润：以前是 fillRect 硬切成一条垂直直线，
           透过玻璃看是个生硬切口。现在填充自己画成胶囊（圆角 = 半高），
           分界处就是个圆头。fw 小于轨道高时圆角取 fw/2，退化成小椭圆。 */
        ctx.fillStyle = SL_TRACK_ON;
        roundPath(ctx, x, yy, fw, h, Math.min(fw, h) / 2);
        ctx.fill();
      }
      ctx.restore();
    } else {
      // 轨道实色 + 一道斜向明暗：纯色没有细节可折射，玻璃看着会像塑料片
      const g = ctx.createLinearGradient(x, yy, x + w, yy + h);
      g.addColorStop(0, mixRGB(TRACK_OFF[0], TRACK_ON[0], t));
      g.addColorStop(1, mixRGB(TRACK_OFF[1], TRACK_ON[1], t));
      roundPath(ctx, x, yy, w, h, (thCss / 2) * SCALE);   // 胶囊：圆角 = 半高
      ctx.fillStyle = g; ctx.fill();
    }
  }
  if (!thumbTex) {
    thumbTex = new THREE.CanvasTexture(thumbTexCanvas);
    thumbTex.minFilter = THREE.LinearFilter;
    thumbTex.magFilter = THREE.LinearFilter;
    thumbTex.needsUpdate = true;      // 首次：整传一次，纹理才有存储可供后续局部更新
    texNeedFull = false;
    return thumbTex;
  }
  uploadThumbTex(dirty, fullRedraw);
  texNeedFull = false;
  return thumbTex;
}

/* 只把变化的那几块推到 GPU，而不是整屏 5MB 重传。
   实测（swiftshader）：整屏 texImage2D 4.9ms，600×160 的 texSubImage2D 0.4ms。
   拖动时每帧都要传一次，这一项占了整帧的 82% —— 就是「拖起来发涩」的来源。 */
function uploadThumbTex(regions, full) {
  if (!thumbTex) return;
  if (full || !tRenderer) { thumbTex.needsUpdate = true; return; }
  if (!regions.length) return;
  const gl = tRenderer.getContext();
  if (!gl) { thumbTex.needsUpdate = true; return; }
  let handle = null;
  try { const pp = tRenderer.properties.get(thumbTex); handle = pp && pp.__webglTexture; } catch (e) {}
  if (!handle) { thumbTex.needsUpdate = true; return; }   // 还没整传过 → 先整传一次

  /* three 用 flipY=true 上传：纹理第 t 行 = canvas 第 (H-1-t) 行。
     要把 canvas 的 [y, y+h) 这段推上去，目标行号是 H-y-h。 */
  const prev = gl.getParameter(gl.TEXTURE_BINDING_2D);
  gl.bindTexture(gl.TEXTURE_2D, handle);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  for (let k = 0; k < regions.length; k++) {
    const r = regions[k].r;
    const x = Math.max(0, Math.floor(r.x)), y = Math.max(0, Math.floor(r.y));
    const w = Math.min(W - x, Math.ceil(r.w)), h = Math.min(H - y, Math.ceil(r.h));
    if (w <= 0 || h <= 0) continue;
    /* texSubImage2D 没有「源矩形」参数，上传尺寸由 canvas 自身尺寸决定，
       所以中转 canvas 必须正好是 w×h —— 按行号缓存，尺寸在同一场景内是固定的。 */
    const d = regions[k];
    const sc = ensureScratch(d.slot, w, h);
    if (!sc) continue;
    const c = sc.ctx;
    c.clearRect(0, 0, w, h);
    c.drawImage(thumbTexCanvas, x, y, w, h, 0, 0, w, h);
    try { gl.texSubImage2D(gl.TEXTURE_2D, 0, x, H - y - h, gl.RGBA, gl.UNSIGNED_BYTE, sc.canvas); } catch (e) {}
  }
  gl.bindTexture(gl.TEXTURE_2D, prev);   // 还原绑定，别打乱 three 的纹理状态缓存
}

function ensureScratch(slot, w, h) {
  let s = texScratch[slot];
  if (!s) { s = texScratch[slot] = { canvas: document.createElement('canvas'), ctx: null, w: 0, h: 0 }; s.ctx = s.canvas.getContext('2d'); }
  if (s.w !== w || s.h !== h) { s.canvas.width = w; s.canvas.height = h; s.w = w; s.h = h; }
  return s;
}

function setThumbUniforms(cxCss, cyCss, wCss, hCss, lift) {
  const u = tMaterial.uniforms;
  u.resolution.value.set(W, H);
  u.glassCenter.value.set(cxCss * SCALE, H - cyCss * SCALE);
  // 玻璃尺寸：宽高都按 grow 放大，保持圆润的圆形（只放宽度会变成压扁的椭圆，看着"歪"）
  u.glassSize.value.set(wCss * SCALE, hCss * SCALE);
  // 圆角随放大同步：min(宽,高)/2，放大前后都是正圆，不会歪
  u.borderRadius.value = Math.min(wCss, hCss) * 0.5 * SCALE;

     曾试着把滑块玻璃改成真椭圆（shapeMode=1），但用户要的是「透过玻璃看到的
     进度条端头圆润」，不是玻璃本身圆润 —— 玻璃改回胶囊，原版。
     shapeMode uniform 保留，仍可随时切回 1 用真椭圆。 */
  u.shapeMode.value = 0;
  u.refractStrength.value = thumbParam.refractStrength * THUMB_REFRACT_MUL;
  u.dispersion.value = thumbParam.dispersion;
  u.edgeWidth.value = thumbParam.edgeWidth * THUMB_EDGE_W_MUL;
  u.edgeWidthPx.value = thumbParam.edgeWidthPx;
  u.edgeWidthMode.value = 0;                                    // 等比：小玻璃自动收窄
  u.edgeBend.value = THUMB_EDGE_BEND;
  u.rimStrength.value = thumbParam.rim;
  u.bgDim.value = 0;
  u.bgScale.value = 1;
  u.bgOffset.value.set(0, 0);
  u.bgTexSize.value.set(W, H);
  if (thumbTexDirty || !thumbTex) { thumbTex = createThumbBgTexture(); thumbTexDirty = false; }
  u.tDiffuse.value = thumbTex;
  u.tDiffuseSharp.value = thumbTex;
  u.tBackdrop.value = thumbTex;
  /* 【这里必须是 0 —— 在这里开模糊会把图标一起糊掉】
     曾经在这里按场景给 blurRadius 赋 glasses[7].blur，想让「透过玻璃的标签栏带模糊」。
     结果是图标也糊了，原因在 shader 里：
        913 行  clarity = edgeFactor * edgeClarity;
        959 行  gl_FragColor = mix(blurred, sharp, clarity);
     本函数下面把 edgeClarity 设为 0（thumb 玻璃一贯如此），于是 clarity 恒为 0 ——
     输出**永远取 blurred 那一路**，折射带也走模糊版。blurRadius 一旦 >0，被糊的是
     整张 thumbTex：条、蒙层、图标一视同仁，没有「只糊背景」这回事。
     所以这里开模糊 = 图标糊 + 条内细节被抹平，正是用户反馈的「没变化、图标糊糊的」。

     正确的做法与主场景玻璃一致（见 setGlassUniforms 1642~1647）：
        · 主玻璃：tDiffuse 传**预生成好的模糊纹理**，blurRadius 反而设 0；
        · 这里：模糊在**纹理里**做 —— 条内铺模糊后的背景（TBAR_TEX_BLUR_PX，
          在 drawThumbBgTexture 的 tabbar 分支），图标保持锐利，shader 不再糊一次。
     这样「条是毛玻璃（背景被糊）+ 图标清晰」两件事才分得开。 */
  u.blurRadius.value = 0;
  u.edgeClarity.value = 0;
  u.tintColor.value.setStyle(thumbParam.tint.color);
  u.tintStrength.value = thumbParam.tint.strength / 100;
  u.tintMode.value = 0;
  // 滑块不做果冻形变：它的形变已经由 iOS 那套「按住变宽」的 CSS 动画表达
  u.jelly.value.set(1, 0, 0, 0);
  u.jellyFollow.value = JELLY_FOLLOW;
  u.jellySqueeze.value = JELLY_SQUEEZE;
  u.jellyCorner.value = CORNER_GAIN;
  u.glowPos.value.set(cxCss * SCALE, H - cyCss * SCALE);
  u.pointerAmt.value = 0;                                       // 不需要内透光
  u.glowRadius.value = 1;
  u.glowStretchDir.value.set(1, 0);
  u.glowStretchAmt.value = 0;
  u.glowPlateau.value = GLOW_PLATEAU;
  u.glowEdgeFadePx.value = GLOW_EDGE_FADE_PX;
  u.glowGain.value = GLOW_GAIN;
  u.glowLens.value = GLOW_LENS;
  u.uTime.value = clockT;
  u.drawGlassOnly.value = 1.0;
  u.uAlpha.value = Math.max(0, Math.min(1, lift));
}

/* ---- 标签栏：整条 toolbar 被选中框「带起来」一点 ----
   参考 iOS 26 的时序：pill 浮起 / 拖动时，底下这条 toolbar 会跟着轻轻弹一下，
   弹的方式是**向前变大**（整排等比放大 TBAR_BOUNCE），不是往上平移；
   但**透过玻璃看到的标签栏仍是没弹起的那一版静止画面** ——
   也就是条本体与玻璃都放大了，折射出来的影像却停在原尺寸原位置
   （玻璃变大后采到的是静止那版，正是参考图里「玻璃里的条比外面的小半号」那个观感）。

   实现上分四缺一不可：
     ① 玻璃：glasses[7]（条）/ glasses[8]（搜索按钮）以整排中心为原点等比放大；
     ② DOM：.tbar / .tbar-search 用同一个原点 scale（写在 syncLabels 里）；
     ③ 选中框玻璃：随父级 .tbar 的 scale 一起放大（thumbStep 末尾的 bounce 映射），
        否则本体会比玻璃大一圈，玻璃盖不住；
     ④ 折射纹理：不放大 —— 条与图标一直按 SW_X / swRowY 这些常量画在静止位置，
        measureTbarTexItems 里再把 DOM 量到的放大倍率除掉，保证量到的都是静止坐标。
   放大倍率只跟 lift（同一条 easeOutQuad 上升 / smootherstep 沉降），
   所以条与 pill 严格同步，不会出现「条先动、框后动」。 */
let tbarBounce = 0;
/* 上一次写进 DOM 的弹起倍率：主循环里 syncLabels 跑在 thumbStep 之前，
   DOM 会慢一帧，用这个标记在 thumbStep 之后补写一次（见主循环）。 */
let tbarBouncePrevForDom = 0;
function stepTabbarBounce() {
  if (sceneMode !== 'tabbar') return 0;
  const th = swThumbs[0];
  if (!th) return 0;
  const l = Math.max(0, Math.min(1, th.lift));
  return Math.round(TBAR_BOUNCE * l * 10000) / 10000;
}
/* 把一块玻璃按「整排中心」等比摆到放大 s 倍后的位置。 */
function setTbarGlassBox(idx, cxCss, cyCss, wCss, hCss, s) {
  const g = glasses[idx];
  /* homeX/homeY 与 x/y 一起写：stepGlass 每帧把 x 往 homeX 拉，只改 homeX 的话
     玻璃会滞后于 DOM 约 40ms（ζ=0.48、ω≈22.8），图标和条会错开 1px 左右。 */
  g.x = g.homeX = (TBAR_ROW_CX + (cxCss - TBAR_ROW_CX) * s) * SCALE;
  g.y = g.homeY = (TBAR_Y + (cyCss - TBAR_Y) * s) * SCALE;
  g.width  = wCss * s * SCALE;
  g.height = hCss * s * SCALE;
  g.borderRadius = Math.min(g.width, g.height) / 2;   // 胶囊 / 正圆
  g.vx = 0; g.vy = 0;
  /* DOM 侧的 transform-origin 必须同样是「条自己的中心」（TBAR_ROW_CX）——
     默认以元素自身中心放大的话，放大后的中心与这里算出的中心不重合
     （实测差 2.3px），条和玻璃就错开。 */
  const ic = iconEls[idx];
  if (ic) {
    ic.style.transformOrigin = (TBAR_ROW_CX - (cxCss - wCss / 2)).toFixed(2) + 'px '
                             + (TBAR_Y     - (cyCss - hCss / 2)).toFixed(2) + 'px';
    /* DOM 的 scale 必须在这里就写下去，不能等到 syncLabels：
       thumbStep 紧接着要读 .tbar-sel 的 rect，而选中框是 .tbar 的子元素，
       父级 scale 一变它的 rect 就变。syncLabels 跑在 thumbStep 之前、用的是上一帧的
       倍率 —— 留到那时再写，thumbStep 读到的 rect 就慢一帧，
       实测把中心算偏 0.84px（玻璃 56.96 vs 应为 56.12）。 */
    ic.style.transform = jellyTransform(g, LABEL_SQUASH)
                       + (s > 1.0005 ? ' scale(' + s.toFixed(4) + ')' : '');
  }
}
function applyTabbarBounce(b) {
  b = Math.round((b || 0) * 10000) / 10000;
  if (b === tbarBounce) return;
  tbarBounce = b;
  const s = 1 + b;
  /* 只弹条（glasses[7]），**不弹搜索按钮（glasses[8]）** ——
     搜索按钮是独立的一块圆形玻璃，用户要求「点击拖动标签栏时只有标签栏弹起」，
     它保持原尺寸原位置。它的盒子从未被改写过（makeGlass 建好就静态），
     所以这里不调用 setTbarGlassBox(8, ...) 即可，不需要额外复位。
     原点现在是条自己的中心 TBAR_ROW_CX = TBAR_X = 157（见那里的注释）：
     以自身中心等比放大，左右对称张开，不会像以整排中心那样把条往左带 4.3px。 */
  setTbarGlassBox(7, TBAR_X, TBAR_Y, TBAR_W, TBAR_H, s);
  tbarBouncePrevForDom = b;   // 上面已经把这份倍率写进 DOM 了
}

/* 滑块玻璃层（#thumb-glass-canvas）是**整屏覆盖**的一块独立 canvas：
   z-index 6、pointer-events none，画的是滑块/标签栏浮起时的那块玻璃。
   它只在 slider / tabbar 两个场景被重画（thumbStep 走到最后那段才会 clear + render）。
   切到别的场景（尤其是控制中心）后 swRows 为空 → thumbStep 提前 return →
   **既不清空也不重画**，于是这块 canvas 原样保留着「切走那一帧」的画面 ——
   从标签栏长按让滑块浮起、在玻璃还没沉下去时立刻退出再进控制中心，
   屏幕上就会赫然留着那一帧浮起的滑块玻璃，位置正好是标签栏的 y。
   所以：不在 slider / tabbar 场景时必须主动清一次。用标志位控制只清一次，
   免得每帧都发一次全屏 WebGL clear。 */
let thumbGlassCleared = false;
function clearThumbGlassOnce() {
  if (!tRenderer || thumbGlassCleared) return;
  tRenderer.setClearColor(0x000000, 0);
  tRenderer.clear();
  thumbGlassCleared = true;
}
/* 【把用不到的整屏画布从合成里彻底拿掉 —— 手机比电脑卡的主因】
   #thumb-glass-canvas 是 position:absolute; inset:0 的**整屏** canvas，
   CSS 里恒为 display:block，所以哪怕一个像素都不画，浏览器合成器每帧
   仍要为它做一次全屏 alpha 混合。页面上一共 3 个 WebGL 上下文
   （主 renderer / mRenderer / tRenderer），其中 menu-glass-canvas 在
   body:not(.menu-open) 时父层是 visibility:hidden，不参与合成；
   只有这块 thumb canvas 是**永远可见**的额外一层。

   合成开销跟的是「CSS 尺寸 × DPR」，跟 drawing buffer 无关：
     电脑 DPR=1：390×844 = 33 万像素/层
     手机 DPR=3：897×1941 = 174 万像素/层
   手机上多一层全屏合成 = 每帧多 174 万像素的 alpha 混合，走的还是
   共享内存带宽 —— 这正好解释「GPU 性能相近，电脑 100fps、手机 30fps」。

   所以：不画滑块玻璃的场景（control / buttons / 主页）直接 display:none，
   浏览器连这一层的合成都跳过；要画时再恢复。清与显隐合到一个函数里，
   免得出现「清了但还在合成」或「隐藏了但没清」的半吊子状态。 */
let _thumbShown = true;
function showThumbGlass() {
  if (_thumbShown) return;
  const el = document.getElementById('thumb-glass-canvas');
  if (el) el.style.display = 'block';
  _thumbShown = true;
  thumbGlassCleared = false;      // 重新可见，下次隐藏前要重新清
}
function hideThumbGlass() {
  clearThumbGlassOnce();
  if (!_thumbShown) return;
  const el = document.getElementById('thumb-glass-canvas');
  if (!el) return;
  el.style.display = 'none';
  _thumbShown = false;
}

function thumbStep(dt) {
  slJumpStep();      // 点击轨道跳转的补间（滑块场景）：推进 row.on / baseX / fill 宽度
  tabJumpStep();     // 标签栏：点击别的标签 / 松手吸附的补间
  /* 标签栏选中色的淡入淡出。放在这里（menu-open 判断之前）是为了：
     在主页 / 其它场景时补间也要跑完，否则「切场景时正好在渐变中途」会把
     颜色卡在一个半红不白的值上，下次回标签栏就是脏的。 */
  if (tbarColorStep(dt * 1000)) thumbTexDirty = true;
  if (document.body.classList.contains('menu-open')) {
    /* 在主页面时不跑弹簧，但必须把「挂起的延迟松手」和按住态清干净：
       定时器是在开关场景里排的，回到主页后它照样会触发 —— 会把滑块拉长、
       把 lift 拉起来，而这里又不跑弹簧 → 玻璃永远卡在半浮起的状态。
       所以每帧兜底清一次（有残留才动 DOM，开销可忽略）。 */
    for (let i = 0; i < swThumbs.length; i++) {
      const th = swThumbs[i];
      if (th.lift !== 0 || th.liftV !== 0 || th.liftHeld || th.mustRise || th.phase !== 0) {
        th.lift = 0; th.liftV = 0; th.liftHeld = false; th.mustRise = false;
        th.phase = 0; th.tp = 0; th.grow = 0;
        th.jel = 0; th.jelV = 0; th.jelT = 0; th.jelHeld = false; th.jelFree = false; th.jelVel = 0; th.cxPrev = -1;
      }
      if (swReleaseTimer[i]) { clearTimeout(swReleaseTimer[i]); swReleaseTimer[i] = 0; }
      const s = switchEls[i] && switchEls[i].sw;
      if (s && (s.classList.contains('press') || s.classList.contains('drag'))) {
