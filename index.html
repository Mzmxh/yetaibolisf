     必须在这里清（见 clearThumbGlassOnce 的注释）。
     注意开关场景（switches）也要画：按下开关时白点浮起变玻璃，画的就是这一层，
     不能把它排除在外（曾漏掉它，表现为「点开关玻璃不浮起、直接消失」）。 */
  if (sceneMode !== 'switches' && sceneMode !== 'slider' && sceneMode !== 'tabbar') {
    hideThumbGlass(); return;
  }
  /* 这三个场景里控件集合也可能为空（切场景当帧 switchEls 刚换成空数组），
     下面一趟都不会跑 —— 同样要清，否则停在上一帧。 */
  if (!swRows || swRows.length === 0 || !thumbEls.length) { hideThumbGlass(); return; }
  // ---- 轨道颜色渐变：与 DOM 轨道的 .30s linear 逐帧同步 ----
  if (stepThumbTrackTween(dt)) thumbTexDirty = true;
  /* 本体缩放（grow）在变 → 折射纹理里的轨道尺寸也要跟着变，
     否则玻璃里透出来的还是没缩的大轨道。 */
  if (stepThumbShrinkTween()) thumbTexDirty = true;
  // ---- 浮起时间轴（替代原双刚度弹簧）----
  const dtMs = dt * 1000;
  for (const th of swThumbs) {
    /* 原来用弹簧：按住 K=420 / 松开 K=240，松手瞬间刚度突变，
       加上 mustRise 中途把目标从 1 改成 0 —— 加速度两次跳变，
       看着就是「一下快一下慢」的力竭感。
       现在改成一条时间轴：lift 只由「相位内归一化进度 + easing」算出，
       全程速度连续，节奏完全可预期。 */
    if (th.phase === 1) {                       // rise：慢慢浮起
      th.tp += dtMs;
      const u = th.tp / LIFT_RISE_MS;
      if (u >= 1) { th.phase = 2; th.tp = 0; th.lift = 1; }
      else th.lift = 1 - (1 - u) * (1 - u);     // easeOutQuad：起步有响应，末尾速度→0
    } else if (th.phase === 2) {                // hold：撞到头后的顶点停留
      th.lift = 1;
      th.tp += dtMs;
      /* 还按着就一直停在顶点（拖动时玻璃保持鼓起）；
         已松手且停留够 HOLD_MS 才进入沉降。 */
      if (!th.liftHeld && th.tp >= LIFT_HOLD_MS) { th.phase = 3; th.tp = 0; }
    } else if (th.phase === 3) {                // fall：沉下去
      th.tp += dtMs;
      const u = th.tp / LIFT_FALL_MS;
      if (u >= 1) { th.phase = 0; th.tp = 0; th.lift = 0; }
      else {
        // smootherstep：起步与末尾速度都为 0 —— 从顶点平滑离开、平滑归位
        const uu = u * u * u * (u * (u * 6 - 15) + 10);
        th.lift = 1 - uu;
      }
    } else {
      th.lift = 0;
    }
    th.mustRise = false;
    th.liftV = 0;
    /* 变形时序：grow 直接由 lift 幂映射，不再走独立的 sstep 分段。
       lift → 1 时 grow 同时到 1，也就是「撞到头刚好完成变形」；
       前段 grow 远小于 lift（只浮起、尺寸几乎不动），后段才鼓起来。
       两者共用同一条曲线，不会再出现尺寸和浮起各走各的节奏。 */
    const rawG = Math.max(0, Math.min(1, th.lift));
    th.grow = Math.pow(rawG, LIFT_GROW_POW);
    /* ---- 回弹弹簧（与按钮 stepGlass 里的 jAmt 同一条式子）----
       按住/拖动中 ζ=1.0 → 稳稳跟上 jelT（=0），不会在拖动时乱抖；
       松手后 ζ=0.20 → 带着释放冲量在 0 附近弹 2~3 下才停。 */
    /* 撞到头的那一下必须在「还按着」的时候也能弹 —— 所以撞头后临时切 ζ=0.20，
       等抖完再切回 ζ=1.0，否则按住中 ζ=1.0 会把它直接压死、一点回弹都看不见。 */
    const cj = ((th.liftHeld || th.jelHeld) && !th.jelFree) ? SW_JELLY_C_DRAG : SW_JELLY_C_FREE;
    /* 固定 1/240s 子步积分：这组刚度/阻尼配显式欧拉，在 dt=1/30 时会发散
       （Jury 判据 1+Tr+Det = -0.65 < 0），只有 60fps 才稳定 —— 掉帧就会炸。
       子步之后低帧率下的行为与 60fps 完全一致。 */
    let jelRem = dt;
    while (jelRem > 1e-6) {
      const hj = Math.min(SW_JELLY_SUB, jelRem);
      jelRem -= hj;
      th.jelV += (-SW_JELLY_K * (th.jel - th.jelT) - cj * th.jelV) * hj;
      th.jel  += th.jelV * hj;
    }
    if (!th.liftHeld && !th.jelHeld && Math.abs(th.jel) < 0.0004 && Math.abs(th.jelV) < 0.004) {
      th.jel = 0; th.jelV = 0; th.jelFree = false;
    }
    if (th.jelFree && Math.abs(th.jel) < 0.0008 && Math.abs(th.jelV) < 0.01) th.jelFree = false;
  }
  /* 必须在下面读 rects（选中框的实时矩形）之前写好：
     .tbar-sel 是 .tbar 的子元素，整条弹起放大后它的 cxCss/cyCss 自动含这份放大，
     玻璃与条才是一起动。写晚了会差一帧，条和框错开。 */
  applyTabbarBounce(stepTabbarBounce());
  // ---- 宽度 / 位置：由 grow 逐帧写，顺序与玻璃放大严格一致 ----
  for (let i = 0; i < thumbEls.length && i < swThumbs.length; i++) {
    const el = thumbEls[i], th = swThumbs[i];
    const w = SW_THUMB_W + SW_PRESS_GROW * th.grow;
    if (th.grow <= 0.0005) { if (el.style.width) el.style.width = ''; }
    else el.style.width = w.toFixed(2) + 'px';
    /* 白点本体随玻璃鼓起而缩小（参考图的行为）。
       用独立的 scale 属性，不占用 transform —— translateX 的位移/过冲回弹照旧。 */
    const shrink = 1 - th.grow * THUMB_SHRINK_AT_FULL;
    /* 缩小必须用 width/height + left/top 居中补偿来写，不能用 CSS scale 属性。
       原因是合成顺序：scale 属性排在 transform 之前（S × T），
       于是 translateX 会被缩小系数一起乘掉 —— 实测右端 18px 只走了 15.3px（18×0.85），
       左端不受影响（0×0.85=0）。行程区间因此不以轨道中心对称（24.0 / 39.3，中心 33），
       玻璃按轨道中心放大后左右探出就不等（16.5 vs 11.0）。
       改写成尺寸 + 居中偏移后，transform 只剩纯位移，行程严格对称。 */
    if (sceneMode === 'slider' || sceneMode === 'tabbar') {
      /* 滑块（细调节杆）/ 标签栏选中框：拉长 / 缩小的居中补偿全部走 left，绝不能写进 transform。
         原因是 .sl-thumb 带 `transition: transform .22s`，而 left / width / height 不带。
         补偿量写进 transform 时，JS 每帧改目标、CSS 过渡在后面追 —— 实测渲染中心
         比目标滞后最多 3.5px：沉降末期先退后进，看着就是「恢复实色前微微向前走一下」。
         改走 left 后 transform 在整个浮起—沉降期间恒为 baseX，过渡无事可做，
         中心严格不动（实测 150.00 → 150.00）。 */
      const rw = w * shrink;                       // 实际渲染宽度
      if (shrink > 0.9995) {
        if (el.style.width) el.style.width = '';
        if (el.style.height) el.style.height = '';
        if (el.style.left) el.style.left = '';
        if (el.style.top) el.style.top = '';
      } else {
        el.style.width  = rw.toFixed(2) + 'px';
        el.style.height = (SW_THUMB_H * shrink).toFixed(2) + 'px';
        // 以「原始宽度」为基准居中：left + rw/2 ≡ SW_THUMB_W/2（与 grow 无关）
        el.style.left   = (SW_PAD + (SW_THUMB_W - rw) / 2).toFixed(2) + 'px';
        el.style.top    = (SW_PAD_Y + SW_THUMB_H * (1 - shrink) / 2).toFixed(2) + 'px';
      }
    } else if (shrink > 0.9995) {
      if (el.style.width) el.style.width = w.toFixed(2) + 'px';
      if (el.style.height) el.style.height = '';
      if (el.style.left) el.style.left = '';
      if (el.style.top) el.style.top = '';
    } else {
      el.style.width  = (w * shrink).toFixed(2) + 'px';
      el.style.height = (SW_THUMB_H * shrink).toFixed(2) + 'px';
      el.style.left   = (SW_PAD + w * (1 - shrink) / 2).toFixed(2) + 'px';
      el.style.top    = (SW_PAD + SW_THUMB_H * (1 - shrink) / 2).toFixed(2) + 'px';
    }
    /* 后面的滑杆本体（轨道）随玻璃鼓起而缩小 —— 这才是参考图里那个效果。
       白点不在 .sw-track 内部，所以两者互不影响。 */
    const tk = trackEls[i];
    if (tk) {
      const ts = 1 - th.grow * TRACK_SHRINK_AT_FULL;
      if (ts > 0.9995) { if (tk.style.scale) tk.style.scale = ''; }
      else tk.style.scale = ts.toFixed(4);
    }
    /* 按住期间位置也要同步补偿：滑块在右端时要向左长，否则右端会跟着变宽一起跑出去。
       按基准位置的比例补偿（左端不补、右端全补），拖动到中间时是连续的。 */
    /* 只要还按着就每帧写位移（原来仅 liftHeld || mustRise 才写）：
       拖拽中途这两者可能都不成立，于是回落到 CSS 的固定 18px（满额补偿），
       而实际拉长量是 SW_PRESS_GROW × grow —— 右端少走 (1−grow)×10px，
       行程区间不再以轨道中心对称，玻璃左右探出就不相等。 */
    /* 松手后 grow 还要衰减一会儿（宽度/left 仍在变），这期间也必须继续写位移，
       否则 JS 只在松手瞬间补写一次 baseX（没有 pad），滑块中心会先飘出去
       半个拉长量再收回来 —— 亮蓝填充的分界看着就是「先偏一下再回正」。
       这条只对滑块（细调节杆）成立：它的分界必须严格跟手，沉降期继续补偿到 grow 归零。

       开关场景恰恰相反 —— 松手后必须停止写 transform，把位移交回 CSS 的弹性过渡
       （iOS 手感：松手 → 白点弹性滑到目标位）。原因是 baseX 存的是「按下瞬间的位置」，
       松手后状态已切到 on，但 baseX 还是旧值（0），于是沉降的这几百毫秒里每帧都在写
       translateX(0px)，把 CSS 的 .sw.on translateX(28px) 死死压制住：
         · 松手瞬间 rAF 里 thumbX(i,NaN) 清空 transform，下一帧又被这里写回；
         · 等 grow 归零、thumbStep 不再写时，残留的 translateX(0px) 永久留在内联样式上，
           继续盖住 CSS —— 表现就是「点了开关，白点纹丝不动」。
       所以开关场景只看是否还按着（liftHeld / press），不看 grow。 */
    const heldNow = th.liftHeld || switchEls[i].sw.classList.contains('press');
    /* 滑块场景：点击跳转的补间在松手后还要跑完，这期间位移必须继续写，
       否则 thumbStep 一停手，滑块就卡在半路、蓝条却已经走完了。 */
    if (heldNow
        || (sceneMode === 'slider' && (th.grow > 0.0005 || slJump[i].active))
        /* 标签栏：点击别的标签 / 松手吸附的补间也要继续写位移，
           否则 thumbStep 一停手，选中框就卡在半路。 */
        || (sceneMode === 'tabbar' && (th.grow > 0.0005 || tabJump.active))) {
      /* 开关：拉长量全补在右端，避免滑块跟着变宽一起跑出轨道。
         滑块（细调节杆）：这里补 0 —— 目的是让滑块「中心」不动，
         这样亮蓝填充的分界才始终落在滑块正中（见 sliderFillFrac）。
         补偿改由 left 承担（上方 slider 分支），因为 .sl-thumb 的 transform
         带 .22s 过渡，写进去会被滞后成「沉降末期向前走一下」。
         补满额的话右端会多退 10px，透过玻璃看分界就偏到滑块左边去了。 */
      const pad = (sceneMode === 'slider' || sceneMode === 'tabbar')
        ? 0                        // 居中补偿已全部走 left（见上方 slider 分支）
        : SW_PRESS_GROW * th.grow * (th.baseX / SW_TRAVEL);
      /* 滑块场景：位移 = sliderThumbTX（含端点外伸），白块与玻璃同心，
         拖动到边缘时不会再从玻璃后面露出一截半透明白块。 */
      const tx0 = (sceneMode === 'slider')
        ? sliderThumbTX(th.baseX / SW_TRAVEL)
        : th.baseX - pad;
      el.style.transform = 'translateX(' + tx0.toFixed(2) + 'px)';
    }
  }
  // 没有 WebGL 时弹簧照跑（状态机保持一致），用 CSS 模拟「浮起」：
  // 白点保持不透明（淡出后底下是空的，反而不如留着），靠放大 + 阴影加深表现抬起。
  if (!tRenderer) {
    for (let i = 0; i < thumbEls.length && i < swThumbs.length; i++) {
      const el = thumbEls[i], th = swThumbs[i];
      const lf = Math.max(0, Math.min(1, th.lift));
      // 宽度同样由 grow 驱动（这一段在 thumbStep 前面已算好），无 WebGL 也要一致
      el.style.width = th.grow > 0.0005 ? (SW_THUMB_W + SW_PRESS_GROW * th.grow).toFixed(2) + 'px' : '';
      el.style.opacity = '';
      el.style.boxShadow = '0 ' + (2 + lf * 7).toFixed(1) + 'px '
                         + (4 + lf * 9).toFixed(1) + 'px rgba(0,0,0,' + (0.18 + lf * 0.12).toFixed(2) + ')';
      const sh = thumbShadowEls[i];
      if (sh) sh.style.opacity = '0';
    }
    return;
  }
  const phoneEl = document.querySelector('.phone');
  const pr = phoneEl.getBoundingClientRect();
  const k = PHONE_W / pr.width;              // 视口 px → 手机内部 CSS px
  showThumbGlass();                          // 这一帧要画，先回到合成里
  tRenderer.setClearColor(0x000000, 0);
  tRenderer.clear();
  thumbGlassCleared = false;        // 这一帧真的画了内容，下次不画时要重新清
  /* 先把 4 个滑块的矩形一次读完，再进绘制循环。
     原来是在循环里边读边写（写完 opacity / 投影立刻读下一个矩形），
     每帧触发 4 次强制同步重排。这里读、写分两趟，整帧只剩 1 次重排。 */
  const nRow = Math.min(thumbEls.length, swThumbs.length);
  const rects = new Array(nRow);
  for (let i = 0; i < nRow; i++) rects[i] = thumbEls[i].getBoundingClientRect();
  for (let i = 0; i < nRow; i++) {
    const el = thumbEls[i], th = swThumbs[i];
    const r = rects[i];
    // 直接读 DOM 滑块的实际矩形：CSS 的位移/变宽/过冲回弹全部自动同步，
    // 不需要在 JS 里再复刻一遍 iOS 的缓动曲线。
    let cxCss = (r.left + r.width / 2 - pr.left) * k;
    let cyCss = (r.top + r.height / 2 - pr.top) * k;
    /* 标签栏：整条 toolbar 弹起时是等比放大（见 stepTabbarBounce），
       .tbar-sel 是 .tbar 的子元素，量到的中心/尺寸已经含这份放大。
       玻璃的位置必须在「静止坐标」里算 —— 端点夹紧 [cMin,cMax] 用的是静止几何，
       带着放大量进去会被当成位移夹掉：实测最左标签弹起时中心从 75.67 挪到 68.5，
       一夹紧又被拉回 75.67，于是本体往外挪了 7px、玻璃却纹丝不动。
       所以先除掉放大倍率还原静止坐标，末尾再把玻璃整体乘回去。 */
    if (sceneMode === 'tabbar' && tbarBounce > 0.0005) {
      const bs = 1 + tbarBounce;
      cxCss = TBAR_ROW_CX + (cxCss - TBAR_ROW_CX) / bs;
      cyCss = TBAR_Y     + (cyCss - TBAR_Y)     / bs;
    }
    /* ---- 惯性形变的目标值：由滑块速度驱动 ----
       先对速度做一阶低通（时间常数 VTAU），滤掉逐帧抖动，形变才连贯；
       再按 |v|/VREF 归一化后乘 INERTIA，得到稳态形变量。
       停在端点/松手后速度自然归零 → jelT 回 0 → 弹簧轻微过冲一下再停住。
       这样形变是「拖动过程中一直有的轻微拉伸」，而不是撞到头才抖一下。 */
    const jActive = th.lift > 0.002 || th.phase !== 0 || th.liftHeld || th.jelHeld;
    /* 惯性形变只在「真正拖动」时才产生（th.dragActive）。
       点击开/关时滑块是被 CSS 弹性曲线滑过去的 —— 那段位移同样会产生速度 → jelT → 拉伸，
       实测点击松手后 jel 会冲到 0.07 左右，就是「点击也会拉伸」。
       现在速度采样和 jelT 一律门控在 dragActive 上：不拖动就恒为 0，点击全程不再拉伸。
       jActive 仍保留，用来判断「玻璃是否根本不存在」——
       进入开关场景时滑块从初始位置动画到目标位（首屏有两个是开着的），
       那段位移也会产生速度；此时 lift=0、玻璃本不该存在，
       SW_JELLY_VIS 那一项会把 alpha 撑到 0.78、画出一条「轨道形状的玻璃」再消失。
       玻璃不存在时才走快速衰减；玻璃还在（点击切换中）就交给弹簧，jel 恒为 0。 */
    if (th.cxPrev >= 0 && dt > 1e-6 && th.dragActive) {
      const vRaw = (cxCss - th.cxPrev) / dt;
      const a = 1 - Math.exp(-dt / SW_JELLY_VTAU);
      th.jelVel += (vRaw - th.jelVel) * a;
    }
    th.cxPrev = cxCss;
    if (!th.dragActive) {
      // 非拖动（点击切换 / 按住不动 / 完全静止）：不累积速度，目标恒为 0
      th.jelVel = 0;
      th.jelT = 0;
      /* 拖动松手后走这里：jelT 归零，已有的 jel 由上面的弹簧（jelHeld 已撤 → ζ=0.45）
         自然收回并轻微过冲一下 —— 这就是「拖动才有的拉伸 + 回弹」。
         玻璃整体都不存在时才额外快速收掉残余，避免下次出现时带出旧形变。 */
      if (!jActive) {
        const dec = Math.exp(-dt / 0.05);
        th.jel *= dec; th.jelV *= dec;
        if (Math.abs(th.jel) < 0.0004 && Math.abs(th.jelV) < 0.004) { th.jel = 0; th.jelV = 0; }
      }
    } else {
      const av = Math.abs(th.jelVel);
      if (av <= SW_JELLY_VDEAD) {
        th.jelT = 0;                       // 慢拖/手抖：不形变
      } else {
        const s = Math.min(1, (av - SW_JELLY_VDEAD) / (SW_JELLY_VREF - SW_JELLY_VDEAD));
        th.jelT = SW_JELLY_INERTIA * Math.pow(s, SW_JELLY_VPOW);
      }
    }
    /* 注意：不能再用 getBoundingClientRect 的宽高 —— 白点被 scale 缩小后，
       rect 读到的是缩小后的尺寸，玻璃就会跟着一起缩，鼓不起来。
       这里用「未缩放的布局宽」解析式计算，玻璃只跟 grow 放大，与白点缩小解耦。 */
    const wCss = SW_THUMB_W + SW_PRESS_GROW * th.grow,
          hCss = r.height * k / ((sceneMode === 'tabbar') ? 1 + tbarBounce : 1);
    /* 玻璃是横向略宽的椭圆（不是正圆，也不是之前 79px 的扁长条）：
       宽跟 wCss（滑块拉长到 58 → 玻璃 62×39，明显比圆宽），高跟 hCss（30 → 39）。
       宽度还要按「当前位置到轨道左右缘的可用半宽」钳一次 —— 否则滑块贴到左/右端时，
       宽 66 的玻璃会有一半探出底座。中间位置可用半宽最大，玻璃也最舒展。 */
    const ls = 1 + th.grow * LIFT_THUMB_SCALE;
    // 纵向不再钳在底座内 —— 要高出底座才叫浮起来。抬升为 0，所以上下探出量相等。
    // 0 → 1 之间插值：静止 30（缩在轨道里），满浮起 52（一半探到轨道外）
    /* 本体（滑杆）缩放后的实际尺寸 —— 玻璃以它为基准，本体缩、玻璃也跟着「贴着」缩，
       再乘适度的放大系数。这样本体缩小不会导致玻璃显得巨大。 */
    const bodyShrink = 1 - th.grow * TRACK_SHRINK_AT_FULL;
    const trackLCss = SW_X - SW_TRACK_W / 2;
    /* 回弹形变：正=横向拉长+纵向收腰，负=横向收窄+纵向鼓起，体积守恒（SQUEEZE=0.5）。 */
    const jl = th.jel * SW_JELLY_MAG;
    /* 基准用 GLASS_BASE_* 而不是 SW_TRACK_* ：
       开关场景两者相同（玻璃与滑杆等长），滑块场景轨道有 300 长、玻璃却要跟着
       46×30 的白色椭圆滑块走 —— 直接用轨道尺寸会把玻璃拉成一根长条。 */
    const gh = GLASS_BASE_H * bodyShrink * (1 + th.grow * GLASS_H_SCALE_AT_FULL)
             * (1 - jl * SW_JELLY_SQUEEZE);
    /* 横向不再按底座半宽钳制 —— iOS 的玻璃滑块鼓起来时会探出底座。 */
    const gw = GLASS_BASE_W * bodyShrink * (1 + th.grow * GLASS_W_SCALE_AT_FULL)
             * (1 + jl);
    /* 玻璃中心再向外偏一截：滑块在轨道内的位置越靠边，玻璃越往外探。
       端部时探出量 = gw/2 + off − 滑块半宽，令它等于 gw × GLASS_OUT_RATIO，
       解出 off 的上限 gw×(RATIO−0.5) + 半宽。中间位置 off=0（玻璃正对滑块），
       两端 ±offMax，玻璃的实际行程比滑块大得多。 */
    /* 归一化必须用「行程进度」而不是「中心在轨道内的绝对位置」。
       之前按 (cx − 轨道左缘 − 半滑块宽) / (轨道宽 − 滑块宽) 算，
       分母是 32，但按住时滑块被拉长到 58px、几乎占满 66px 的轨道，
       中心实际只能走 4px —— 归一化出来的 tn 只落在 0.44~0.54，
       两端偏移一长一短（实测左探 5.5 / 右探 3.85），这就是「两边不一样」。
       现在按当前 grow 下的真实行程端点归一化，两端严格 0 和 1。 */
    /* 玻璃中心以「轨道中心」为基准放大：cxGlass = 轨道中心 + (滑块中心 − 轨道中心) × G。
       G 随浮起量从 1 插值到 GLASS_TRAVEL_GAIN —— 静止时玻璃严格贴在滑块上不偏移，
       满浮起时玻璃的移动幅度是滑块的 G 倍。以中心为基准天然左右对称，
       不会像旧的 offMax 公式那样把 ±(gw/6 + 半宽) 直接加到偏移上、把玻璃甩出轨道。 */
    const trackCxCss = trackLCss + SW_TRACK_W / 2;
    const G = 1 + (GLASS_TRAVEL_GAIN - 1) * th.grow;
    /* 放大之前必须先把滑块中心夹进「当前 grow 下的行程端点」[cMin, cMax]。
       点击时滑块的 CSS 弹性曲线带过冲（cubic-bezier y2=1.2）：实测松手后 120ms
       中心跑到 53.7（端点只有 42），再乘 G=1.8 → 玻璃中心 67.9、右缘比轨道右缘
       多出 32.9px，也就是「整块玻璃甩到底座外面」。过冲被增益放大是纯增益，
       拖到端点时反而只有 16.2 —— 两者差一倍，所以只有点击会炸。
       夹到端点后：过冲不再被放大，点击时的最大探出量 = 拖到端点时的探出量。
       行程式（与 thumbStep 里写位移的公式同源，grow 变化时端点自动跟着变）：
         中心 = SW_PAD + wNow/2 + 位移，位移 ∈ [0, SW_TRAVEL − SW_PRESS_GROW×grow] */
    const wNow = SW_THUMB_W + SW_PRESS_GROW * th.grow;
    // SW_PAD 是相对「轨道」的内边距，必须加上 trackLCss 才是手机坐标
    /* 滑块（细调节杆）的中心行程是整条轨道，两端能顶到 0 / SW_TRACK_W，
       不能再按「半个滑块宽内缩」来夹 —— 那样玻璃会被挡在 23 / 277，
       跟着顶不到端点，蓝条也就填不满。开关场景维持原来的收缩式端点。 */
    /* 标签栏：选中框变宽/缩小的居中补偿走 left（见上方 tabbar 分支），
       transform 恒为 t×SW_TRAVEL —— 中心行程与 grow 完全无关，
       所以要按「未缩放的框宽 SW_THUMB_W」和「满额 SW_TRAVEL」来取端点。
       沿用开关那套（wNow/2 和 −SW_PRESS_GROW×grow）会把它误夹到
       [79.67, 234.34]，而实测真实中心是 [75.67, 238.34] ——
       玻璃在两个端点各比框落后 4px，看着就是「没跟到位」。
       开关场景照旧：它的拉长量全补在右端（pad），端点确实要缩。 */
    const cMin = (sceneMode === 'slider')
      ? trackLCss
      : (sceneMode === 'tabbar' ? trackLCss + SW_PAD + SW_THUMB_W / 2
                                : trackLCss + SW_PAD + wNow / 2);
    const cMax = (sceneMode === 'slider')
      ? trackLCss + SW_TRACK_W
      : (sceneMode === 'tabbar' ? cMin + SW_TRAVEL
                                : cMin + SW_TRAVEL - SW_PRESS_GROW * th.grow);
    const cxIn = Math.max(cMin, Math.min(cMax, cxCss));
    /* 滑块场景：玻璃 = 白块中心（外伸已经含在白块位移里），G 保持 1。
       不能再用「按轨道中心放大」—— 行程有 254px，放大 1.8 会让玻璃飞出屏幕
       （实测最左端 cxGlass = −33.6）。
       也不要在这里再加一次 sliderEndOut：白块的 transform 已经是
       sliderThumbTX（含外伸），cxIn 读到的就是外伸后的中心，再加就双加了。 */
    const cxGlass = (sceneMode === 'slider')
      ? cxIn
      : trackCxCss + (cxIn - trackCxCss) * G;
    const raw = th.lift;
    /* 负向过冲（沉过头）在视觉上打折：弹簧需要它才能保持曲线连续，
       但把负值原样作用在尺寸上，玻璃会缩到比原尺寸还小再弹回来 —— 那正是「跳一下」。 */
    const lf = raw >= 0 ? raw : raw * LIFT_NEG_VIS;
    /* 白点 → 玻璃 的交叉在 lift 0 → 0.30 内就完成。若线性跟随整个 lift，
       中间会有很长一段时间白点和玻璃同时半透明 —— 两层大小不同的图形叠着就是重影，
       看着就是「玻璃歪了」。交接完之后，剩下的 lift 0.30 → 1 是纯玻璃在浮起。 */
    const fade = sstep(0, THUMB_FADE_END, Math.max(0, raw));
    /* 回弹尾段：lift 已经归零、fade 也是 0，但 jel 还在抖 ——
       用 |jel| 撑住一点玻璃 alpha，否则最后那一下回弹根本看不见。 */
    const glassVis = Math.min(1, Math.max(fade, Math.abs(jl) * SW_JELLY_VIS));
    // 不再淡到 0：保留 THUMB_KEEP_ALPHA，让缩小后的滑杆本体以「玻璃里的小芯」可见。
    el.style.opacity = (1 - glassVis * (1 - THUMB_KEEP_ALPHA)).toFixed(3);
    /* 标签栏：整条 toolbar 弹起（等比放大）时，选中框玻璃必须同步放大 ——
       本体 .tbar-sel 是 .tbar 的子元素，父级的 scale 已经把它放大了 6%，
       玻璃不跟着放大就会比本体小一圈、盖不住本体（实测本体会从玻璃边上露出来）。
       以整排中心为原点乘回去，与 DOM 侧的 scale 是严格同一个变换。
       注意 cxGlass / cyCss 上面已经除掉了这份放大（静止坐标），
       所以这里是「算完静止几何再整体映射」，不是在放大后的坐标上再算一遍。 */
    const bsB = (sceneMode === 'tabbar' && tbarBounce > 0.0005) ? 1 + tbarBounce : 1;
    const cyLift = cyCss - Math.max(0, lf) * LIFT_THUMB_RISE;   // 抬起来一点，配合投影才是"浮"
    const fx = (bsB === 1) ? cxGlass : TBAR_ROW_CX + (cxGlass - TBAR_ROW_CX) * bsB;
    const fy = (bsB === 1) ? cyLift  : TBAR_Y      + (cyLift  - TBAR_Y)      * bsB;
    const fw = gw * bsB, fh = gh * bsB;
    const sh = thumbShadowEls[i];
    if (sh) {
      sh.style.left = (fx - fw / 2) + 'px';
      sh.style.top = (fy - fh / 2) + 'px';
      sh.style.width = fw + 'px';
      sh.style.height = fh + 'px';
      sh.style.opacity = Math.max(0, Math.min(1, lf)).toFixed(3);
      sh.style.boxShadow = '0 ' + (2 + Math.max(0, lf) * 7).toFixed(1) + 'px '
                         + (4 + Math.max(0, lf) * 9).toFixed(1) + 'px rgba(0,0,0,'
                         + (0.18 + Math.max(0, lf) * 0.12).toFixed(2) + ')';
    }
    if (raw <= 0.002 && glassVis <= 0.002) continue;   // 完全沉下且不抖：不画，省一次 draw call
    // 放大只跟 grow（后段才变大），不跟 lf —— 否则又变成"一边升一边变大"
    setThumbUniforms(fx, fy, fw, fh, glassVis);
    try {
      const cxD = fx * SCALE, cyD = H - fy * SCALE;
      // 裁剪框必须比放大后的玻璃更大：按住时滑块 58px × 浮起 1.36 ≈ 79 > 轨道宽 51，
      // 会明显伸出轨道（iOS 原生行为），裁剪框留 1.6 倍的余量。
      const sw2 = fw * SCALE * 1.6, sh2 = fh * SCALE * 1.6;
      const pad = Math.max(sw2, sh2) * 0.5 + 10;
      tRenderer.setScissor(Math.max(0, Math.floor(cxD - sw2 / 2 - pad)),
                           Math.max(0, Math.floor(cyD - sh2 / 2 - pad)),
                           Math.min(W, Math.ceil(sw2 + pad * 2)),
                           Math.min(H, Math.ceil(sh2 + pad * 2)));
      tRenderer.setScissorTest(true);
    } catch (e) {}
    tRenderer.render(tScene, tCamera);
    try { tRenderer.setScissorTest(false); } catch (e) {}
  }
}

function renderMenuGlass() {
  if (!mRenderer) return;
  mRenderer.setClearColor(0x000000, 0);
  mRenderer.clear();
  setMenuGlassUniforms(fabGlass);
  mMaterial.uniforms.drawGlassOnly.value = 1.0;   // 只画玻璃，其余透明
  // 裁剪到按钮周边：整屏跑一遍片元着色器太浪费
  try {
    const cx = fabGlass.x, cy = H - fabGlass.y;
    const sw = fabGlass.width, sh = fabGlass.height;
    const pad = Math.max(sw, sh) * 0.6 + 8;
    const x0 = Math.max(0, Math.floor(cx - sw / 2 - pad));
    const y0 = Math.max(0, Math.floor(cy - sh / 2 - pad));
    const x1 = Math.min(W, Math.ceil(cx + sw / 2 + pad));
    const y1 = Math.min(H, Math.ceil(cy + sh / 2 + pad));
    mRenderer.setScissor(x0, y0, x1 - x0, y1 - y0);
    mRenderer.setScissorTest(true);
  } catch (e) {}
  mRenderer.render(mScene, mCamera);
  try { mRenderer.setScissorTest(false); } catch (e) {}
}

/* ================= 目录页 / 场景切换 =================
   目前只有一个场景（玻璃按钮），所以目录里就这一项。 */
const menuPageEl = document.getElementById('menuPage');
let menuOpen = true;   // 默认进入主页面
/* 离开主页的时刻：主页玻璃还要再画 0.45s（配合 menu-page 的 .38s 淡出），
   之后就完全停手 —— 见主循环里 safeRenderMenu 的调用条件。 */
let _menuCloseAt = -1e9;

/* ================= 系统返回键 / 返回手势导航 =================
   整个页面自始至终只有一条历史记录，所以按系统返回键（Android 返回手势、
   iOS 边缘右滑、浏览器后退按钮）会直接退出整个网页 —— 在场景里手一抖
   按下去，页面就没了。
   这里用 History API 补一层：进场景时压一条历史条目，返回键先退回目录页，
   只有停在目录页时再按才真的退出网页。
   顶栏返回箭头走的也是同一条路（见 endDrag 里 moved < TAP_SLOP && g.back），
   两者共用一个出口，历史栈和界面状态才不会各走各的。 */
let _navPushed = false;    // 当前场景是否已经压过历史条目（防止重复压）
let _navFallback = 0;      // history.back() 没唤出 popstate 时的兜底定时器
function navPushScene() {
  if (_navPushed) return;
  try { history.pushState({ lgScene: 1 }, ''); _navPushed = true; } catch (e) {}
}
window.addEventListener('popstate', () => {
  /* popstate 已经把那条历史条目吃掉了，状态先落回「未压栈」，
     否则下面的 showMenu() 会再去 back() 一次，往复不止。 */
  if (_navFallback) { clearTimeout(_navFallback); _navFallback = 0; }
  _navPushed = false;
  /* 已经在目录页就什么都不做 —— 让这一下真的退出网页（顶层就該退出）。 */
  if (!menuOpen) showMenu();
});

function showMenu() {
  if (menuOpen) return;
  /* 场景里还压着历史条目（点顶栏返回箭头、或别处主动退回）：交给
     history.back()，由上面的 popstate 处理器统一走完流程。
     不这么绕一圈的话，目录页上会残留一条历史，变成「要按两次返回才退出」。 */
  if (_navPushed) {
    _navPushed = false;
    if (!_navFallback) {
      _navFallback = setTimeout(() => {
        _navFallback = 0;
        if (!menuOpen) showMenu();     // back() 没生效（极端情况）也别把人卡在场景里
      }, 250);
    }
    try { history.back(); } catch (e) {}
    return;
  }
  menuOpen = true;
  document.body.classList.add('menu-open');
  menuPageEl.setAttribute('aria-hidden', 'false');
}
function showScene(mode) {
  if (!menuOpen) return;
  setSceneMode(mode || 'buttons');
  menuOpen = false;
  _menuCloseAt = (typeof performance !== 'undefined' ? performance.now() : 0);
  document.body.classList.remove('menu-open');
  menuPageEl.setAttribute('aria-hidden', 'true');
  /* 见 setSceneMode 末尾：切场景本身不产生任何动画，必须显式要求重画，
     否则「静止跳过」会让画面停在上一场景的旧帧上。 */
  forceRenderNext = true;
  navPushScene();      // 进场景 = 压一条历史，系统返回键才有的退
}
// 目录里点「玻璃按钮」→ 回到场景
document.getElementById('menuButtonsItem').addEventListener('click', () => showScene('buttons'));
// 目录里点「开关」→ 同一套场景（背景 / 顶栏 / 选择图片都不变），只把四块按钮换成开关
document.getElementById('menuSwitchItem').addEventListener('click', () => showScene('switches'));
// 目录里点「玻璃滑块」→ 同一套场景，中间换成细长调节杆
document.getElementById('menuSliderItem').addEventListener('click', () => showScene('slider'));
// 目录里点「标签栏」→ 同一套场景（背景 / 顶栏 / 选择图片都不变），中间内容后续再填
document.getElementById('menuTabbarItem').addEventListener('click', () => showScene('tabbar'));
// 目录里点「控制中心」→ 同属场景层（背景 / 顶栏 / 选择图片 / 滚动都在），
// 中间不摆任何控件：switchEls 指向空数组，玻璃只留顶栏两个 + 选择图片。
document.getElementById('menuControlItem').addEventListener('click', () => showScene('control'));

/* ================= 场景内容切换：玻璃按钮 / 开关 =================
   两个场景共用同一个 WebGL 场景、同一张流体背景、同一套顶栏与「选择图片」，
   差别只在中间那四块：按钮场景用玻璃按钮（canvas 渲染），
   开关场景把它们摘掉，换成 DOM 的 iOS 开关。摘掉的方式是置 hidden ——
   命中、形变、内透光、模糊档位收集全都跳过它，等于这块玻璃不存在。 */
let sceneMode = 'buttons';
function setSceneMode(mode) {
  sceneMode = mode;

     syncLabels 的逐属性 diff 缓存必须作废，否则新几何会被旧缓存挡住不写入，
     表现就是「切过去之后文字/投影位置不对」。 */

     thumbStep 压根不跑，残留就会一直留在屏幕上（见 clearThumbGlassOnce 注释）。
     开关场景（switches）同属「要画」的那三个，不能清。 */
  if (mode !== 'switches' && mode !== 'slider' && mode !== 'tabbar'
      && typeof thumbGlassCleared !== 'undefined') {

  const sl = (mode === 'slider');

  const ct = (mode === 'control');

     控制中心场景暂空。

        g.jAmt = 0; g.jTr = 0; g.jVel = 0; g.jTrV = 0;
        g._ox = 0; g._oy = 0; g.jHeld = false;
        g.lift = 0; g.liftV = 0; g.liftHeld = false;
      }
      return;
    }

        g._ox = 0; g._oy = 0; g.jHeld = false;

    }

     标签栏玻璃 hidden 之后 syncLabels 会 early-return，不再重写 iconEls[i].transform，

     其余场景 ccRevealStep 首行就 return，这两行对它们没有任何作用。 */

const SW_JELLY_VPOW    = 1.0;   // 线性：慢拖小、快拖大，全程无突然打满
const SW_JELLY_VTAU    = 0.05;  // 速度低通时间常数 s，滤掉逐帧抖动、让形变连贯

const swPressT0 = SW_Y.map(() => 0);
const swReleaseTimer = SW_Y.map(() => 0);

function applySwGeometry(mode) {
  if (mode === 'slider') {

       滑块 46×30 的白色椭圆，左右各留 0 内边距。
       行程按「滑块中心」算，而且中心能一直顶到轨道两端：0 → 300（不是 300−46=254）。
       原来中心只在 23 → 277 之间走，于是亮蓝填充的分界最多到 277，
       轨道两端各有半个滑块宽（23px）永远填不到 —— 就是「进度条顶不到滑杆头」。

    SW_X = 195; SW_TRACK_W = 300; SW_TRACK_H = 8; SW_PAD = 0;
    SW_THUMB_W = 46; SW_THUMB_H = 30; SW_PRESS_GROW = 10;
    /* 白块本体的行程 = 轨道宽 − 滑块宽：白块左右缘正好贴着轨道两端，
       整块始终在轨道内部（参考图里滑块就是「内部右侧」）。
       原来 SW_TRAVEL 直接取轨道宽 300，白块中心能顶到 0 / 300，
       代价是白块有一半甩在轨道外面（实测右缘超出 23.8px），看着像滑块掉出去了。 */
    SW_TRAVEL = SW_TRACK_W - SW_THUMB_W;          // 254

    GLASS_H_SCALE_AT_FULL = 0.30;   // 满浮起 30 → 39
    GLASS_TRAVEL_GAIN = 1;          // 玻璃跟着滑块走，不额外探出（轨道太长，放大就飞了）

    THUMB_EDGE_BEND  = 1.7;
    THUMB_REFRACT_MUL = 1.10;   // 折射位移 80 → 88

       缩到 0.28 后纹理里条只有 46.1 高，玻璃 82.4，上下各留 ~18px 空档，

    THUMB_REFRACT_MUL = 0.32;       // 折射位移 80 → 25.6（改回原值）

    swRowY = [TBAR_Y];              // 只有一行，就在标签栏条的 y 上
    thumbTweenT = [];
  } else {
    SW_X = 312; SW_TRACK_W = 66; SW_TRACK_H = 26; SW_PAD = 2;
    SW_THUMB_W = 34; SW_THUMB_H = 22; SW_PRESS_GROW = 10;
    SW_TRAVEL = 28;
    GLASS_BASE_W = SW_TRACK_W; GLASS_BASE_H = SW_TRACK_H;
    GLASS_W_SCALE_AT_FULL = 0; GLASS_H_SCALE_AT_FULL = 0.25;
    GLASS_TRAVEL_GAIN = 1.8;        // 开关轨道短，需要放大才看得出玻璃在跑
    TEX_TRACK_SHRINK_AT_FULL = 0.28; // 玻璃里折射出的轨道缩到 72%，保持原效果
    TEX_TRACK_X_EXT_AT_FULL = 0;   // 横向不延长（只有标签栏需要）
    THUMB_EDGE_W_MUL = 1;           // 折射厚度：原版，不加厚
    THUMB_EDGE_BEND  = 2.0;
    THUMB_REFRACT_MUL = 1;
    swRows = SWITCH_ROWS;
    swRowY = SW_Y;                  // 四行，y 与四块玻璃按钮对齐
    SW_PAD_Y = 0;                   // 纵向内边距：开关用 SW_PAD（=2），与原来一致
  }
}
/* 进度条（.sl-fill）该填到哪里？答案是「填到滑块中心」，而不是 t 的百分比。
   两者不是一回事：滑块中心 = SW_THUMB_W/2 + t·SW_TRAVEL（因为滑块有宽度，
   左右各留半个滑块走不到），而 t·SW_TRACK_W 是按整条轨道取的百分比。
   两者差 46t−23，最左端差 −23px、最右端差 +23px —— 于是透过玻璃看过去，
   亮蓝与淡蓝的分界会跑到滑块的左边（t 小）或右边（t 大），
   而不是稳稳停在滑块正中。这里统一换算成「占轨道宽度的比例」。 */
/* transform 的位移 = 白块左缘。行程 SW_TRAVEL = 轨道宽 − 滑块宽，
   所以左缘 ∈ [0, 254]、中心 ∈ [23, 277]，白块始终整块在轨道内。 */
function sliderThumbX(t) {
  t = Math.max(0, Math.min(1, t));
  return t * SW_TRAVEL;
}
/* 端点外伸：玻璃（以及跟着它的蓝条分界）可以比白块再往外走一点，
   好让进度条真正顶到「滑杆头」（轨道端点 0 / 300），而不是停在白块中心 23 / 277。
   用 |2t−1|³ 而不是线性：中间段几乎不外伸（t=0.5 严格为 0，t=0.25 只偏 2.9px），
   所以「分界落在滑块正中」依然成立；只有接近两端时才快速外伸到满额。 */
function sliderEndOut(t) {
  t = Math.max(0, Math.min(1, t));
  const s = 2 * t - 1;                       // −1 … 1
  return (SW_THUMB_W / 2) * Math.pow(Math.abs(s), 3) * Math.sign(s);
}
/* 白色实色块必须与玻璃走同一个位置（都含端点外伸）。
   之前只有玻璃外伸、白块留在轨道内：拖到边缘时玻璃中心比白块中心多走 23px，
   而白块在拖动中会被淡到 THUMB_KEEP_ALPHA —— 于是从玻璃一侧露出一截半透明
   的白色椭圆（实测玻璃左缘比白块左缘靠右 16.5px）。
   现在两者共用 sliderThumbTX，白块中心 ≡ 玻璃中心，玻璃始终完全盖住白块。 */
function sliderThumbTX(t) {
  return sliderThumbX(t) + sliderEndOut(t);
}
/* 分界 = 白块中心 + 端点外伸。t=1 → (23+254+23)/300 = 1（填满到轨道右端），
   t=0 → (23+0−23)/300 = 0，t=0.5 → 150/300 = 0.5。 */
function sliderFillFrac(t) {
  t = Math.max(0, Math.min(1, t));
  return (SW_THUMB_W / 2 + sliderThumbX(t) + sliderEndOut(t)) / SW_TRACK_W;
}
/* 把滑块摆到 row.on 对应的位置（切进滑块场景、以及松手后定位置时调用）。
   拖动中不用它 —— 那期间由 thumbStep 每帧按 baseX 写 transform。 */
function syncSliderPositions() {
  if (sceneMode !== 'slider') return;
  for (let i = 0; i < sliderEls.length; i++) {
    const { thumb, fill, row } = sliderEls[i];
    const t = Math.max(0, Math.min(1, typeof row.on === 'number' ? row.on : 0));
    const x = sliderThumbTX(t);
    swThumbs[i].baseX = sliderThumbX(t);
    thumb.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
    fill.style.width = (sliderFillFrac(t) * 100).toFixed(2) + '%';
    sliderEls[i].sw.setAttribute('aria-valuenow', String(Math.round(t * 100)));
  }
}

function swSetState(i, on) {
  const { sw, row } = switchEls[i];
  row.on = on;
  sw.classList.toggle('on', on);
  sw.setAttribute('aria-checked', on ? 'true' : 'false');
  // 轨道实色变了 → 滑块玻璃折射所采样的那张轨道纹理要重画
  thumbTexDirty = true;
}
/* 重新按下（连点/键盘）：把 lift 时间轴「续」在当前高度上，而不是从头开始。
   原来这里无条件 phase=1, tp=0 —— lift 会被瞬间打回 0：
     · 正在沉降（lift 0.6）时再点 → 玻璃先瞬移到底再浮起，一下突跳；
     · 连点时每次都从 0 重来，而 rise 要 240ms、点击间隔往往只有 120ms，
       lift 永远停在低位来回抖，看着就是「点了没反应 / 动画没被打断」。
   现在按 rise 段公式反解出等效进度：lift = 1-(1-u)²  →  u = 1-√(1-lift)，
   再乘回 tp，位置完全连续，只是方向调头 —— 这才是「随时打断、接着往上」。 */
function swBeginPress(i) {
  const th = swThumbs[i];
  const cur = Math.max(0, Math.min(1, th.lift));
  const u0 = 1 - Math.sqrt(1 - cur);          // 当前高度对应的 rise 进度
  th.phase = 1;
  th.tp = Math.max(0, Math.min(1, u0)) * LIFT_RISE_MS;
  th.liftV = 0;
  th.liftHeld = true;
  th.jelHeld = true;
}

switchEls.forEach(({ sw }, i) => {
  let sx = 0, dragging = false, startOn = false, curX = 0;

  sw.addEventListener('pointerdown', e => {
    sx = e.clientX; dragging = false;
    swThumbs[i].dragActive = false;   // 每次按下先复位：默认是「点击」，越过容差才升级为拖动
    startOn = SWITCH_ROWS[i].on;
    curX = startOn ? SW_TRAVEL : 0;
    // 上一次点击若还在「延迟松手」里，这里重新按住 → 取消它，重新计时
    clearTimeout(swReleaseTimer[i]); swReleaseTimer[i] = 0;
    swThumbs[i].baseX = curX;      // 按住期间的位移基准（拖拽时被 curX 覆盖）
    swPressT0[i] = performance.now();
    sw.classList.add('press');
    // 滑块浮起：liftHeld 一置起来，弹簧就把 lift 推到 1。
    // 按住时用 ζ=1，稳稳升到顶不抖；松手才切欠阻尼"沉下去"。
    // 浮起的是滑块（那个白点），不是轨道 —— iOS 就是这样。
    swBeginPress(i);            // 进入 rise（从当前高度续上，不回零）
    try { sw.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });

  sw.addEventListener('pointermove', e => {
    if (!sw.classList.contains('press')) return;
    const dx = e.clientX - sx;
    if (!dragging && Math.abs(dx) > SW_DRAG_SLOP) {
      dragging = true;
      sw.classList.add('drag');      // 跟手期间关掉过渡
      swThumbs[i].dragActive = true; // 真正拖动：从此刻起速度才会驱动惯性拉伸
    }
    if (!dragging) return;
    // 跟手：起点 + 位移，夹在 [0, 行程]。向左长的补偿按基准位置的比例算（thumbStep 每帧写），
    // 这里只更新基准，实际位移由 thumbStep 统一写入，避免两处各写一遍打架。
    const prevX = curX;
    curX = Math.max(0, Math.min(SW_TRAVEL, curX + dx));
    sx = e.clientX;
    swThumbs[i].baseX = curX;
    /* 撞到端点不再触发专门的冲量 —— 形变现在全程由拖动速度驱动，
       顶到头只是「速度刚好归零」，弹簧自然收一下，不会额外抖一大下。 */
  });

  function end(e) {
    if (!sw.classList.contains('press')) return;
    const target = dragging ? (curX >= SW_TRAVEL / 2) : !startOn;
    const wasDrag = dragging;
    dragging = false;
    /* 点击（非拖动）时位移由 thumbStep 每帧按住基准写，所以状态立刻切换
       （轨道颜色马上渐变、aria 马上更新）也不会让滑块提前滑走 ——
       等「真松手」那一刻清掉内联 transform，才交回 CSS 弹性滑到目标位。 */
    swSetState(i, target);            // 先定状态
    const waited = performance.now() - swPressT0[i];
    const wait = wasDrag ? 0 : Math.max(0, SW_MIN_PRESS_MS - waited);
    clearTimeout(swReleaseTimer[i]);
    if (wait > 0) {
      swReleaseTimer[i] = setTimeout(() => releasePressed(i), wait);
      return;                         // 还按着：浮起和拉长继续
    }
    releasePressed(i);
  }
  // 真正的「松手」：撤掉按住态 → 滑块收回 44→27 并弹性滑到目标位，玻璃同时沉下去
  function releasePressed(i) {
    swReleaseTimer[i] = 0;
    const s = switchEls[i].sw;
    if (!s.classList.contains('press')) return;
    s.classList.remove('press');
    // 松手 → 滑块沉下去（liftHeld 一撤，弹簧切软刚度 + ζ=0.55 沉过头再坐回，连贯）
    swThumbs[i].liftHeld = false;
    swThumbs[i].jelHeld = false;
    /* 松手不再额外打冲量：拖动期间 jel 已经跟着速度拉开了，
       这里只要把 jelT 归零，弹簧带着现有速度过冲约 20%（ζ=0.45）就收住 ——
       轻微回一下，不像之前那样弹 2~3 下。 */
    swThumbs[i].jelVel = 0;
    swThumbs[i].dragActive = false;
    // 没升够就松手 → 先升满再沉，避免「刚冒头就缩回去」的闪跳
    swThumbs[i].mustRise = swThumbs[i].lift < LIFT_MIN_RISE;
    // 下一帧再交回 CSS：同帧既恢复 transition 又清内联值，浏览器会直接跳过去，
    // 那一下弹性回弹就没了。错开一帧 → 走的是正常的 transform 过渡。
    requestAnimationFrame(() => {
      s.classList.remove('drag');
      thumbX(i, NaN, false);
    });
  }
  sw.addEventListener('pointerup', end);
  sw.addEventListener('pointercancel', end);
  sw.addEventListener('lostpointercapture', end);

  // 键盘：与原生 checkbox 一致（Space / Enter），同样走最短按住时长
  sw.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) {
        clearTimeout(swReleaseTimer[i]); swReleaseTimer[i] = 0;
        swPressT0[i] = performance.now();
        sw.classList.add('press');
        swBeginPress(i);
      }
    }
  });
  sw.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      swSetState(i, !SWITCH_ROWS[i].on);
      const waited = performance.now() - swPressT0[i];
      const wait = Math.max(0, SW_MIN_PRESS_MS - waited);
      clearTimeout(swReleaseTimer[i]);
      if (wait > 0) { swReleaseTimer[i] = setTimeout(() => releasePressed(i), wait); return; }
      releasePressed(i);
    }
  });
});
// 内联设置滑块位置（拖拽跟手用）；传 NaN 表示清掉内联样式、交回 CSS
function thumbX(i, x, keepPress) {
  const { sw, thumb } = switchEls[i];
  if (Number.isNaN(x)) { thumb.style.transform = ''; return; }
  thumb.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
}

/* ================= 滑块场景的交互 =================
   与开关不同：滑块是连续值，没有「开 / 关」两态。
     按下 → 浮起（swBeginPress，与开关同一条时间轴）
     拖动 → 跟手改值，玻璃保持鼓起，速度驱动惯性拉伸
     松手 → 沉下，玻璃收回、白色椭圆滑块变回不透明
   位置一律写进 swThumbs[i].baseX，再由 thumbStep 每帧转成 transform ——
   这样「按住拉长的补偿」和玻璃放大走的是同一套代码，不会两处各写一遍打架。 */
sliderEls.forEach(({ sw, fill, row }, i) => {
  let dragging = false, sxPx = 0, startT = 0, grabOff = 0;

  function setT(t) {
    sliderSetT(i, t);
  }

  sw.addEventListener('pointerdown', e => {
    if (sceneMode !== 'slider') return;
    const pr = phone.getBoundingClientRect();
    const k = PHONE_W / pr.width;              // 视口 px → 手机内部 CSS px
    const r = sw.getBoundingClientRect();
    const px = (e.clientX - r.left) * k;       // 相对 .sl 左缘的手机坐标
    const curT = Math.max(0, Math.min(1, typeof row.on === 'number' ? row.on : 0));
    const thumbL = sliderThumbX(curT), thumbR = thumbL + SW_THUMB_W;
    /* 点在滑块上就保持抓取偏移（不跳）；点在轨道上直接跳过去 —— 与 UISlider 一致。 */
    grabOff = (px >= thumbL && px <= thumbR) ? (px - thumbL) : SW_THUMB_W / 2;
    // sliderThumbX 现在就是白块左缘，反解 t 直接除以行程即可
    startT = Math.max(0, Math.min(1, (px - grabOff) / SW_TRAVEL));
    sxPx = e.clientX; dragging = false;
    swThumbs[i].dragActive = false;
    clearTimeout(swReleaseTimer[i]); swReleaseTimer[i] = 0;
    sw.classList.add('press');
    swBeginPress(i);            // 进入 rise：玻璃慢慢浮起
    /* 点在轨道上 → 目标位置与当前不同，让蓝条和白块一起滑过去（见 slJumpStep），
       不再瞬移：原来这里直接 setT，蓝条跳到终点而白块还在慢慢滑，两者对不上。 */
    startSliderJump(i, startT);
    try { sw.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });

  sw.addEventListener('pointermove', e => {
    if (sceneMode !== 'slider' || !sw.classList.contains('press')) return;
    if (!dragging && Math.abs(e.clientX - sxPx) > SW_DRAG_SLOP) {
      dragging = true;
      sw.classList.add('drag');          // 关掉过渡，跟手才不拖沓
      swThumbs[i].dragActive = true;     // 真正拖动：从此刻起速度才驱动惯性拉伸
      /* 点击跳转的补间若还在跑，这里取消它 —— 但要以「补间当前到达的位置」
         重新起算，否则手指一动滑块会先跳回起点再跟手。 */
      if (slJump[i].active) {
        cancelSliderJump(i);
        startT = Math.max(0, Math.min(1, typeof row.on === 'number' ? row.on : 0));
        sxPx = e.clientX;
      }
    }
    if (!dragging) return;
    const pr = phone.getBoundingClientRect();
    const k = PHONE_W / pr.width;
    setT(startT + (e.clientX - sxPx) * k / SW_TRAVEL);
  });

  function end() {
    if (!sw.classList.contains('press')) return;
    dragging = false;
    sw.classList.remove('press');
    const th = swThumbs[i];
    th.liftHeld = false; th.jelHeld = false; th.jelVel = 0; th.dragActive = false;
    // 没升够就松手 → 先升满再沉，避免「刚冒头就缩回去」的闪跳
    th.mustRise = th.lift < LIFT_MIN_RISE;
    requestAnimationFrame(() => {
      sw.classList.remove('drag');
      /* 补写一次最终位置：thumbStep 按住期间写的是 baseX − 拉长补偿，
         松手后 grow 归零、补偿也该归零，否则滑块会停在偏了一点的位置。 */
      const el = thumbEls && thumbEls[i];
      if (el) el.style.transform = 'translateX(' + sliderThumbTX(th.baseX / SW_TRAVEL).toFixed(2) + 'px)';
    });
  }
  sw.addEventListener('pointerup', end);
  sw.addEventListener('pointercancel', end);
  sw.addEventListener('lostpointercapture', end);

  // 键盘：方向键调值（与原生 slider 一致）
  sw.addEventListener('keydown', e => {
    if (sceneMode !== 'slider') return;
    const cur = Math.max(0, Math.min(1, typeof row.on === 'number' ? row.on : 0));
    let t = cur;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') t = cur + 0.05;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') t = cur - 0.05;
    else if (e.key === 'Home') t = 0;
    else if (e.key === 'End') t = 1;
    else return;
    e.preventDefault();
    setT(t);
    sw.classList.add('drag');            // 关掉过渡，连续调值才跟手
    const el = thumbEls && thumbEls[i];
    if (el) el.style.transform = 'translateX(' + sliderThumbTX(t).toFixed(2) + 'px)';
    requestAnimationFrame(() => sw.classList.remove('drag'));
  });
});

/* ================= 标签栏：选中框的位移补间 =================
   与滑块那条同源 —— 点击别的标签、松手吸附都要「滑过去」，不能瞬移。
   每帧同时推进 row.on 与 baseX，位置只有一个来源，不会出现
   「框已经到位、玻璃还在原地」这种两层对不上的情况。 */
const TB_JUMP_MS = 300;
const tabJump = { active: false, from: 0, to: 0, t0: 0 };
const clamp01 = v => Math.max(0, Math.min(1, v));

function tabSetT(t) {
  t = clamp01(t);
  TABBAR_ROWS[0].on = t;
  swThumbs[0].baseX = t * SW_TRAVEL;
  tabbarEls[0].thumb.style.transform = 'translateX(' + (t * SW_TRAVEL).toFixed(2) + 'px)';
  /* 高亮跟着框走：框中心越过 1/4、3/4 就换到下一个标签，
     与松手吸附用的是同一个 round，不会出现「框在这里、红的是旁边那个」。 */
  tbarSetSel(Math.round(t * (TBAR_N - 1)));
  thumbTexDirty = true;              // 折射纹理里的条要跟着重画
}
function startTabJump(toT) {
  toT = clamp01(toT);
  const cur = clamp01(typeof TABBAR_ROWS[0].on === 'number' ? TABBAR_ROWS[0].on : 0);
  if (Math.abs(toT - cur) < 0.002) { tabSetT(toT); return; }   // 没挪窝就别启动
  tabJump.active = true; tabJump.from = cur; tabJump.to = toT; tabJump.t0 = performance.now();
}
function tabJumpStep() {
  if (sceneMode !== 'tabbar') { tabJump.active = false; return; }
  if (!tabJump.active) return;
  const u = Math.min(1, (performance.now() - tabJump.t0) / TB_JUMP_MS);
  const e = 1 - Math.pow(1 - u, 3);   // easeOutCubic，与滑块那条一致
  tabSetT(tabJump.from + (tabJump.to - tabJump.from) * e);
  if (u >= 1) {
    /* 最后一帧必须自己写死再取消：否则 active 一置 false，本帧 thumbStep 的
       写位移条件就不成立了 —— 框会永远停在倒数第二帧。 */
    tabSetT(tabJump.to);
    tabJump.active = false;
  }
}
/* 切进标签栏场景时把选中框摆到 row.on 对应的位置。
   顺带清掉上一次浮起留下的 width / height / left / top / opacity 内联值：
   那些是 thumbStep 在 grow>0 期间写进 .tbar-sel 的，切走时不会被自动清，
   下次切回来第一帧之前会看到框还是「鼓起来」的形状。 */
function syncTabbarPositions() {
  if (sceneMode !== 'tabbar') return;
  tabJump.active = false;
  const el = tabbarEls[0].thumb;
  el.style.width = ''; el.style.height = ''; el.style.left = ''; el.style.top = ''; el.style.opacity = '';
  const t = clamp01(typeof TABBAR_ROWS[0].on === 'number' ? TABBAR_ROWS[0].on : 0);
  swThumbs[0].baseX = t * SW_TRAVEL;
  el.style.transform = 'translateX(' + (t * SW_TRAVEL).toFixed(2) + 'px)';
  tbarSetSel(Math.round(t * (TBAR_N - 1)));   // 切回场景时高亮也要对上当前位置
}

/* ================= 标签栏的交互 =================
   两个动作共用一条浮起时间轴（swBeginPress），和滑块同一套手感：
     · 点击别的标签   → 选中框浮起、滑过去、再沉下；
     · 拖动           → 跟手，速度驱动惯性拉伸，松手吸附到最近的标签。
   命中层是 #tbarHitEl（.tbar 整体 pointer-events:none，DOM 内容不吃事件）。 */
{
  const hit = tabbarEls[0].sw, row = TABBAR_ROWS[0];
  let dragging = false, sxPx = 0, startT = 0, pendIdx = -1;
  const contentW = () => SW_TRACK_W - SW_PAD * 2;            // 244
  const idxToT = i => (TBAR_N > 1 ? i / (TBAR_N - 1) : 0);
  function idxFromPx(px) {                                    // px：相对条左缘
    const rel = (px - SW_PAD) / contentW();
    return Math.max(0, Math.min(TBAR_N - 1, Math.floor(rel * TBAR_N)));
  }

  hit.addEventListener('pointerdown', e => {
    if (sceneMode !== 'tabbar') return;
    const k = PHONE_W / phone.getBoundingClientRect().width;
    const r = hit.getBoundingClientRect();
    const px = (e.clientX - r.left) * k;                      // 相对条左缘 0…264
    const curT = clamp01(row.on);
    const boxL = SW_PAD + curT * SW_TRAVEL;                   // 框左缘（相对条左缘）
    const onBox = px >= boxL && px <= boxL + SW_THUMB_W;
    dragging = false; sxPx = e.clientX; startT = curT;
    swThumbs[0].dragActive = false;                           // 默认「点击」，越过容差才升级为拖动
    clearTimeout(swReleaseTimer[0]); swReleaseTimer[0] = 0;
    hit.classList.add('press');
    swBeginPress(0);                                          // 浮起
    /* 点在框外（别的标签上）→ 滑过去；点在框上 → 先不动，等拖动。
       pendIdx 记下这次点中的标签：不拖动就用它当选中项，
       不能拿松手时的 row.on 去 round —— 那时补间才刚起步，值还是旧位置。 */
    if (!onBox) { pendIdx = idxFromPx(px); startTabJump(idxToT(pendIdx)); }
    else pendIdx = -1;
    try { hit.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });

  hit.addEventListener('pointermove', e => {
    if (sceneMode !== 'tabbar' || !hit.classList.contains('press')) return;
    const k = PHONE_W / phone.getBoundingClientRect().width;
    if (!dragging && Math.abs(e.clientX - sxPx) > SW_DRAG_SLOP) {
      dragging = true;
      swThumbs[0].dragActive = true;                          // 从此刻起速度才驱动惯性拉伸
      /* 点击跳转的补间若还在跑：以「补间当前到达的位置」重新起算，
         否则手指一动框会先跳回起点再跟手。 */
      if (tabJump.active) { tabJump.active = false; startT = clamp01(row.on); sxPx = e.clientX; }
    }
    if (!dragging) return;
    tabSetT(startT + (e.clientX - sxPx) * k / SW_TRAVEL);
  });

  function end() {
    if (!hit.classList.contains('press')) return;
    dragging = false;
    hit.classList.remove('press');
    const th = swThumbs[0];
    th.liftHeld = false; th.jelHeld = false; th.jelVel = 0; th.dragActive = false;
    th.mustRise = th.lift < LIFT_MIN_RISE;
    /* 吸附到最近的标签：拖动过就按松手位置取最近的一个，
       纯点击则用按下时点中的那个（见上面的 pendIdx）。 */
    const idx = (dragging || pendIdx < 0)
      ? Math.round(clamp01(row.on) * (TBAR_N - 1))
      : pendIdx;
    tbarSetSel(idx);
    startTabJump(idxToT(idx));
  }
  hit.addEventListener('pointerup', end);
  hit.addEventListener('pointercancel', end);
  hit.addEventListener('lostpointercapture', end);
}

/* ================= 舞台缩放：手机整体适配视口 ================= */
const phone = document.getElementById('phone');
function fitStage() {
  const s = Math.min(1, (window.innerHeight - 24) / PHONE_H, (window.innerWidth - 24) / PHONE_W);
  phone.style.transform = 'scale(' + s.toFixed(4) + ')';
}
window.addEventListener('resize', fitStage);

/* 渲染降级保护：WebGL 不可用时（老浏览器 / 禁用硬件加速 / 远程桌面）让动画逻辑继续跑。
   原来 render() 一抛错，requestAnimationFrame(loop) 就再也调不到 —— 整个页面的
   弹簧、形变、光斑、翻页动画全部停摆，只剩一张静态图。这里把渲染单独兜住，
   失败一次就永久降级为「只跑 DOM 动画」，不拖垮交互循环。 */
let glOK = true;
function safeRender() {
  if (!glOK) return;
  try { render(); }
  catch (e) { glOK = false; console.warn('[liquid-glass] WebGL 渲染不可用，已降级为 DOM 动画：', e && e.message); }
}
function safeRenderMenu() {
  if (!glOK) return;
  try { renderMenuGlass(); }
  catch (e) { glOK = false; console.warn('[liquid-glass] 主页玻璃渲染不可用，已降级：', e && e.message); }
}

/* ================= 启动 ================= */
window.addEventListener('load', () => {
  // 初始化也要兜住：原来 initThreeJS 里 new WebGLRenderer 一抛错，整个 load 回调
  // 就断在这里，下面的 loop 从来没被启动 —— 页面变成一张完全不动的静态图。
  try { initThreeJS(canvas); }
  catch (e) { glOK = false; console.warn('[liquid-glass] WebGL 初始化失败，已降级为 DOM 动画：', e && e.message); }
  setDefaultBackground();
  fabGlass = makeGlass(8, '', 350, 60, 40, 40, { color: '#0f2233', strength: 30 }, 0.50, true);
  menuBgTex = createMenuBgTexture();
  try { initMenuGlass(document.getElementById('menu-glass-canvas')); }
  catch (e) { console.warn('[liquid-glass] 主页玻璃初始化失败：', e && e.message); }
  try { initThumbGlass(document.getElementById('thumb-glass-canvas')); }
  catch (e) { console.warn('[liquid-glass] 滑块玻璃初始化失败：', e && e.message); }
  applySwGeometry('switches');   // 初始化几何 / swRows（默认按开关场景）
  syncLabels();
  fitStage();
  requestAnimationFrame(() => document.body.classList.remove('boot'));
  let _last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - _last) / 1000));
    _last = now;
    /* 控制中心展开 / 收起进度。**必须在 updateJelly 之前**：ccBroadcast 本帧就
       读 ccReveal 来算收起位移 offY，顺序反了图标会慢玻璃一帧。
       漏掉这一行 → 松手后弹簧不跑、applyCcReveal 不执行：上滑只会把图标顶上去
       一点点就停住，而且永远不淡出、不回弹。 */
    /* 目录页 / 其它场景：后台把控制中心要用的 2 张模糊图慢慢备好
       （每帧最多 1 张，且只在非手势帧），免得点进控制中心那一帧现场生成
       —— 真机日志里那几帧 80~130ms 就是这么来的。画完即置位，之后一帧都不进。 */
    if (typeof prewarmCcBlur === 'function') prewarmCcBlur();
    ccRevealStep(dt);
    updateJelly(dt);
    tickPointer(dt);
    syncLabels();
    safeRender();
    fabStep(dt);          // 主页圆形按钮：拖尾 + 果冻 + 内透光（与场景同一套常量）
    thumbStep(dt);        // 开关滑块：白点浮起变玻璃 / 松手沉下
    /* 标签栏的弹起倍率是本帧 thumbStep 里算出来的，而 syncLabels 在它之前跑 ——
       DOM 侧的 scale 会慢玻璃整整一帧：低帧率下实测 .tbar 是 1.0479、
       玻璃已经是 1.0541，条与选中框错开约 0.6px。这里补写两个图标层的 transform
       （只写 transform，不动 left/top/width/height，开销可忽略）。 */
    if (sceneMode === 'tabbar' && tbarBouncePrevForDom !== tbarBounce) {
      tbarBouncePrevForDom = tbarBounce;
      const s = tbarBounce > 0.0005 ? ' scale(' + (1 + tbarBounce).toFixed(4) + ')' : '';
      if (iconEls[7]) iconEls[7].style.transform = jellyTransform(glasses[7], LABEL_SQUASH) + s;
      /* 搜索按钮（iconEls[8]）**不**带这份 scale：它不跟着弹起（用户要求），
         玻璃盒子也从未被 setTbarGlassBox 改写过。之前这里把 s 也加到它身上，
         放大镜会以自身中心放大 6% 而玻璃纹丝不动 → 图标比玻璃大一圈、糊在边上。
         它只需要 jellyTransform 那一份（拖动变形时跟着玻璃形变）。 */
      if (iconEls[8]) iconEls[8].style.transform = jellyTransform(glasses[8], LABEL_SQUASH);
    }
    /* 主页玻璃只在主页（menuOpen）以及退出后 0.45s 的淡出过渡内才需要画。
       原来这一行无条件每帧执行 —— 即使人已经在控制中心，menu-glass-canvas
       这块整屏（780×1688）画布仍要每帧 setClearColor + clear + render 一次，
       而且它带 preserveDrawingBuffer:true，驱动每帧还要额外保留整块缓冲。
       这正是「静止整帧跳过」收益有限的原因：主画布跳过了，这块却一直在画。 */
    if (menuOpen || (now - _menuCloseAt) < 450) safeRenderMenu();
    requestAnimationFrame(loop);
  })(performance.now());
});

</script>
