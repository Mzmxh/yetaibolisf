<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态玻璃目录 · 展示 1</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  :root { --phone-radius: 44px; }   /* 外框圆角：所有翻页层都用同一个值，边缘才对得齐 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f5;
    color: #111;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.dark { background: #14161a; }

  /* 舞台：手机整体按视口等比缩放，内部坐标系恒定 */
  .stage {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  .phone {
    position: relative;
    width: 390px; height: 844px;
    flex: 0 0 auto;
    border-radius: var(--phone-radius);
    overflow: hidden;
    /* 底色只用来填补「圆角抗锯齿」露出的那半像素缝隙，所以必须跟着当前页面走：
       外框裁一次 + 页面自己的圆角再画一次，两层半透明边缘相乘就漏出这里。
       写死一个颜色 → 在另一页上就显成一条深色弧线（四个角）。 */
    background: #08202e;
    transition: background .38s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    transform-origin: center center;
  }
  body.menu-open .phone      { background: #fff; }      /* 主页面·浅色 */
  body.dark.menu-open .phone { background: #17191d; }   /* 主页面·深色 */
  body.boot .phone { transition: none !important; }
  .phone-bg {
    position: absolute; inset: 0;
    z-index: 0;
  }
  /* ===== 页面切换过渡（iOS push/pop 那种） =====
     场景页 = 背景 + 投影 + canvas + 文字 + 选图按钮，整体一起位移；
     顶栏（返回 / 月亮）不在其中，所以位置永远不动。
     push：场景从右侧滑入、主页面向左退且淡出；pop：场景往右退回去，原路返回。 */
  /* 参与位移的每一层都要自带与外框一致的圆角并裁掉溢出：
     只靠 .phone 的 overflow 不够 —— 它只裁屏幕四角，而推入/退出的页面
     在动画中途会露出一条「屏内竖边」，那条边的上下两端是直角，看着就不协调。 */
  .scene-layer { position: absolute; inset: 0; z-index: 3;
    border-radius: var(--phone-radius); overflow: hidden; }
  .scene-ui    { position: absolute; inset: 0;
    border-radius: var(--phone-radius); overflow: hidden; }
  .scene-layer, .scene-ui {
    transition: transform .38s cubic-bezier(.32, .72, 0, 1);
    will-change: transform;
  }
  /* 主页面（默认）：场景停在屏幕右侧外 */
  body.menu-open .scene-layer,
  body.menu-open .scene-ui { transform: translateX(100%); }
  /* 首屏不要动画：body 带 boot 时全部关掉 */
  body.boot .scene-layer, body.boot .scene-ui,
  body.boot .menu-page, body.boot .menu-glass-layer,
  body.boot .back-btn { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .scene-layer, .scene-ui, .menu-page, .menu-glass-layer { transition-duration: .01s !important; }
  }
  /* 玻璃投影层：在背景之上、玻璃之下（对标 Backdrop 的 backdropShadow） */
  .glass-shadow {
    position: absolute;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.30);
    pointer-events: none;
    z-index: 1;
    /* 每帧跟着果冻形变改 transform。没有独立合成层时，浏览器要把这颗
       18~30px 模糊半径的阴影整体重画一遍（repaint）；控制中心 22 颗一起重画，
       移动端直接吃掉十几毫秒。提升成合成层后，位移只改层矩阵、不重画内容。 */
    will-change: transform;
  }
  #glass-canvas {
    position: absolute; inset: 0;
    width: 390px; height: 844px;
    z-index: 2;
    display: block;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* UI 覆盖层（文字画在玻璃之上，不被折射扭曲，与 Backdrop 的 onDrawSurface 一致） */
  .phone-ui {
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;   /* 只有具体控件可交互 */
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 92px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 20px 12px;
  }
  .circle-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer; border: none;
    /* 不写 transition/transform：形变由 JS 每帧写入，CSS 过渡会让它慢半拍 */
    transition: opacity 0.15s;
  }
  /* 顶栏两个按钮本身就是玻璃：背景透明，由下层 canvas 渲染折射，图标画在玻璃之上 */
  /* 与选图按钮同理：事件穿透到 canvas，由玻璃命中统一处理。
     否则 DOM 按钮会吃掉点击，玻璃收不到 pointerdown 就没有果冻。 */
  /* 顶栏玻璃透出来的是深色背景（玻璃5 无染色），图标用白色才看得见 */
  .back-btn { background: transparent; color: #fff; pointer-events: none;
              filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.35)); }
  .back-btn svg { width: 20px; height: 20px; }
  /* 场景里：月亮压在深色玻璃上 → 用浅色图标；
     主页面里：背景是不透明的白/深色板 → 图标跟着页面深浅走，否则看不见。 */
  .theme-btn { background: transparent; color: #eaf6f9; pointer-events: none; }
  body.menu-open .theme-btn      { color: #111; }      /* 白底 → 深色图标 */
  body.menu-open.dark .theme-btn { color: #eaf6f9; }   /* 深色底 → 浅色图标 */
  .theme-btn svg { width: 20px; height: 20px; }

  /* 玻璃按钮上的文字：跟随玻璃位置 */
  .glass-label {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    /* 不拦截指针：拖动统一交给下层 canvas 处理，否则遮住玻璃就拖不动了 */
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    /* 同 .glass-shadow：文字带 text-shadow，每帧形变要重画就太贵了 */
    will-change: transform;
  }
  .glass-label.draggable { text-shadow: 0 1px 6px rgba(255,255,255,0.35); }
  .label-dark { color: #0b2b3a; }
  .label-light { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.25); }

  .pick-wrap {
    position: absolute; left: 0; right: 0; bottom: 56px;
    display: flex; justify-content: center;
  }

  /* ===== iOS 开关（UISwitch 1:1 照搬）=====
     尺寸/动画取自 iOS 原生实现：
       轨道 51×31（radius = h/2 = 15.5），内底 47×27，滑块 27×27（radius 13.5），
       左右各留 2px 内边距 → 行程 = 51 − 31 = 20px（也就是 translateX(20px)）。
       滑块曲线 cubic-bezier(.42,.80,.58,1.2)：第二个控制点 y=1.2 > 1 → 过冲回弹，
       正是 iOS 那种「滑过去顶一下再坐回」。轨道变色与滑块位移分开写：
       共用一个 transition 会让两者节奏错位，看着「断层」。
       按住时滑块从 27 拉长到 35px（iOS 的 press 反馈）；开启态向左侧长，
       所以位移要同步减 8px，右端才不会跟着往右跑。 */
  .switch-panel {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: none;
  }
  body.scene-switches .switch-panel { display: block; }

  /* ===== 长调节杆滑块（UISlider 风格）=====
     与开关场景共用同一套背景 / 顶栏 / 「选择图片」，只把中间四块换成细长的调节杆。
     几何：轨道是一条 300×8 的细线（圆角 = 半高，胶囊），
     白色椭圆滑块 46×30 骑在上面（比轨道高，所以 .sl 的高度按滑块算、轨道垂直居中）。
     左侧已走过的部分用亮蓝填充（.sl-fill），右侧留淡蓝 —— 和参考图一致。 */
  .slider-panel {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: none;
  }
  body.scene-slider .slider-panel { display: block; }

  /* ===== 标签栏场景 =====
     与前面三个场景共用同一套背景 / 顶栏 / 「选择图片」。
     中间放一条 iOS 26 风格的底部标签栏：整体是一块玻璃（由 canvas 渲染），
     这里的 DOM 只画玻璃之上的图标与文字。 */
  .tabbar-panel {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: none;
  }
  body.scene-tabbar .tabbar-panel { display: block; }

  /* ===== 控制中心场景 =====
     与前面几个场景共用同一套背景 / 顶栏 / 「选择图片」。
     中间是 iOS 控制中心：每一块都是 canvas 渲染的玻璃（见 CC_ITEMS），
     这里的 DOM 只画玻璃之上的图标 —— 所以必须 pointer-events:none，
     否则会吃掉 pointerdown，玻璃收不到拖拽、果冻形变就触发不了。 */
  .control-panel {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: none;
  }
  body.scene-control .control-panel { display: block; }
  /* 单个图标盒：位置尺寸由 JS 按 CC_ITEMS 写成与玻璃严格重合，
     每帧再由 syncLabels 写 transform（跟随果冻形变）。 */
  .cc-ico {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; user-select: none; -webkit-user-select: none;
    color: #fff;
    box-sizing: border-box;
    /* 图标里是 SVG + filter: drop-shadow()，最贵的一类：不提成合成层的话，
       父元素每帧改 transform 就要把滤镜重算一遍。 */
    will-change: transform;
  }
  /* 图标是白色描边，压在毛玻璃上遇到亮背景会糊掉 —— 加一层投影拉开对比，
     与 .cc-media-title 的 text-shadow 同一套处理。 */
  .cc-ico svg { width: 52%; height: 52%; overflow: visible;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  /* 竖直长条（亮度 / 音量）：图标落在底部，与 iOS 一致 */
  .cc-ico.cc-btm { align-items: flex-end; padding-bottom: 16px; }
  .cc-ico.cc-btm svg { width: 40%; height: 40%; }
  /* 横向长条（专注模式）：与竖条同一套胶囊形状，只是转 90°。
     内容是整条排布而非单个图标 —— 月亮 / 「专注模式」/ 向下箭头，见 .cc-focus。 */
  .cc-focus { display: flex; align-items: center; box-sizing: border-box;
    width: 100%; height: 100%; padding: 0 16px; gap: 10px; }
  .cc-focus-ico { flex: none; display: flex; align-items: center; justify-content: center; }
  .cc-focus-ico svg { width: 26px; height: 26px; }
  .cc-focus-arw svg { width: 20px; height: 20px; }
  .cc-focus-arw { opacity: .78; }
  /* 文字在月亮与箭头之间居中：flex:1 + center 后中心落在整条约 52%，与参考图一致 */
  .cc-focus-text { flex: 1; text-align: center; white-space: nowrap;
    font-size: 14px; letter-spacing: .3px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  /* 媒体控制区：上方一行文字 + 下方播放控件 */
  .cc-media { flex-direction: column; justify-content: center; gap: 12px; }
  .cc-media-title { font-size: 13px; letter-spacing: .3px; opacity: .9;
    text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .cc-media-ctl { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .cc-media-ctl svg { width: 26px; height: 26px; }
  /* 联网开关卡：与媒体卡同款的大圆角玻璃，里面 2×2 排四个小圆按钮。
     按钮本体不是玻璃（参考图上它们是卡片内部的小图标），所以只用半透明白底
     描出圆形，开启态再叠系统色 —— 玻璃材质由底下那一整块卡片提供。 */
  /* padding / gap 越大 → 四个彩色圆越小。当前 16 / 12：圆直径约 58（卡片 160）。 */
  .cc-ico.cc-conn-box { padding: 16px; }
  .cc-conn { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 12px; width: 100%; height: 100%; }
  .cc-btn { border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.13); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .cc-btn svg { width: 44%; height: 44%; }
  .cc-btn.on-blue  { background: #0a84ff; }
  .cc-btn.on-green { background: #30d158; }

  /* 标签栏内容层：盒子与玻璃严格重合（同一份 TBAR_X/Y/W/H 常量），
     所以只放内容、不画背景 —— 背景是下层 canvas 渲染的玻璃。
     pointer-events: none 让事件穿透到 canvas，由玻璃系统统一处理，
     否则 DOM 会吃掉点击、玻璃收不到 pointerdown。
     随 .tabbar-panel 一起 display:none，所以不会被别的场景看见。 */
  .tbar {
    position: absolute;
    left: 25px; top: 390px; width: 264px; height: 64px;
    display: flex; align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
    /* 这里刻意不给 z-index：父元素一旦有 z-index 就自成层叠上下文，
       子元素的 z-index 就再也高不过 canvas（z-index 6）了。
       选中框本体（.tbar-sel）要留在玻璃之下 —— 它是「滑块本体」，
       浮起时淡出、让玻璃透出来（与滑块的白点同一套机制）；
       而图标与文字要提到玻璃之上（见 .tbar-item 的 z-index）。 */
  }
  /* 选中框（tab indicator）：一个半透明灰色的胶囊，框住当前选中的标签。
     静止时它就是这一层（玻璃 alpha=0，看不到玻璃）；
     点击 / 拖动时它浮起、变成玻璃（透明度降到 THUMB_KEEP_ALPHA，
     和滑块那套「白点淡出、玻璃透出来」是同一个机制）。
     绝对定位，不参与 flex 排版；left/top/width/height 与 JS 的
     SW_PAD / SW_PAD_Y / SW_THUMB_W / SW_THUMB_H 严格对应。
     位移只写在 transform 上，和滑块一致（thumbStep 每帧按 baseX 写）。 */
  .tbar-sel {
    position: absolute;
    left: 10px; top: 8px; width: 81.33px; height: 48px;
    border-radius: 24px;                  /* = 半高 → 胶囊 */
    background: rgba(226, 234, 246, 0.30);/* 半透明灰白：静止时的选中态 */
    pointer-events: none;
    will-change: transform;
  }
  /* 命中层：.tbar 整体 pointer-events:none（内容不能被 DOM 吃掉事件），
     所以拖动的交互单独由这一层承担。范围与标签栏条严格重合（264×64），
     touch-action: none 是触屏拖动能用的前提（否则会被当成滚动手势）。 */
  .tbar-hit {
    position: absolute;
    left: 25px; top: 390px; width: 264px; height: 64px;
    border-radius: 32px;
    pointer-events: auto;                 /* .phone-ui 整层 none，这里必须打开 */
    touch-action: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tbar-item {
    /* 图标与文字刻意留在玻璃**之下**（不设 z-index，canvas 的 z-index 6 盖过它）。
       选中框玻璃是「浮在标签栏上的一块玻璃」，必须压住下面的图标并折射它们 ——
       这才是 iOS 26 的效果：pill 底下的图标被玻璃放大、推歪，玻璃外仍是清晰图标。
       前提是折射纹理里要画出图标（见 drawTbarGlyph），否则玻璃里只剩一片空白。
       .tbar 父级不能设 z-index：一旦有就自成层叠上下文，子元素再也高不过 canvas。 */
    position: relative;
    flex: 1 1 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    color: #fff;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.30));
    /* 颜色不再走 CSS transition：选中色是 JS 每帧在「白 ↔ 绯红」之间插值的（tbarColorStep），
       再叠一层 CSS 过渡会让它慢半拍，且和玻璃里（纹理）那一份对不上。
       .on 仍作为语义标记保留（便于调试），实际颜色由 inline style 写入，优先级更高。 */
  }
  /* 被选中框框住的那一项：图标与文字变绯红（svg 用 currentColor，跟着一起变）。
     色值来自 JS 常量 TBAR_SEL_COLOR（启动时写入 --tbar-sel-color），
     这里只做兜底，保证变量还没写入时也不会掉回无样式状态。 */
  .tbar-item.on { color: var(--tbar-sel-color, #DC143C); }
  .tbar-item svg { width: 22px; height: 22px; }
  .tbar-item span {
    font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.30);
  }
  /* 最右侧的圆形搜索按钮：不是标签栏的一部分，是独立的一块玻璃（自己的圆）。
     定位与 TBAR_SEARCH_* 常量严格对应（64×64，中心 333,422），与 .tbar 分开排版，
     中间留 12px 间隙 —— 参考图里它就是一个独立的圆形按钮，不是条内第四项。
     直径 64 = 条高 64：上下沿与条齐平（648~712），才是同一视觉高度，
     之前 56（0.875）看着还是矮一截，48（0.75）更明显。 */
  .tbar-search {
    position: absolute;
    left: 301px; top: 390px; width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.30));
    z-index: 7;   /* 放大镜与三个标签不同：搜索按钮是**常驻**玻璃（不浮起沉降），
                     放大镜若放到玻璃之下就永远只能透过折射看到，会糊。它是静态图标，
                     保持清晰、压在玻璃之上。需要折射的是选中框 pill，不是这个按钮。 */
  }
  .tbar-search svg { width: 26px; height: 26px; }
  .sl-row {
    position: absolute; left: 45px; width: 300px; height: 52px;
  }
  .sl {
    position: absolute; left: 0; right: 0; top: 11px; height: 30px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;              /* 触屏拖动：不加会被浏览器当成滚动手势并发出 pointercancel */
    pointer-events: auto;            /* .phone-ui 整层 none，这里必须打开 */
  }
  .sl-track {
    position: absolute; left: 0; right: 0; top: 11px; height: 8px;
    border-radius: 4px;
    /* 半透明，透出背景；与纹理里的 SL_TRACK_OFF 同色同 alpha */
    background: rgba(191, 219, 254, 0.40);
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.06);
    pointer-events: none;
    overflow: hidden;
  }
  .sl-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0;
    border-radius: 4px;
    background: #2563eb;
    pointer-events: none;
  }
  .sl-thumb {
    position: absolute; top: 0; left: 0;
    width: 46px; height: 30px;
    /* 原版：15px = 半高 → 胶囊。曾改成 50%（真椭圆）配合玻璃的真椭圆，
       现在玻璃已改回胶囊，本体同步改回原版，避免一个圆一个方。 */
    border-radius: 15px;
    background: #fff;
    box-shadow: 0 0 1px rgba(0, 0, 0, 0.25),
                0 4px 11px rgba(0, 0, 0, 0.08),
                -1px 3px 3px rgba(0, 0, 0, 0.14);
    /* 点击轨道跳转时滑过去要有过渡；拖动中由 .sl.drag 关掉，跟手才不拖沓 */
    transition: transform .22s cubic-bezier(.42, .80, .58, 1.0);
    will-change: transform, width;
    pointer-events: none;
  }
  .sl.drag .sl-thumb { transition: none; }
  /* 点击轨道跳转期间由 JS 逐帧驱动位置（见 slJumpStep），必须关掉 CSS 过渡，
     否则 JS 写的值与 CSS 的 220ms 补间叠在一起，滑块会被拖慢、蓝条与白块错位。 */
  .sl.jump .sl-thumb { transition: none; }
  .sw-row {
    position: absolute; left: 45px; width: 300px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .sw-row-label {
    font-size: 16px; font-weight: 600; letter-spacing: 0.2px;
    color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.30);
    user-select: none; -webkit-user-select: none;
  }
  .sw {
    /* 加长版轨道：66 × 34（24 寸 1080p @91.8 PPI → 1cm ≈ 36 CSS px，66px ≈ 1.8cm）。
       .sw-row 是 left 45 + width 300 → 右边界 345，right:0 时中心 =
       345 − 33 = 312 = SW_X，与玻璃严格重合（玻璃中心也改到 312，见 JS 侧 SW_X）。
       top 13 = (行高 52 − 轨道高 26)/2 → 中心落在 SW_Y 上。 */
    position: absolute; right: 0; top: 13px;
    width: 66px; height: 26px;
    border-radius: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    pointer-events: auto;      /* .phone-ui 整层 none，这里必须打开 */
  }
  /* 轨道保持 iOS 的实色（浅灰白 / systemGreen），不做玻璃 ——
     要的是「白色圆点浮起变成玻璃」，轨道维持原样。
     它的颜色同时被画进滑块玻璃的折射纹理里（见 createThumbBgTexture），
     所以玻璃折射出来看到的正是脚下的轨道色，物理上正确。 */
  .sw-track {
    position: absolute; inset: 0;
    border-radius: 13px;
    background: #e9edf2;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.06),
                0 1px 3px rgba(0, 0, 0, 0.14);
    /* 必须 linear：滑块玻璃的折射纹理里也画着这 4 条轨道，
       纹理颜色是按同一条 0.30s 线性插值逐帧重画的。
       这里若用 ease-in-out，DOM 轨道与玻璃折射出的轨道色就会在过渡中途对不上，
       点击切换那一瞬间玻璃颜色会突跳一下。两边同曲线才能逐帧同步。 */
    transition: background-color .30s linear;
    pointer-events: none;
  }
  .sw.on .sw-track { background: #34c759; }   /* iOS systemGreen */
  /* 滑块玻璃的投影：玻璃本体画在 WebGL canvas 里，投影只能由 DOM 提供。
     跟随滑块 rect 同步位置，随 lift 张开（浮得越高越远越柔）。 */
  .thumb-shadow {
    position: absolute;
    border-radius: 999px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
  }
  /* 滑块玻璃层：压在 DOM 滑块之上（z 更高），所以静止时被白色圆点完全盖住，
     浮起时白色圆点淡出、玻璃透出来 —— 就是「白点变成玻璃」。
     注意：这块 canvas 覆盖整屏且不裁剪 —— iOS 的滑块按住时会拉长到 35px，
     加上浮起放大就会明显超出 51×31 的轨道，那是原生行为，不是溢出 bug。 */
  #thumb-glass-canvas {
    position: absolute; inset: 0;
    width: 390px; height: 844px;
    z-index: 6;
    pointer-events: none;
    display: block;
  }
  .sw-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 34px; height: 22px;
    border-radius: 11px;
    background: #fff;
    box-shadow: 0 0 1px rgba(0, 0, 0, 0.25),
                0 4px 11px rgba(0, 0, 0, 0.08),
                -1px 3px 3px rgba(0, 0, 0, 0.14);
    /* 位移用带过冲的曲线（第二控制点 1.2 > 1 → 滑过去顶一下再坐回，iOS 的弹性）。
       宽度不用 CSS 过渡：拉长必须发生在「上浮之后」（先浮起 → 再变大 → 撞到头变形完成 → 才下沉），
       由 JS 按浮起量逐帧写入，才能和玻璃的放大严格同步且顺序可控。 */
    transition: transform .30s cubic-bezier(.42, .80, .58, 1.2);
    will-change: transform, width;
    pointer-events: none;
  }
  .sw.on .sw-thumb { transform: translateX(28px); }
  /* 宽度和按住时的位移都由 JS 逐帧写（顺序：先上浮、后变大），所以按住期间必须关掉
     transform 过渡 —— 否则每帧写入的值都被 .30s 过渡插值，位移会慢半拍、跟不住变宽。
     press 一移除就恢复过渡，清掉内联 transform 后走 iOS 那条弹性曲线滑到目标位。 */
  .sw.press .sw-thumb { transition: none; }
  /* 开启态按住要向左长（右端才不会跟着往右跑），位移同步减去拉长量；
     这一条是 CSS 兜底，实际值由 JS 按 grow 逐帧算（20 − 31 = −11px）。 */
  /* 按住时向左长的位移由 JS 按 grow 逐帧算（baseX/SW_TRAVEL 比例补偿），这里不留 CSS 兜底，
     否则会盖掉内联样式导致滑块在按住中途跳一下。 */
  /* 按住且开启态的位移不再留 CSS 兜底值（原来是固定的 translateX(18px)）：
     它用的是「拉长满额」的补偿量，而实际拉长量是 SW_PRESS_GROW × grow（grow 未必到 1），
     于是右端少走一截、左端正常 → 滑块行程区间不以轨道中心对称（实测 24.0 / 39.3，中心应是 33）
     → 玻璃按轨道中心放大后左右探出量不等（16.5 vs 11.0）。现在统一由 JS 按 grow 逐帧写。 */
  .sw.on.press .sw-thumb { transform: translateX(28px); }
  /* 拖拽中关掉过渡，滑块必须严格跟手；松开再交回 CSS 弹性 */
  .sw.drag .sw-thumb { transition: none; }
  .sw:focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; }
  /* 「选择图片」本身也是一块玻璃：背景透明，由下层 canvas 渲染折射。
     pointer-events 关掉，鼠标事件穿透到 canvas 统一处理 —— 否则它会挡住
     被拖到按钮下面的那块玻璃，拖过去就抓不回来了。
     键盘仍可用：button 的 click（Enter/Space 触发）不受 pointer-events 影响。 */
  .pick-btn {
    pointer-events: none;
    width: 260px; height: 52px;
    border: none; border-radius: 26px;
    background: transparent; color: #fff;
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.28);
    transition: opacity 0.12s;
  }
  /* 「选择图片」的点击命中层：用 <label for> 让浏览器原生唤起文件选择器，
     不再依赖 JS 调 input.click()（那种写法在部分浏览器/无用户激活时会被拦）。
     覆盖在按钮之上，但仍会把指针事件转发给玻璃系统，所以果冻手感不受影响。 */
  .pick-hit {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 260px; height: 52px;
    z-index: 6; cursor: pointer; display: block;
    pointer-events: auto;      /* .phone-ui 整层是 none，这里必须显式打开 */
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .pick-btn.pressing { opacity: 0.62; }

  /* ================= 目录页（根页面，默认进入） =================
     铺满整个屏幕：top:0 起，圆角跟随手机外壳。
     顶栏 z-index 更高（5），浮在它上面 —— 所以月亮按钮位置始终不变。
     内容用 padding-top 让开顶栏，但背景是整屏的。 */
  /* 主页面：铺满整屏，层级在场景之下（被推进来的场景盖住），
     顶栏 z5 浮在它上面 → 月亮按钮位置始终不变。 */
  .menu-page {
    position: absolute; inset: 0;
    z-index: 2;
    background: #fff;
    border-radius: var(--phone-radius);
    padding: 100px 20px 24px;      /* 100 = 顶栏 92 + 一点呼吸 */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* visibility 延迟到位移结束再隐藏：既能参与过渡，又不会挡住场景 */
    transition: transform .38s cubic-bezier(.32, .72, 0, 1),
                opacity   .38s ease,
                visibility 0s linear .38s;
  }
  body.menu-open .menu-page,             /* 主页面在前 */
  body.menu-open .menu-glass-layer {
    transform: none; opacity: 1; visibility: visible;
    transition-delay: 0s, 0s, 0s;
  }
  body:not(.menu-open) .menu-page,       /* 被压在下面：向左退 + 淡出 */
  body:not(.menu-open) .menu-glass-layer {
    transform: translateX(-30%); opacity: 0; visibility: hidden;
  }
  /* 主页玻璃层：装着「用同一套着色器渲染的圆形玻璃按钮」+ DOM 图标。
     z3 压在 menu-page(z2) 之上，图标再压在 canvas 之上。 */
  .menu-glass-layer {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    border-radius: var(--phone-radius); overflow: hidden;
    transition: transform .38s cubic-bezier(.32, .72, 0, 1),
                opacity   .38s ease,
                visibility 0s linear .38s;
  }
  #menu-glass-canvas {
    position: absolute; inset: 0;
    width: 390px; height: 844px;
    display: block; pointer-events: none;
  }
  .gmenu-fab { pointer-events: auto; }
  .topbar { z-index: 5; }
  body.dark .menu-page { background: #17191d; }
  /* 极淡的底纹：纯色板上毛玻璃糊不出东西、看着像一块塑料。
     这层几乎看不见，但能给 blur 提供内容，玻璃质感立刻出来。 */
  .menu-page::before {
    content: ''; position: fixed; inset: 0;
    pointer-events: none; z-index: -1;
    background:
      radial-gradient(120% 70% at 12% 8%,  rgba(37, 99, 235, 0.11), transparent 60%),
      radial-gradient(100% 60% at 92% 88%, rgba(234, 88, 12, 0.09), transparent 62%),
      radial-gradient(90% 50% at 90% 5%,   rgba(56, 189, 248, 0.24), transparent 64%);
  }
  body.dark .menu-page::before {
    background:
      radial-gradient(120% 70% at 12% 8%,  rgba(56, 189, 248, 0.16), transparent 60%),
      radial-gradient(100% 60% at 92% 88%, rgba(129, 140, 248, 0.14), transparent 62%),
      radial-gradient(90% 50% at 90% 5%,   rgba(56, 189, 248, 0.22), transparent 64%);
  }

  .menu-group-title {
    font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    color: #2563eb; margin: 18px 0 2px;
  }
  .menu-item {
    display: block; width: 100%; text-align: left;
    font: inherit; font-size: 17px; color: #111;
    background: transparent; border: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    padding: 14px 2px; cursor: pointer;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { opacity: 0.5; }
  /* ===== 主页右上角的「深色模式」圆形玻璃按钮 =====
     材质不是 CSS 手搓的 —— 那个和场景里的玻璃根本不是一回事。
     这里 DOM 按钮只负责「接收点击 + 画白色图标」，玻璃本体由
     #menu-glass-canvas 用与场景完全相同的 vertexShader / fragmentShader 渲染，
     参数直接照抄顶栏月亮按钮（glass 6）：40x40 / tint #0f2233 30% / rim 0.50。
     位置严格对齐顶栏月亮（中心 350,60），切页时看着是同一个按钮。 */
  .gmenu-fab {
    position: absolute; top: 40px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; padding: 0; background: transparent;
    box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    display: flex; align-items: center; justify-content: center;
    color: #eaf6f9;
    -webkit-tap-highlight-color: transparent;
    /* 触屏必须：默认 touch-action:auto 时，手指一移动浏览器就判定为滚动手势
       并发 pointercancel（实测：移动 2 步即中断，fabDrag 被清，玻璃拖不动）。
       鼠标不受影响是因为鼠标永远不会触发滚动取消。 */
    touch-action: none;
  }
  .gmenu-fab svg {
    width: 20px; height: 20px; color: #eaf6f9;
    transform-origin: 50% 50%;   /* 跟着玻璃形变缩放时绕中心，不然会偏 */
  }

  body.dark .menu-item { color: #e8eaed; border-bottom-color: rgba(255,255,255,0.09); }

  /* 主页面（默认）：已在根目录，返回箭头隐藏；月亮按钮自己接管点击 */
  body.menu-open .back-btn  { opacity: 0; pointer-events: none; }
  body.menu-open .theme-btn { pointer-events: auto; }

  /* 不用 display:none —— 部分浏览器（Safari）下 label 无法激活 display:none 的 input。
     改成移出屏幕但仍存在于渲染树，label 点击照样能唤起文件选择器。 */
  #fileInput {
    position: fixed; left: -100px; top: -100px;
    width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
</style>

<script>
/* 玻璃形状边缘的抗锯齿倍率：
   1.0 = 一个缓冲像素宽的覆盖率过渡带（推荐）
   0   = 关闭，回到原来的硬边（无任何抗锯齿）
   1.5 = 更柔一点，代价是边缘略糊 */
const EDGE_AA = 1.0;

const vertexShader = `
  varying vec2 vUv;
  varying vec2 vJScale;
  varying vec2 vJShift;
  varying vec2 vBgA;
  varying vec2 vBgB;
  varying vec2 vBgBase;
  /* 边缘抗锯齿用：**一个缓冲像素在 local 空间的尺寸**。
     local 空间 = 屏幕像素坐标除以形变缩放 jScale，而缓冲像素又是
     「名义设备像素」的 renderScale 倍，所以 1 个缓冲像素 =
     1/(jScale * renderScale) 个 local 单位。顶点着色器算一次即可
     （四项输入全是 uniform / 常量），不需要 fwidth / OES 扩展。 */
  varying vec2 vPxLocal;
  uniform vec2 glassSize;
  uniform vec2 resolution;
  uniform float renderScale;
  uniform vec2 bgTexSize;
  uniform float bgScale;
  uniform vec2 bgOffset;
  uniform vec4 jelly;
  uniform vec2 jellyOffset;
  uniform float jellyFollow;
  uniform float jellySqueeze;
  uniform float jellyCorner;
  void main() {
    vUv = uv;
    vec2 halfSize = glassSize * 0.5;
    /* ===== 拉扯形变搬到顶点着色器 =====
       这些量的输入（jelly / jellyOffset / jellyFollow / jellySqueeze /
       jellyCorner / glassSize）**全是 uniform**，与像素无关。原来每个像素都要
       重算一遍 normalize + 2 次 pow + 十几次乘加；现在 4 个顶点各算一次，
       以 varying 传入（四个顶点取到完全相同的值，插值是常量），
       逐像素只剩一次减法、两次除法。 */
    if (abs(jelly.z) > 0.0008) {
      vec2 jd = jelly.xy;
      float jlen = length(jd);
      jd = (jlen > 1e-5) ? jd / jlen : vec2(1.0, 0.0);
      float c2 = jd.x * jd.x;
      float s2 = jd.y * jd.y;
      float A  = jelly.z * (1.0 - jellyFollow) * 0.5;
      float bump = 4.0 * s2 * c2;
      float K  = A * (0.5 + jellyCorner);
      float gx = max(1.0 + A * c2 + K * bump, 0.15);
      float gy = max(1.0 + A * s2 + K * bump, 0.15);
      float sx = gx * pow(gy, -jellySqueeze);
      float sy = gy * pow(gx, -jellySqueeze);
      float reach = length(halfSize);
      float shift = reach * jelly.w * (1.0 + jellyFollow) * 0.5;
      vJScale = vec2(sx, sy);
      vJShift = jd * shift + jellyOffset;
    } else {
      vJScale = vec2(1.0);
      vJShift = jellyOffset;
    }
    vPxLocal = vec2(1.0) / max(vJScale * max(renderScale, 0.01), vec2(0.01));
    /* 屏幕UV→背景UV 在 clamp / 滚动 / 镜像之外是**仿射**的，系数只由 uniform
       决定 —— 放到顶点着色器算一次，逐像素从约 20 条 ALU 降到 2 乘 2 加。
       原来每次采样都要重算，而一个玻璃像素要调它 3 次。 */
    vBgA = vec2(resolution.x / (bgScale * bgTexSize.x), resolution.y / (bgScale * bgTexSize.y));
    vBgB = vec2(0.5 - (resolution.x * 0.5 + bgOffset.x) / (bgScale * bgTexSize.x),
                0.5 + (bgOffset.y - resolution.y * 0.5) / (bgScale * bgTexSize.y));
    vBgBase = vBgA * uv + vBgB;

  uniform vec2 resolution;
  uniform vec2 glassCenter;
  uniform vec2 glassSize;
  uniform float borderRadius;

  uniform float tintStrength;  // 染色强度 0~1

  uniform float bgScale;

  varying vec2 vUv;
  varying vec2 vBgA;
  varying vec2 vBgB;
  varying vec2 vBgBase;
  varying vec2 vJScale;
  varying vec2 vJShift;
  varying vec2 vPxLocal;   // 一个缓冲像素在 local 空间的尺寸（顶点着色器算好）
  uniform float edgeAA;    // 边缘抗锯齿倍率：1=一个像素宽的过渡带，0=关闭（回到硬边）
  uniform float renderScale; // 当前绘制缓冲相对 780×1688 的比例（自适应分辨率）

     参考图那种「圆润」是真椭圆：没有直边，曲率处处连续。
     这里用归一化到单位圆后的一阶泰勒近似：边界处精确（distFromEdge 只关心
     紧贴边缘那一圈），往里会发散到 -∞，故用 -2·min(b) 兜住（中心区本来
     就该 edgeFactor = 0，没有边缘高光）。 */
  float ellipseSDF(vec2 p, vec2 b) {
    vec2 bb = max(b, vec2(1e-4));
    vec2 q = p / bb;
    float k = length(q);                                  // <1 内部，=1 边界
    vec2 g = vec2(q.x / bb.x, q.y / bb.y);
    float d = (k - 1.0) / max(length(g), 1e-6);
    return max(d, -min(bb.x, bb.y) * 2.0);
  }

  // 统一入口：调用点不用关心当前是哪个形状
  float glassSDF(vec2 p, vec2 b, float r) {
    return (shapeMode > 0.5) ? ellipseSDF(p, b) : roundedRectSDF(p, b, r);
  }

  // 玻璃染色：混色 / 正片叠底 / 滤色
  vec3 applyTint(vec3 col) {
    if (tintStrength <= 0.0) return col;
    vec3 t = tintColor;
    vec3 blended;
    if (tintMode < 0.5) {
      // 混色：直接按比例覆盖，最直观
      blended = mix(col, t, tintStrength);
    } else if (tintMode < 1.5) {
      // 正片叠底：保留背景明暗，适合做有色玻璃
      blended = mix(col, col * t, tintStrength);
    } else {
      // 滤色：提亮染色，适合做发光感
      blended = mix(col, 1.0 - (1.0 - col) * (1.0 - t), tintStrength);
    }
    return clamp(blended, 0.0, 1.0);
  }

  void main() {
    vec2 pixelSize = vec2(1.0) / resolution;
    vec2 pixelPos = vUv * resolution;
    vec2 halfSize = glassSize * 0.5;
    float r = clamp(borderRadius, 0.0, min(halfSize.x, halfSize.y));
    /* ===== 拉扯形变搬到顶点着色器 =====
       这些量的输入（jelly / jellyOffset / jellyFollow / jellySqueeze /
       jellyCorner / glassSize）**全是 uniform**，与像素无关。原来每像素都要
       重算一遍 normalize + 2 次 pow + 十几次乘加；现在 4 个顶点各算一次，
       以 varying 传进来 —— 四个顶点取到完全相同的值，插值是常量，
       逐像素只剩一次减法、两次除法。 */
    vec2 jScale = vJScale;
    vec2 shapeShift = vJShift;
    vec2 localPos = (pixelPos - glassCenter - vJShift) / vJScale;

    float aaW = 0.5 * max(vPxLocal.x, vPxLocal.y) * edgeAA;
    /* ===== 廉价 AABB 预剔除 =====
       形状 ⊂ 包围盒，所以「点到包围盒的距离」是 SDF 的下界：
       盒外一点一定在形状外（dist > 0），抗锯齿带也够不着。
       椭圆 / 圆形玻璃的 scissor 框里约 21.5% 的面积落在形状外，
       这些像素可以跳过 ellipseSDF 的 2 次 sqrt 与 2 次除法。 */
    vec2 aq = abs(localPos) - halfSize;
    float boxOut = max(aq.x, aq.y);
    float dist;
    if (boxOut > aaW) {
      dist = boxOut;                       // 盒外：SDF 下界，且已超出抗锯齿带
    } else {
      dist = glassSDF(localPos, halfSize, r);
    }

    /* ===== 边缘抗锯齿：SDF 解析覆盖率 =====
       原来只有 if (dist < 0.0) 的硬二值判断 —— 形状外一律 discard，
       边缘是一条阶梯状的硬边。自适应分辨率降到 0.5 档时缓冲只有 390×844、
       与 CSS 尺寸 1:1，手机上再把 390 CSS 拉伸到 DPR3 的 1170 物理像素，
       锯齿会非常明显。
       SDF 的好处是覆盖率可以**解析地**算出来：dist 是到边界的有符号距离
       （local 单位），一个缓冲像素跨过的距离就是 vPxLocal（顶点着色器已按
       jScale 形变缩放与当前 renderScale 算好）。过渡带恒为一个像素宽，
       不需要多重采样、也不需要 OES_standard_derivatives 扩展。 */
    float cov = (edgeAA > 0.0)
      ? (1.0 - smoothstep(-max(aaW, 1e-5), max(aaW, 1e-5), dist))
      : step(dist, 0.0);

    if (cov > 0.0015) {
      // 距边缘距离（内部为正）；抗锯齿带里 dist>0（在形状外），钳回 0
      float distFromEdge = max(-dist, 0.0);
      float minSide = min(halfSize.x, halfSize.y);
      float bandRatio = clamp(minSide * edgeWidth, 2.0, minSide);
      float bandFixed = clamp(edgeWidthPx, 2.0, minSide);
      float bandWidth = mix(bandRatio, bandFixed, step(0.5, edgeWidthMode));
      float maxOffset = minSide * refractStrength * 0.01;
      /* 边缘高光的线宽：原来固定按「设备像素」算（1.1~2.0），而自适应分辨率
         降档后一个缓冲像素等于好几个设备像素 —— 0.5 档时这条亮线只剩不到
         1 个缓冲像素宽，沿着圆角边就会出现时断时续的亮点，看着就是一圈锯齿。
         这里给它一个**按屏幕像素**算的下限（约 1.7 个缓冲像素），降档时线宽
         自动变粗，亮线始终连成一条。满分辨率下取值不变（1.83 > 1.7）。 */
      float rimW = max(clamp(minSide * 0.025, 1.1, 2.0),
                       1.0 / max(renderScale, 0.05));

      // 屏幕像素位置（GL 系，与 glassCenter 同坐标系）
      vec2 fragPx = vec2(vUv.x * resolution.x, vUv.y * resolution.y);
      // 光斑中心 = JS 冻结的手指位置，**不加任何形变变换**
      vec2 lightC = glowPos;
      float pd = length(fragPx - lightC);
      // 手指透镜只在光斑半径 1.25 倍内非零（smoothstep(1.25,0,q)），超出即为 0
      bool lensOn = (pointerAmt > 0.001) && (glowLens > 0.0) &&
          (pd < 1.25 * max(glowRadius * max(jScale.x, jScale.y), 1.0) + 2.0);
      // 折射带 + rim 的最大影响深度：超过它，法线 / 折射 / 高光全部恒为 0
      float deep = max(bandWidth, rimW * 8.0);

      /* 内部快路径：玻璃**深处**既没有折射（edgeFactor = 0）也没有 rim
         （exp(-d³·2) 在 d>3 时已 < 1e-23），梯度根本用不上。
         这一片占玻璃面积的绝大部分 —— 跳过 2 次 SDF 求值、1 次 pow。 */
      vec2 normalDir = vec2(0.0);
      float edgeFactor = 0.0;
      vec2 offset = vec2(0.0);
      if ((distFromEdge < deep) || lensOn) {
        // SDF 梯度 = 形状的外法线方向（四边朝向外，圆角处径向）
        float eps = 1.0;
        float dx = glassSDF(localPos + vec2(eps, 0.0), halfSize, r) - dist;
        float dy = glassSDF(localPos + vec2(0.0, eps), halfSize, r) - dist;
        vec2 grad = vec2(dx, dy);
        float gradLen = length(grad);
        // 防止中心附近梯度为零时 normalize 出问题
        normalDir = gradLen > 0.001 ? grad / gradLen : vec2(0.0);
        // 边缘强度：边缘处 = 1，往中心逐渐降到 0
        edgeFactor = pow(1.0 - clamp(distFromEdge / bandWidth, 0.0, 1.0), edgeBend);
        // 折射偏移（短边百分比，尺寸变化自动匹配）
        offset = normalDir * (edgeFactor * maxOffset);
      }

      // ===== 手指透镜：手指按下的地方把背景额外"顶"开一点 =====
      if (lensOn) {
        float q = length((fragPx - lightC) / max(glowRadius * jScale, vec2(1.0)));
        // 径向向外推：中心推得最多（一小片），往外平滑归零
        float lens = smoothstep(1.25, 0.0, q) * pointerAmt * glowLens;
        vec2 dir = (pd > 0.001) ? (fragPx - lightC) / pd : vec2(0.0);
        offset += dir * lens * maxOffset * 0.30;
      }

      // 折射后的取样中心（屏幕 UV）
      vec2 centerUv = vUv - offset * pixelSize;
      /* 折射后的背景UV：仿射部分已在 vBgBase 里，这里只减掉折射位移那一项。
         下面 1~3 次采样（色散）共用它，不必各自重算 vBgA * screenUv + vBgB。 */
      vec2 bgBase = vBgBase - vBgA * (offset * pixelSize);

      // 玻璃模糊（无模糊时 wsum = 1，下面三次采样即最终结果）
      vec2 dispUv = offset * pixelSize * dispersion * 0.01;
      vec2 dBg = vBgA * dispUv;   // 提到分支外：下面 clarity 那条分支也要用
      float clarity = clamp(edgeFactor * edgeClarity, 0.0, 1.0);
      /* 色散：dispUv = 0（玻璃内部、无折射）时，三次采样取的是**同一个 uv**，
         分别取 .x/.y/.z 与一次 .rgb 完全等价 —— 直接省掉 2 次纹理采样。
         玻璃内部占面积的大头，这是逐像素最贵的一项。 */
      vec3 acc;
      if (dot(dispUv, dispUv) < 1e-12) {
        acc = texture2D(tDiffuse, finishBgUv(bgBase)).rgb;
      } else {
        acc = vec3(
          texture2D(tDiffuse, finishBgUv(bgBase - dBg)).x,
          texture2D(tDiffuse, finishBgUv(bgBase)).y,
          texture2D(tDiffuse, finishBgUv(bgBase + dBg)).z
        );
      }
      float wsum = 1.0;

      // blurRadius 作为 2σ 左右的视觉半径 → σ = radius * 0.5，边缘权重约 exp(-2)
      float sigma = max(blurRadius * 0.5, 0.0001);
      float inv2s2 = 1.0 / (2.0 * sigma * sigma);
      // 逐像素抖动：让相邻像素的采样图案不同，把规则摩尔纹打散成细噪声
      float jit = (blurRadius > 0.0) ? hash12(gl_FragCoord.xy) * 6.2831853 : 0.0;
      /* 【控制中心掉帧的真凶 —— 17 次/像素的纹理采样】
         控制中心玻璃 blurRadius = CC_GLASS_BLUR_MAX = 6 > 0，所以这个循环
         **真的在执行**：每像素 1 次中心 + 16 次高斯布点 = 17 次 texture2D。
         玻璃 scissor 合计约 4.2 倍屏面积，在 1.2M 缓冲上就是 504 万像素
         × 17 = 8570 万次采样/帧；桌面 DPR=1 只有 2360 万次 —— 差 3.6 倍，
         再叠加桌面 GPU 纹理带宽本身就大得多，正好解释 100fps vs 30fps。
         其它场景玻璃 blur=0（use=false）只走 1~3 次采样，所以满帧。
         16 → 8：黄金角布点 + 逐像素抖动下，8 采样对这个 σ 已足够平滑，
         采样量直接减半。想更省就改 6；要回原画质改 16。 */
      const int SAMPLES = 16;
      for (int i = 0; i < SAMPLES; i++) {
        // blurRadius 是 uniform，整批像素取值一致，GPU 会整段跳过 → 无模糊时只花中心采样
        bool use = blurRadius > 0.0;
        if (use) {
          float fi = float(i);
          float rr = sqrt((fi + 1.0) / float(SAMPLES + 1)) * blurRadius; // 面积均匀布点
          float ang = fi * 2.39996323 + jit;                              // 黄金角 ≈137.5°
          vec2 d = vec2(cos(ang), sin(ang)) * rr;
          float w = exp(-(rr * rr) * inv2s2);
          acc += texture2D(tDiffuse, finishBgUv(bgBase - vBgA * (d * pixelSize))).rgb * w;
          wsum += w;
        }
      }
      vec3 blurred = acc / max(wsum, 0.0001);

      /* 折射带清晰度：edgeClarity 全站恒为 0 ⇒ clarity 恒为 0 ⇒
         mix(blurred, sharp, 0) 恒等于 blurred。原来那 3 次 sharp 采样
         （外加 3 次 screenUvToBgUv）100% 是浪费，这里整段跳过。 */
      vec3 col = blurred;
      if (clarity > 0.0) {
        vec3 sharp = vec3(
          texture2D(tDiffuseSharp, finishBgUv(bgBase - dBg)).x,
          texture2D(tDiffuseSharp, finishBgUv(bgBase)).y,
          texture2D(tDiffuseSharp, finishBgUv(bgBase + dBg)).z
        );
        col = mix(blurred, sharp, clarity);
      }

      gl_FragColor = vec4(col, 1.0);
      gl_FragColor.xyz *= 0.95 * (1.0 - bgDim);   // 背景压暗：玻璃透过去看到的也一起暗
      gl_FragColor.xyz = applyTint(gl_FragColor.xyz);

      // ===== 手指内透光：按钮里面跟着手指走的那团光 =====
      // 光晕在 qc > 1 处恒为 0，离手指足够远时整段跳过
      if (pointerAmt > 0.001 && glowGain > 0.0 &&
          pd < glowRadius * (1.0 + glowStretchAmt) * max(max(jScale.x, jScale.y), 0.05) + 4.0) {
        // 椭圆归一化距离：1.0 = 光晕边界
        vec2 jsc = max(jScale, vec2(0.05));
        vec2 P = (fragPx - lightC) / jsc;                // 片元相对头点
        float sd_len = length(glowStretchDir);
        vec2 sd = (sd_len > 1e-4) ? glowStretchDir / sd_len : vec2(1.0, 0.0);
        float al = dot(P, sd);                           // 沿运动方向（正 = 前方）
        float pe = dot(P, vec2(-sd.y, sd.x));            // 垂直方向
        float sFront = 1.0;
        float sBack  = 1.0 + glowStretchAmt;
        float s = mix(sBack, sFront, smoothstep(-3.0, 3.0, al));
        float dseg = length(vec2(al / max(s, 1.0), pe));
        float qc = dseg / max(glowRadius, 1.0);          // 归一化胶囊距离：1.0 = 光晕边界
        float t = clamp(qc, 0.0, 1.0);
        // smoothstep 的平顶段 [0, GLOW_PLATEAU] 恒为 1（完全均匀），之后平滑降到 0
        float shape = 1.0 - smoothstep(glowPlateau, 1.0, t);
        // 等值线外推：边界处取「再往内 glowEdgeFadePx 处」的光强，
        // 于是边界绝不比内侧暗 —— 从结构上杜绝暗带。
        float dfeGrow = distFromEdge + max(glowEdgeFadePx, 0.0);
        shape *= smoothstep(0.0, max(glowEdgeFadePx, 0.001), dfeGrow);
        // 呼吸只改整体强度，不随位置变化
        float flow = 0.97 + 0.03 * sin(uTime * 1.6);
        float g = shape * glowGain * pointerAmt * flow;
        // 防过曝：亮处少加、暗处多加（0.20 实测光团内部足够均匀）
        float lum = dot(gl_FragColor.xyz, vec3(0.299, 0.587, 0.114));
        gl_FragColor.xyz += vec3(0.94, 0.97, 1.06) * g * (1.0 - 0.20 * lum);
      }

      // ===== 边缘高光（glassmorphism 的一圈亮边）=====
      // 位置参考：光从左上方来 —— 上边和左边最亮，右下保留一点很弱的补光
      if (rimStrength > 0.0 && distFromEdge < rimW * 8.0) {
        vec2 L = normalize(vec2(-0.70, 0.71));
        float facing = max(dot(normalDir, L), 0.0);
        float dirw = (0.26 + 0.74 * facing) / 0.785;
        float backw = 0.25 * max(dot(normalDir, -L), 0.0);
        float d = distFromEdge / rimW;          // 0 = 正在边缘，往内增大
        float line = exp(-d * d * d * 2.0);     // 平顶陡降
        float glow = exp(-d * 2.2) * 0.10;      // 仅 1px 内的柔边，用于消锯齿
        float amt = clamp((line + glow) * (dirw + backw) * rimStrength, 0.0, 1.0);
        gl_FragColor.xyz = mix(gl_FragColor.xyz, vec3(1.0), amt);
      }

      // 边缘覆盖率：抗锯齿带内 alpha < 1，与身后的背景按 NormalBlending 混合
      gl_FragColor.a *= cov;

    } else {
      // 只画玻璃模式：非玻璃区域全透明，支持多玻璃叠加
      if (drawGlassOnly > 0.5) {
        discard;
      }
      // 背景始终用清晰纹理：不能因为某块玻璃开了模糊，就把整屏背景也糊掉
      vec2 bgUv = finishBgUv(vBgBase);        // 已 clamp，不会越界
      gl_FragColor = texture2D(tBackdrop, bgUv) * (1.0 - bgDim);
    }
    // 整块淡入淡出（只有滑块玻璃用到）
    gl_FragColor.a *= clamp(uAlpha, 0.0, 1.0);
  }
`;

/* ================= 手机尺寸与坐标 =================
   内部一律用「设备像素」坐标：canvas 实际像素 = 390x844 的 SCALE 倍。
   逻辑坐标（glass.x/y/width/height）与 uniform 全部是设备像素，避免 DPR 分支。
   DOM 覆盖层用 CSS 像素（= 设备像素 / SCALE）。 */
const PHONE_W = 390, PHONE_H = 844;
const SCALE = 2;
const W = PHONE_W * SCALE, H = PHONE_H * SCALE;

const TINT_MODES = ['mix', 'multiply', 'screen'];
const DEFAULT_TINT = { color: '#ffffff', strength: 0, mode: 'mix' };

let renderer, scene, camera, material, texture;
let bgDim = 0, bgBlur = 0;
let bgScale = 1, bgOffsetX = 0, bgOffsetY = 0;

/* ================= 四个玻璃按钮 =================
   尺寸/坐标都是设备像素。胶囊：高 52 CSS（104 设备像素），圆角 = 高/2。 */
const CX = W / 2;

// 折射位移对标 Backdrop：refraction(amount = size.minDimension)
// 本文件 maxOffset = 半短边 × refractStrength × 0.01，
// 而 amount = minDimension = 2 × 半短边 → 满档对应 refractStrength = 200。
// 折射强度 = 「折射带把背景压缩了多少倍」（位移 / 带厚）：
//   80 → 2.5x   95 → 3.0x   140 → 4.4x   200 → 6.3x（Backdrop 的 amount 对标值）
// 实测（关掉高光纯测折射，与背景自身梯度 1.162 比对）：
//   80 → 折射带梯度 1.146，比值 0.99（与背景连续，观感和谐）
//   95+ → 比值升到 1.26，边缘开始出现硬边/过冲
// Backdrop 的 amount=minDimension(6.3x) 在它那套渲染里成立，但本实现的折射带更薄
// （带厚 = 半短边×0.32），同样位移会压缩得更狠。取 80：可见度保留约 55%，压缩比 2.5x。
const REFRACT = 80;

/* ================= 手指内透光 =================
   按钮里面那团跟着手指走的光。参数都在 shader 里生效，这里只管强度。
   glowGain  内透光亮度（加色，不会把玻璃糊白）
   glowLens  手指处的额外折射：把背景"顶"开一点，像手指压在液面上
   GLOW_HOVER  桌面端悬停时的弱档（手机上没有 hover，只会走按下/拖动） */
const GLOW_GAIN  = 0.20;   // 内透光强度（加色，已带防过曝，别调太高）
const GLOW_LENS  = 0.0;   // 手指透镜强度（0 = 只发光不改折射）
const GLOW_HOVER = 0.32;
// 光斑是**正圆**：半径不再分 x/y 两个轴（之前 rx≈100 / ry≈19，被压成横椭圆，
// 就是"这个光为什么是这样的"的由来）。
// 平顶很小（10%）：smoothstep 在起点导数为 0，所以中心本来就是平的，
// 把平顶压小能把"渐淡区"从 65% 半径拉长到 90%，正是"渐渐淡下去要长一点"。
const GLOW_PLATEAU = 0.35;   // 核心区完全均匀（"中间搞得一样"），之外才渐渐淡下去
const GLOW_R_EQ    = 1.30;   // 半径上限系数（相对等效半边长）
const GLOW_R_SIDE  = 2.60;   // 半径上限系数（相对短边半径）—— 正圆的主要约束。
                             // 取大值：把衰减区推到形状之外，按钮内部接近铺满，
                             // 光自身的圆形轮廓就不会在按钮内部被看见（也就没有"边"）。
/* 「等值线外推」宽度（设备像素，各向同性）。
   不做「贴边淡出」—— 那会在光与边缘之间留下等宽的暗带（缝隙）。
   改成把等值线往外推 glowEdgeFadePx：边界处取内侧的光强，边界不会比内侧暗。
   设 0 = 完全不外推（边界就是被形状裁断的值）。 */
const GLOW_EDGE_FADE_PX = 3.0;
/* 磁粉效应里「1:1 跟手」→「绕圈匀速」的过渡距离（设备px）。

   y 取 422（占 390~454）—— 场景高 844，中线 422，整排（条 + 搜索按钮）
   竖直居中地落在屏幕正中。原来在 680 是靠底部「选择图片」那一带，
   现在独立成展示项，挪到中间更好观察。
   DOM 的 .tbar 用同一份常量定位（left 25 / top 390 / 264×64），与玻璃像素级重合。 */
const TBAR_X = 157;    // 中心 x：左 25 + 宽 264 / 2
const TBAR_Y = 422;    // 中心 y = 场景高 844 / 2（屏幕竖直中线）
const TBAR_W = 264;    // 条宽：右侧给独立搜索按钮让出 64 + 12 间隙
const TBAR_H = 64;
/* 最右侧的搜索按钮：独立的一块圆形玻璃，不属于标签栏条。
   直径 64 —— 与条高 64 完全相等，上下沿齐平（390~454），
   参考图里它与条是同一视觉高度，之前 56 还是矮了一截。
   右缘 365（与条右缘一样留 25 边距），中心 y 与条对齐。
   条右缘 289 → 按钮左缘 301，中间 12px 间隙。 */
const TBAR_SEARCH_X = 333;   // 中心 x：365 − 64/2
const TBAR_SEARCH_D = 64;
/* 选中框（tab indicator）：
   · 条的内容区 = 264 − 左右各 10 padding = 244，三等分 → 每个 81.33 宽；
   · 框高 48（条高 64，上下各留 8），圆角 = 半高 = 24 → 胶囊；
   · 行程 = 244 − 81.33 = 162.67，中心落在 75.67 / 157 / 238.33，
     正好是三个标签的中心。
   这几个值同时写进 applySwGeometry('tabbar') 的 SW_* 常量，两边必须一致 ——
   DOM 用 CSS 的 left/top/width/height，JS 用 SW_PAD / SW_PAD_Y / SW_THUMB_W / SW_THUMB_H。 */
const TBAR_SEL_W = 244 / 3;      // 81.33
const TBAR_SEL_H = 48;
const TBAR_SEL_PAD_X = 10;       // 内容区左内边距（= .tbar 的 padding-left）
const TBAR_SEL_PAD_Y = 8;        // (64 − 48) / 2
const TBAR_N = 3;                // 标签个数
/* 整条标签栏在选中框浮起 / 拖动时「弹一下」（等比放大的倍数，0.06 = 放大 6%）。
   不是往上平移，而是**向前变大** —— 像被顶向观察者一点，整排等比放大。
   参考 iOS 26 的时序：pill 浮起时底下这条 toolbar 会轻轻弹一下，
   但**透过玻璃看到的标签栏仍是没弹起的那一版静止画面** ——
   纹理里画的一直是未放大的条（见 stepTabbarBounce 的注释）。
   6% 是「一点」的量级：条高 64 → 67.8，看得出弹起，又不至于整排跳出来。 */
const TBAR_BOUNCE = 0.06;
/* 弹起的缩放原点 x。
   以前取「整排中心」195（条左缘 25、按钮右缘 365），因为那时搜索按钮也一起弹；
   现在搜索按钮是**独立的**、不跟着弹（用户要求），所以原点改回**条自己的中心**
   TBAR_X = 157 —— 否则整条会以 195 为中心放大，中心从 157 漂到 152.7（左移 4.3px），
   按下去看着像条往左滑了一下。以自身中心放大则左右对称张开，
   纹理里图标的弹起变换（drawThumbBgTexture）也用这一个原点，两边严格一致。 */
const TBAR_ROW_CX = TBAR_X;
/* 选中框框住的那个标签，图标与文字改成绯红（crimson）—— 白图标在白色毛玻璃条上
   对比不够，选中态看不出来；换成绯红后一眼就能认出当前在哪一页。
   单一来源：CSS 里用 var(--tbar-sel-color)，启动时由这里 setProperty 写进去，
   改这一个常量两边就都变了，不会出现「CSS 一个色、纹理里另一个色」。 */
const TBAR_SEL_COLOR = '#DC143C';
/* 写进 CSS 变量：.tbar-item.on 用 var(--tbar-sel-color) 取色，
   与纹理里画图标用的 TBAR_SEL_COLOR 永远是同一个值。 */
document.documentElement.style.setProperty('--tbar-sel-color', TBAR_SEL_COLOR);

function makeGlass(id, name, xCss, yCss, wCss, hCss, tint, rim, textLight, blurCss) {
  const w = wCss * SCALE, h = hCss * SCALE;
  return {
    id, name,
    x: xCss * SCALE, y: yCss * SCALE,
    width: w, height: h,
    borderRadius: Math.min(w, h) / 2,   // 胶囊 / 正圆
    refractStrength: REFRACT,
    dispersion: 16,                     // 色散：边缘的彩色描边（Backdrop 的 Chromatic aberration）
    edgeWidth: 0.32,
    edgeWidthPx: 50,
    edgeMode: 'ratio',
    edgeBend: 2.0,
    rim: rim,
    blur: (blurCss || 0) * SCALE,   // 高斯模糊半径（设备像素）—— 就是 CSS backdrop-filter: blur(Npx)
    clarity: 0,
    tint: Object.assign({}, DEFAULT_TINT, tint),
    textLight: !!textLight,   // 文字用浅色还是深色，取决于这块玻璃透出来的明暗
    draggable: true,          // 全部可拖：果冻最明显的触发方式就是拖拽
    // ---- 果冻（欠阻尼谐振子）状态 ----
    glowAmt: 0,   // 这块玻璃自己的内透光强度（缓动量）—— 只有被按住/悬停的那块会升起来
    fadeFrom: undefined, fadeT0: 0, fadeTgt: 0,     // 淡出计时（S 形曲线用）
    glowX: xCss * SCALE, glowY: H - yCss * SCALE,   // 光斑头点（GL 系），初始在玻璃中心
    glowTX: xCss * SCALE, glowTY: H - yCss * SCALE, // 虚拟尾点（把拖尾夹在形状内）
    glowVX: 0, glowVY: 0,                           // 平滑后的光斑速度（设备像素/秒）
    glowSDX: 1, glowSDY: 0,                         // 运动方向单位向量
    glowAmtS: 0,                                    // 后方拉长倍率
    jAmt: 0,      // 当前形变量，0 = 无形变，正 = 沿轴拉伸，负 = 压缩
    jVel: 0,      // 形变速度
    jTarget: 0,   // 目标形变（拖拽中由速度决定，松手归 0）
    jDirX: 1, jDirY: 0,   // 形变轴（单位向量，屏幕坐标）—— 由 jAng 派生，每帧更新
    jAng: 0,              // 形变轴角度（模 180°，弧度）—— 平滑量，绝不瞬跳
    jTr: 0,               // 位移量 t（有符号，沿轴）：与形变量 m 分离
    jTrV: 0, jTrT: 0,
    jSide: 1,     // 被牵拉的一侧：+1 = 沿轴正方向那一侧
    homeX: xCss * SCALE, homeY: yCss * SCALE,   // 原位：松手弹回这里
    vx: 0, vy: 0,                               // 位置速度
    _ox: 0, _oy: 0,                             // 当前拉扯量（设备像素）
    jHeld: false, // 是否按住（按住期间保持挤压）
    // ---- 浮起（lift）：整块玻璃等比例放大 + 投影张开 ----
    // 与形变 jAmt 分开：形变是"被拽变形"，浮起是"被按/拖时整块抬起来"。
    // 松开时走欠阻尼弹簧 → 沉过头一点点再坐回来，就是 iOS 那种连贯的"沉下去"。
    lift: 0, liftV: 0, liftHeld: false,
  };
}

const glasses = [
  // 默认背景是深色流体：透明玻璃透出的是深色 → 用浅色文字；
  // Surface 带 22% 白底，底子变浅 → 用深色文字。
  // 染色强度压在 45% 以内：再高就会把折射产生的明暗变化盖掉，变成一块纯色塑料。
  makeGlass(1, '液态玻璃按钮', 195, 336, 300, 52, {},                                 0.60, true),
  makeGlass(2, '液态玻璃按钮',     195, 412, 300, 52, {},                                  0.50, true,  6),
  makeGlass(3, '液态玻璃按钮',      195, 488, 300, 52, { color: '#2563eb', strength: 45 },  0.45, true,  6),
  makeGlass(4, '液态玻璃按钮',      195, 564, 300, 52, { color: '#ea580c', strength: 45 },  0.45, true,  6),
  // 顶栏两个圆形按钮同样是玻璃（Backdrop 的 LiquidButton 就是这个尺寸量级）
  makeGlass(5, '', 40,  60, 40, 40, {},                                0.55, true),
  makeGlass(6, '', 350, 60, 40, 40, { color: '#0f2233', strength: 30 }, 0.50, true),
  // 底部「选择图片」也是玻璃（与 .pick-btn 的位置尺寸严格对应：260x52，底边距 56）
  makeGlass(7, '', 195, 762, 260, 52, { color: '#2563eb', strength: 45 }, 0.45, true,  6),
  // 标签栏场景：一条 iOS 26 风格的底部胶囊条（340×64，圆角 = 半高 = 32）。
  // 只有标签栏场景显示（mode='tabbar'，见 setSceneMode）。
  // 带 22% 白染色：纯透明时玻璃只靠折射和 rim，在深色流体背景上几乎看不见
  // （实测内外亮度 54 vs 60，等于没有）—— 染一点白才成一条浮起来的浅色条。
  makeGlass(8, '', TBAR_X, TBAR_Y, TBAR_W, TBAR_H, { color: '#ffffff', strength: 22 }, 0.60, true, 6),
  // 标签栏右侧的搜索按钮：独立圆形（直径 48，圆角 = 半宽 = 24 → 正圆）。
  // 材质与标签栏条一致（22% 白 + blur 6），但它是单独一块玻璃，
  // 与条之间有 12px 间隙，不是条内的一项。
  makeGlass(9, '', TBAR_SEARCH_X, TBAR_Y, TBAR_SEARCH_D, TBAR_SEARCH_D, { color: '#ffffff', strength: 30 }, 0.60, true, 6),
];
glasses[6].pick  = true;   // 点击（未拖动）= 选择图片   glasses[6] = 底部 (195,762)
glasses[5].theme  = true;   // 点击（未拖动）= 切换深色/浅色  glasses[5] = 右上 (350,60)
glasses[4].back   = true;   // 点击（未拖动）= 回到目录页   glasses[4] = 左上 (40,60)
// 中间四块属于「按钮场景」：开关场景会把它们摘掉（顶栏 + 选择图片两个场景共用）
glasses[0].mode = 'buttons';
glasses[1].mode = 'buttons';
glasses[2].mode = 'buttons';
glasses[3].mode = 'buttons';
/* 标签栏玻璃只在标签栏场景出现（其余场景 hidden），
   且第一步只做静态外观：不参与拖拽命中（draggable=false），
   交互与动画后续再加。
   注意索引：makeGlass 的第一个参数只是名字（1-based），数组索引要减一 ——
   所以 7 = 标签栏条、8 = 右侧搜索按钮；6 是「选择图片」，四个场景共用，
   绝不能挂 mode（否则它会被别的场景摘掉）。 */
glasses[7].mode = 'tabbar';
glasses[7].draggable = false;
glasses[7].hidden = true;   // 默认不在任何场景里（首屏是目录页），由 setSceneMode 打开
/* 搜索按钮：同样是标签栏场景专属的玻璃。
   draggable = true —— 它是独立的一块圆形玻璃，要能像按钮场景那四块一样
   单独拖动变形（拉扯 → 沿轴拉伸 + 位移 → 松手 jellyRelease 回弹）。
   命中安全：hitGlass 第一行就跳过 g.hidden，而这块只有标签栏场景 hidden=false，
   其它场景（主页 / 按钮 / 开关 / 滑块）里它根本不在场，抓不到也不会被抓。
   位置安全：PULL_FOLLOW=0，玻璃本体钉死在 homeX/homeY，拖它只形变、不移位，
   所以它永远不会跑到「选择图片」那块玻璃底下（otherGlassAt 不会误抓它）。 */
glasses[8].mode = 'tabbar';
glasses[8].draggable = true;
glasses[8].hidden = true;
/* 圆形按钮的染色要比条高：直径 64（条宽 264），折射带占满半径的比例比条更大，
   中心透出的背景更多 → 22% 染色时实测比条暗一截，看着像两块不同的材质。
   提到 30% 后实测与条对齐，两块才像同一套玻璃。 */
glasses[8].tint.strength = 30;
/* 折射位移过大 → 采样映射「折叠」（焦散），这才是"接缝"的真因：
   折射位移   M = minSide × refractStrength × 0.01
   折射带宽度 B = minSide × edgeWidth
   沿半径的位移梯度峰值 = M × edgeBend / B（u→1 处）。
   梯度 > 1 时，采样位置随半径**倒退** —— 这一圈里的背景被镜像折叠，
   高对比背景上就是一圈明显的断裂；又因为边缘显示的是更靠中心的背景，
   看着还像"凹下去"。拖到边缘时压缩轴 s<1，梯度再除以 s，更严重。
   搜索按钮 minSide = 64（64×64 正圆，本项目里最大的一块），折叠区最宽：
     原值 rf 80 / ew 0.32 → M 51.2、B 20.48、梯度 5.00
     静止折叠区 7.50 css，拖动压缩轴 9.81 css（最负步进 −4.31/px）
   改为 rf 24 / ew 0.60 → M 15.36、B 38.4、梯度 0.80 < 1
     → 全程单调，零折叠（含形变最不利的压缩轴）。
   只动 glasses[8]：其它玻璃的 refractStrength / edgeWidth 保持原值。 */
glasses[8].edgeWidth = 0.32;
glasses[8].refractStrength = 80;


/* ================= 控制中心场景 =================
   一整屏 iOS 控制中心：中间所有方块都是 canvas 渲染的玻璃，DOM 只画玻璃之上的图标。
   布局区间：手机屏 390×844，顶栏在 y=60、底部「选择图片」在 y=762，
   所以内容取 y 107~613，左右各留 20 边距。
   每一项都是独立一块玻璃：可拖动形变（果冻）、带 6css 高斯模糊（毛玻璃），
   材质与标签栏那套一致（白染色 + blur），所以整屏是同一种液态玻璃。 */
const CC_TINT = { color: '#ffffff', strength: 24 };
const CC_BLUR = 6;                       // css px：控制中心玻璃的毛玻璃模糊（原值）
/* 「玻璃后面」糊不糊，全看 setGlassUniforms 里的 blurPx：
       blurPx = max(glass.blur, bgBlur) → 决定 tDiffuse 取哪张模糊纹理
   而玻璃的折射采样源就是 tDiffuse。所以之前把控制中心这块玻璃的 blurPx
   强行取 0，等于把「透过玻璃看到的背景」也一起变清晰了 —— 玻璃后面就没了模糊。

   现在改成与壁纸模糊同一个自变量 ccReveal（见下 ccGlassBlurPx）：
       完全展开 → CC_GLASS_BLUR_MAX（毛玻璃质感回来了）
       上滑收起 → 渐渐减弱，玻璃淡尽时刚好归零
   即「玻璃消失、玻璃后面的模糊也刚好消失」，与 uAlpha 淡出天然同步。
   折射 / 色散 / 边缘 rim / 染色均不受影响（只动模糊这一项）。
   想让玻璃恒定清晰：CC_GLASS_BLUR_ON = false 且 CC_BLUR = 0。 */
const CC_GLASS_BLUR_MAX  = 6;   // 完全展开时「玻璃后面」的模糊半径
const CC_GLASS_BLUR_STEP_G = 3; // 量化档距：0/3/6 共 3 档（档数越少，进入场景时生成越少）
const CC_GLASS_BLUR_ON  = true; // 总开关：false = 玻璃模糊不跟随出场（退回 CC_BLUR 常量）
function ccGlassBlurPx() {
  // 返回 -1 表示"不接管"，走原来的 max(glass.blur, bgBlur)
  if (!ccSheetOn() || !CC_GLASS_BLUR_ON) return -1;
  /* 恒定取最大档，不再随 ccReveal 逐档切换 —— 拖动时每跨一档就要现场生成
     一张全屏模糊纹理（手机上一次几十 ms）。玻璃消失由 uAlpha 淡出负责，
     模糊量不需要跟着变：全程只用 1 张纹理，拖动时零生成。 */
  return CC_GLASS_BLUR_MAX;
}

/* ---- 控制中心「出场进度 → 壁纸高斯模糊」 ----
   手机上的真实观感：控制中心一拉出来，背后壁纸就整个糊掉；往上推回去，
   糊的程度跟着退，面板消失时壁纸也刚好恢复清晰。
   所以让「背景帧的模糊量」也挂在 ccReveal 上：
       ccReveal = 1（完全展开）→ CC_BG_BLUR_MAX
       ccReveal = 0（玻璃已淡尽）→ 0
   与玻璃自己的 uAlpha 淡出同一个自变量，"玻璃消失、模糊也刚好消失"是天然成立的。

   两点实现上的约束：
   ① 必须**量化**成整数档。getBgTextureForBlur 是按模糊半径缓存整张 780×1688
      纹理的，ccReveal 连续变化时若直接取整到 1px，一次收起就要新建十几张
      全屏模糊纹理（每张都要跑一次大画布 blur）→ 必然卡。
      现按 CC_BG_BLUR_STEP 取档，一次出场最多经过 7 档。
   ② 档位要**留一段时间**再回收。refreshBlurTextures 每帧会把不在 need 里的
      档位 dispose 掉，如果只加"当前这一档"，来回滑动就会反复重建。
      所以维护 ccBlurRecent（最近 6 档），滑动过程中复用。
   控制中心以外：ccBgBlurPx() 直接返回 bgBlur，一行不多走。 */
const CC_BG_BLUR_MAX  = 16;   // 完全展开时壁纸的模糊半径
const CC_BG_BLUR_STEP = 8;    // 量化档距：0/8/16 共 3 档（档数越少，首次生成越少）
const ccBlurRecent = [];
let CC_BG_BLUR_ON = true;    // 总开关：false = 关闭"壁纸随出场模糊"（退回旧行为）
function ccBgBlurPx() {
  const base = Math.round(bgBlur || 0);
  if (!ccSheetOn() || !CC_BG_BLUR_ON) return base;  // 其余场景：与改动前逐字相同
  const p = Math.max(0, Math.min(1, ccReveal));
  const q = Math.round(p * CC_BG_BLUR_MAX / CC_BG_BLUR_STEP) * CC_BG_BLUR_STEP;
  return Math.max(base, q);                         // 全局「背景模糊」滑块仍然生效
}

/* 控制中心：壁纸压暗也跟着出场进度走（与模糊同一个自变量 ccReveal）。
   bgDim 在 shader 里是**两处**一起生效的（不用新增贴图、不用新增 pass）：
     ① 背景分支  gl_FragColor = texture2D(tBackdrop, bgUv) * (1.0 - bgDim)
     ② 玻璃分支  gl_FragColor.xyz *= 0.95 * (1.0 - bgDim)
   所以「壁纸变暗」和「玻璃里透出来的背景也变暗」是同一次赋值，天然同步，
   正是系统控制中心的行为：玻璃后面的世界变暗，玻璃本身也跟着暗。
   DOM 图标层不在 shader 里，不受影响 → 控件保持高亮可读。
   控制中心以外：ccDimAmt() 直接返回 bgDim（深色模式的原值），逐字不变。 */
const CC_DIM_MAX = 0.38;      // 完全展开时的压暗量（iOS 大约 0.35~0.5）
let CC_DIM_ON = true;         // 总开关：false = 关闭压暗（退回旧行为）
function ccDimAmt() {
  if (!ccSheetOn() || !CC_DIM_ON) return bgDim;     // 其余场景：与改动前完全相同
  const p = Math.max(0, Math.min(1, ccReveal));

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;

/* 19 块小玻璃不再单独接受拖拽：命中统一交给 ccSheet（见 hitGlass）。

function ccSheetOn() { return sceneMode === 'control'; }

/* 控制中心整块玻璃 ccSheet 刻意**不在 glasses 里**（见上面注释：

   setSceneMode 里那几个 glasses.forEach 分支**一个都碰不到它**。

   19 块小玻璃的形变被清了、ccSheet 的没清；下次再进控制中心，
   ccBroadcast 第一帧就把上次的残余 jAmt / jTr 广播给 19 块 ——
   中间直接悬停在上一次那一帧的形变上，看着就像"动画被截下来贴在屏幕上"。

   切进 / 切出都要清。 */

  const g = (typeof ccSheet !== 'undefined') ? ccSheet : null;
  if (!g) return;
  g.jAmt = 0; g.jVel = 0; g.jTarget = 0;
  g.jTr = 0; g.jTrV = 0; g.jTrT = 0; g.jSide = 1;
  /* 轴复位成纵向：CC_DRAG_ONLY_DOWN 按下时给的就是纵向（along = PI/2），
     保持一致，免得第一帧用上一次的轴方向算漂移。 */
  g.jAng = Math.PI / 2; g.jDirX = 0; g.jDirY = 1;
  g._ox = 0; g._oy = 0; g.vx = 0; g.vy = 0; g.jHeld = false;
  g.jOx = 0; g.jOy = 0;                 // 展开/收起那份漂移也要清
  g.lift = 0; g.liftV = 0; g.liftHeld = false;
  g.glowAmt = 0; g.glowAmtS = 0;
  g.x = g.homeX; g.y = g.homeY;
  /* 拖到一半就退出：全局 dragging 还指着 ccSheet，不清的话
     pointerup 会去更新一块已经不属于当前场景的玻璃。 */
  if (typeof dragging !== 'undefined' && dragging && dragging.glass === g) {
    dragging = null;
    if (typeof activeGlass !== 'undefined') activeGlass = null;

/* ================= 控制中心：展开 / 收起（一整块一起动） =================

     · 上滑 → 进度减小 → 整块向上短距离移动 + 渐渐淡出，**不形变**。
       （CC_DRAG_ONLY_DOWN 已把非向下拉扯投影成 0，形变本来就是 0，无需另加开关。）
     · 下拉 → 进度增大 → 原路向下 + 渐渐淡入；形变按进度缩放：
       刚显现时（p→0）几乎无形变，越往下拉越明显、拉得也越长，
       p=1 时倍率恰为 1 —— 与现在的满形变**逐字相同**，完全展开的观感一点不变。

const CC_REVEAL_OFF   = 28 * SCALE;    // 完全收起时整块向上移动的距离（设备px = 28 CSS，「短距离」）

const CC_REV_K = 260;                  // 复位弹簧刚度 → ω≈16.1 rad/s，周期 0.39s
const CC_REV_C = 22;                   // ζ≈0.68 —— 轻微过冲一次就坐住，是「回弹」不是「抖」
/* 进场单独一套更软的弹簧：上面那套 0.2s 就到位，太快，看不出「渐渐淡入」。
   这套 ω≈8.4 rad/s、ζ≈0.85：约 0.3s 涨到 90%、0.5s 稳住，与手机下拉的节奏接近。

const CC_REV_IN_K = 70;
const CC_REV_IN_C = 14.2;
let ccReveal = 1, ccRevealV = 0, ccRevealTgt = 1;

let ccDismissing = false;  // 已判定「收起」，收到 0 就回目录页
let ccEntering   = false;  // 进场中（用软弹簧），到位即清

/* 把 ccSheet 的形变解算成缩放 / 平移场。公式与 fragment shader 的 jelly 段
   **逐字一致**（JELLY_FOLLOW / JELLY_SQUEEZE / CORNER_GAIN），否则 canvas 玻璃
   与 DOM 图标层会走成两个不同的形变 —— 图标就浮在玻璃外面了。 */
function ccSheetField(k) {
  const s0 = (k == null ? 1 : k);      // 形变强度倍率 = 展开进度（刚显现时无形变）
  const amt = (ccSheet.jAmt || 0) * s0, tr = (ccSheet.jTr || 0) * s0;
  let ux = ccSheet.jDirX || 0, uy = ccSheet.jDirY || 0;
  const nn = ux * ux + uy * uy;
  if (nn > 1e-9) { const L = Math.sqrt(nn); ux /= L; uy /= L; } else { ux = 1; uy = 0; }
  const c2 = ux * ux, s2 = uy * uy;
  const A  = amt * (1 - JELLY_FOLLOW) * 0.5;
  const K  = A * (0.5 + CORNER_GAIN);
  const bump = 4 * s2 * c2;
  const gx = Math.max(1 + A * c2 + K * bump, 0.15);
  const gy = Math.max(1 + A * s2 + K * bump, 0.15);
  const sx = gx * Math.pow(gy, -JELLY_SQUEEZE);
  const sy = gy * Math.pow(gx, -JELLY_SQUEEZE);
  const shift = Math.hypot(ccSheet.width, ccSheet.height) / 2 * tr * (1 + JELLY_FOLLOW) * 0.5;
  return { amt, ux, uy, sx, sy, shift };
}

// 把 ccSheet 的形变场写进 19 块小玻璃（每帧一次，在 stepGlass 之后）
function ccBroadcast() {
  /* 形变按展开进度缩放：刚显现时几乎无形变，越往下拉越明显、拉得越长。
     p=1 时倍率恰为 1，与改前的广播逐字相同 —— 完全展开后的手感一点不变。 */
  const f = ccSheetField(Math.min(1, ccReveal));   // >1 是回弹过冲，形变倍率不跟着放大
  /* 收起位移（屏幕系设备px，负 = 向上）。加进 jOy 之后，canvas 形状（jellyOffset）、
     裁剪框（scissorToGlass）、DOM 图标（jellyTransform）三处**自动同步** ——
     它们本来就都读 jOy，不需要各改一遍，也不会出现「玻璃走了图标没走」。 */
  const offY = -(1 - ccReveal) * CC_REVEAL_OFF;
  for (let k = 0; k < CC_ITEMS.length; k++) {
    const g = glasses[CC_BASE + k];
    if (!g) continue;
    g.jAng  = ccSheet.jAng;              // 轴：整块同一个轴
    g.jDirX = f.ux; g.jDirY = f.uy;
    g.jAmt  = f.amt;                     // 缩放：与大玻璃同款（贴图被拉伸）
    /* 沿轴平移：shader 里 shift_i = reach_i * jTr * (1+JELLY_FOLLOW)/2，
       reach_i 是**每块自己的**外接圆半径（圆 51.8 / 横条 87.9 / 竖条 88.2 各不相同），
