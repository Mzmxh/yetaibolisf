    ? Math.max(0, Math.min(1, ccReveal)) : 1;
  u.glowPos.value.set(glass.glowX, glass.glowY);
  u.pointerAmt.value = glass.glowAmt;   // 每块玻璃自己的光，不是全局共享
  // 光斑半径：用「等效半边长」√(宽×高)/2，而不是短边。
  // 用短边的话扁条的短边只有 26，光斑小得看不见；等效同时考虑两个维度，
  // 扁条不吃亏 —— 和边缘厚度那套「智能参考量」是同一个思路。
  const wpx = glass.width * bgScale, hpx = glass.height * bgScale;
  const equiv = Math.sqrt(wpx * hpx) * 0.5;
  // 正圆半径：主要受短边约束（大了会溢出上下被裁成扁的），
  // 再叠加一个等效尺寸的上限，避免极小按钮上光斑大得离谱。
  // 允许略微超过短边半径 —— 溢出的是最外圈很淡的部分，裁掉不影响"圆"的观感。
  const r = Math.min(equiv * GLOW_R_EQ, Math.min(wpx, hpx) * 0.5 * GLOW_R_SIDE);
  u.glowRadius.value = r;
  u.glowStretchDir.value.set(glass.glowSDX || 1, glass.glowSDY || 0);
  u.glowStretchAmt.value = glass.glowAmtS || 0;
  u.glowPlateau.value = GLOW_PLATEAU;
  u.glowEdgeFadePx.value = GLOW_EDGE_FADE_PX;
  u.glowGain.value = GLOW_GAIN;
  u.glowLens.value = GLOW_LENS;
  u.uTime.value = clockT;
}

let glassMesh = null;      // 承载玻璃材质的那个 Mesh（背景 pass 要临时换成 bgMaterial）
let bgMaterial = null;    // 整屏背景专用极简材质（见 initThreeJS 末尾）
let scissorSupported = true;
function scissorToGlass(g) {
  if (!scissorSupported) return false;
  try {
    const cx = material.uniforms.glassCenter.value.x;
    const cy = material.uniforms.glassCenter.value.y;
    const sw = material.uniforms.glassSize.value.x;
    const sh = material.uniforms.glassSize.value.y;
    /* 裁剪框必须按**形变后的真实包围盒**算，不能只给 halfSize 加一个固定比例：
       固定比例（0.34）在 64×64 的搜索按钮上只留 47.5 设备px，而轴向满形变
       （jAmt 0.9 + jTr 0.55）实际需要 53px —— 超出的约 5.5px 被这个矩形切掉，
       圆形边缘贴到矩形边界上，在高对比度背景上就是一条笔直的接缝。
       对角方向形变量小（bump 让两轴均摊），不超界，所以只有轴向会出现 ——
       这正是「有些方向有接缝」的来源。
       下面与 fragment shader 用同一套公式，逐帧按当前 jAmt / jTr / 轴算。 */
    let hx = sw / 2, hy = sh / 2, ox = 0, oy = 0;
    if (g) {
      const mA = g.jAmt || 0, t = g.jTr || 0;
      if (Math.abs(mA) > 0.0008 || Math.abs(t) > 0.0008) {
        let ux = g.jDirX || 0, uy = -(g.jDirY || 0);   // GL 系（y 向上）
        const nn = ux * ux + uy * uy;
        if (nn > 1e-9) { const L = Math.sqrt(nn); ux /= L; uy /= L; } else { ux = 1; uy = 0; }
        const c2 = ux * ux, s2 = uy * uy;
        const A = mA * (1 - JELLY_FOLLOW) * 0.5;
        const K = A * (0.5 + CORNER_GAIN);
        const bump = 4 * s2 * c2;
        const gx = Math.max(1 + A * c2 + K * bump, 0.15);
        const gy = Math.max(1 + A * s2 + K * bump, 0.15);
        // 与 shader 同一套：每轴自己被拉长 g，同时被另一轴挤细 g^(-SQZ)
        const sx = gx * Math.pow(gy, -JELLY_SQUEEZE);
        const sy = gy * Math.pow(gx, -JELLY_SQUEEZE);
        // 平移基准取外接圆半径（与 shader 的 length(halfSize) 一致）
        const reach = Math.hypot(sw / 2, sh / 2);
        const shift = reach * t * (1 + JELLY_FOLLOW) * 0.5;
        hx = (sw / 2) * sx; hy = (sh / 2) * sy;
        ox = ux * shift;
        oy = uy * shift;
      }
      /* 漂移必须**始终**加进裁剪框（不能只在上面那个形变分支里加）：
         ① 「一整块玻璃」被拉时，子块形状已经跟着 jellyOffset 走了，
            裁剪框还留在原地，超出部分被 scissor 直接切掉 —— 实测 jAmt=0.45 时
            最远那块漂移 99 设备px、直径只有 208，露出比例只剩 52%，
            看着就是「玻璃被什么东西遮掉一小半」；
         ② 控制中心展开 / 收起时**没有形变**（jAmt=jTr=0），但整块已经平移了
            jOy —— 若只在形变分支里加，收起过程中整块会被切掉一半。
         jOx/jOy 是屏幕系设备px（y 向下），这里的 cy 是 GL 系（y 向上），故取反。 */
      ox += (g.jOx || 0);
      oy -= (g.jOy || 0);
    }
    const pad = 4;                                   // 抗锯齿 + 亚像素余量
    const x0 = Math.max(0, Math.floor(cx + ox - hx) - pad);
    const y0 = Math.max(0, Math.floor(cy + oy - hy) - pad);
    const x1 = Math.min(W, Math.ceil(cx + ox + hx) + pad);
    const y1 = Math.min(H, Math.ceil(cy + oy + hy) + pad);
    if (x1 <= x0 || y1 <= y0) return false;
    renderer.setScissor(x0, y0, x1 - x0, y1 - y0);
    renderer.setScissorTest(true);
    return true;
  } catch (e) { scissorSupported = false; return false; }
}

function render() {
  refreshBlurTextures();
  if (scissorSupported) { try { renderer.setScissorTest(false); } catch (e) { scissorSupported = false; } }
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  const act = activeList();
  /* 背景不再蹭玻璃着色器：临时把 Mesh 换成 bgMaterial 画一遍整屏，
     再换回玻璃材质逐块叠加。玻璃因此全部走 drawGlassOnly = 1
     （原来第一块是 0、自带背景），像素结果完全一致，已逐像素验证。
     曾经想在这里加「控制中心整块盖住屏幕就跳过背景」—— 实测不成立：
     ccSheet（670×1194）比画布（780×1688）小一圈，左右各露 55、
     上下各露 247 逻辑px 的背景；而且 ccSheet 根本**不在渲染列表里**
     （它只是把形变广播给 19 块小玻璃的物理代理，本身从不绘制）。
     所以整屏背景那一趟始终要画，不能省。 */
  if (bgMaterial && glassMesh) {
    /* tBackdropBlur 首帧可能还是 null（setGlassUniforms 尚未跑过）——
       采样一张未绑定的纹理会拿到 (0,0,0,1)，虽然 mixAmt=0 时会把它乘掉，
       但保险起见先兜成当前背景纹理。 */
    if (!material.uniforms.tBackdropBlur.value)
      material.uniforms.tBackdropBlur.value = material.uniforms.tBackdrop.value;
    glassMesh.material = bgMaterial;
    renderer.render(scene, camera);
    glassMesh.material = material;
  }
  material.uniforms.drawGlassOnly.value = 1.0;
  for (let i = 0; i < act.length; i++) {
    setGlassUniforms(act[i]);
    if (!scissorToGlass(act[i]) && scissorSupported) {
      try { renderer.setScissorTest(false); } catch (e) { scissorSupported = false; }
    }
    renderer.render(scene, camera);
  }
  if (scissorSupported) { try { renderer.setScissorTest(false); } catch (e) { scissorSupported = false; } }
}

/* ================= 默认背景：蓝绿→深蓝的液态流体 ================= */
function createFluidTexture(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const S = Math.min(w, h);

  /* ① 深蓝底色：左上偏亮、右下压暗，给玻璃留出可折射的明暗层次 */
  const base = ctx.createLinearGradient(0, 0, w * 0.35, h);
  base.addColorStop(0.00, '#163f74');
  base.addColorStop(0.45, '#0f3159');
  base.addColorStop(1.00, '#0a1e42');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, w, h);

  /* ② 45°斜条纹 —— 截图里最显眼的底纹，同时是折射时最强的高频源 */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.060)';
  ctx.lineWidth = Math.max(1, S * 0.007);
  const stripe = Math.max(7, S * 0.028);
  for (let d = -h; d < w + h; d += stripe) {
    ctx.beginPath();
    ctx.moveTo(d, 0);
    ctx.lineTo(d + h, h);
    ctx.stroke();
  }
  ctx.restore();

  /* ③ 彩色扁平几何：黄实心圆 / 蓝·紫·粉圆环 / 绿色弧线 / 三角（孟菲斯风，边缘保持锐利，全屏密铺） */
  const GEO_SCALE = 1.55;   /* 图案整体放大倍率：半径 ×1.55，描边 ×1.45 */
  const GEO_LW    = 1.45;
  const geo = [
    /* 带1 */
    ['disc', 0.20, 0.09, 0.100, 0.000, '#ffd93d'],
    ['ring', 0.58, 0.06, 0.058, 0.014, '#4fa3ff'],
    ['disc', 0.88, 0.10, 0.044, 0.000, '#ff6fa5'],
    ['disc', 0.44, 0.16, 0.020, 0.000, '#ff6fa5'],
    /* 带2 */
    ['arc',  0.74, 0.20, 0.105, 0.017, '#2fd07a'],
    ['ring', 0.12, 0.24, 0.048, 0.013, '#b06cff'],
    ['disc', 0.36, 0.25, 0.024, 0.000, '#4fa3ff'],
    /* 带3 */
    ['ring', 0.24, 0.34, 0.062, 0.014, '#4fa3ff'],
    ['disc', 0.62, 0.33, 0.050, 0.000, '#2fd07a'],
    ['disc', 0.90, 0.36, 0.036, 0.000, '#ffd93d'],
    ['tri',  0.05, 0.32, 0.026, 0.000, '#ff6fa5'],
    /* 带4 */
    ['disc', 0.40, 0.45, 0.092, 0.000, '#ff6fa5'],
    ['ring', 0.78, 0.46, 0.056, 0.013, '#b06cff'],
    ['disc', 0.10, 0.47, 0.028, 0.000, '#ffd93d'],
    ['disc', 0.66, 0.52, 0.018, 0.000, '#4fa3ff'],
    /* 带5 */
    ['ring', 0.20, 0.57, 0.058, 0.013, '#ff6fa5'],
    ['arc',  0.58, 0.58, 0.085, 0.015, '#ffd93d'],
    ['disc', 0.90, 0.60, 0.040, 0.000, '#4fa3ff'],
    ['tri',  0.32, 0.62, 0.024, 0.000, '#2fd07a'],
    /* 带6 */
    ['disc', 0.14, 0.68, 0.048, 0.000, '#2fd07a'],
    ['ring', 0.50, 0.70, 0.060, 0.014, '#4fa3ff'],
    ['arc',  0.84, 0.72, 0.078, 0.015, '#ff6fa5'],
    ['disc', 0.70, 0.66, 0.016, 0.000, '#ffd93d'],
    /* 带7 */
    ['disc', 0.28, 0.80, 0.070, 0.000, '#ffd93d'],
    ['ring', 0.68, 0.82, 0.052, 0.012, '#2fd07a'],
    ['disc', 0.94, 0.80, 0.030, 0.000, '#b06cff'],
    ['tri',  0.08, 0.76, 0.022, 0.000, '#4fa3ff'],
    /* 带8 */
    ['ring', 0.40, 0.92, 0.058, 0.013, '#ffd93d'],
    ['disc', 0.78, 0.94, 0.042, 0.000, '#ff6fa5'],
    ['disc', 0.14, 0.94, 0.032, 0.000, '#b06cff'],
    ['disc', 0.58, 0.88, 0.018, 0.000, '#ffd93d'],
  ];
  for (const [kind, fx, fy, fr, flw, color] of geo) {
    const cx = fx * w, cy = fy * h, r = fr * S * GEO_SCALE;
    ctx.strokeStyle = color; ctx.fillStyle = color;
    if (kind === 'disc') {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 'ring') {
      ctx.lineWidth = Math.max(1.2, flw * S * GEO_LW);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === 'tri') {
      ctx.beginPath();
      for (let k = 0; k < 3; k++) {
        const a = -Math.PI / 2 + k * Math.PI * 2 / 3;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.lineWidth = Math.max(1.2, flw * S * GEO_LW);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, r, -0.30 * Math.PI, 0.92 * Math.PI); ctx.stroke();
    }
  }

  /* ④ 两条自由曲线，打破圆形的规整感（孟菲斯常见手法） */
  ctx.save();
  ctx.lineCap = 'round';
  const curves = [
    [0.02, 0.78, 0.20, 0.72, 0.34, 0.90, '#ffd93d', 0.011],
    [0.70, 0.34, 0.88, 0.30, 0.98, 0.46, '#ff6fa5', 0.010],
    [0.05, 0.15, 0.18, 0.10, 0.30, 0.20, '#2fd07a', 0.009],
    [0.62, 0.62, 0.78, 0.58, 0.95, 0.70, '#ffd93d', 0.009],
    [0.12, 0.44, 0.30, 0.50, 0.40, 0.38, '#4fa3ff', 0.008],
    [0.45, 0.86, 0.62, 0.82, 0.80, 0.96, '#b06cff', 0.009],
  ];
  for (const [x0, y0, cx1, cy1, x1, y1, color, lw] of curves) {
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.2, lw * S * GEO_LW);
    ctx.beginPath();
    ctx.moveTo(x0 * w, y0 * h);
    ctx.quadraticCurveTo(cx1 * w, cy1 * h, x1 * w, y1 * h);
    ctx.stroke();
  }
  ctx.restore();

  /* ⑤ 细颗粒 + 极淡网格：折射时会被拉成弧形，是玻璃质感的关键 */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  const step = 26;
  for (let x = step / 2; x < w; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = step / 2; y < h; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  let seed = 20240927;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 400; i++) {
    const x = rnd() * w, y = rnd() * h;
    const rr = 1.2 + rnd() * 3.2;
    const bright = rnd() > 0.45;
    ctx.fillStyle = bright ? 'rgba(255,255,255,0.12)' : 'rgba(0,15,45,0.12)';
    ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

function setDefaultBackground() {
  clearBlurCache();
  bgSourceIsVideo = false;
  texture = createFluidTexture(W, H);
  bgSourceEl = texture.image;
  thumbTexDirty = true; thumbTexFull = true;   // 滑块折射纹理里垫着一份背景，换背景要整屏重铺
  if (material && material.uniforms) {          // 降级模式（无 WebGL）：没有材质可设
    material.uniforms.tDiffuse.value = texture;
    material.uniforms.bgTexSize.value.set(W, H);
  }
  bgScale = 1; bgOffsetX = 0; bgOffsetY = 0;
  document.getElementById('bgLayer').innerHTML = '';
}

/* ================= 图片背景：过大就裁一段（cover） ================= */
function setImageBackground(file) {
  clearBlurCache();
  bgSourceIsVideo = false;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const iw = img.naturalWidth  || img.width  || 0;
    const ih = img.naturalHeight || img.height || 0;
    if (!iw || !ih) { URL.revokeObjectURL(url); return; }   // 拿不到固有尺寸，保持原背景
    // cover：按手机比例取中间一段，多余的裁掉
    const targetRatio = W / H;
    const imgRatio = iw / ih;
    let sw = iw, sh = ih;
    if (imgRatio > targetRatio) sw = ih * targetRatio;   // 太宽 → 裁左右
    else                        sh = iw / targetRatio;   // 太高 → 裁上下
    const sx = (iw - sw) / 2;
    const sy = (ih - sh) / 2;

    // ① 先把整张源按「裁切区刚好等于目标尺寸」的分辨率栅格化一次。
    //    不能对 SVG 直接用 drawImage(img, sx,sy,sw,sh, ...) 裁切再拉伸 ——
    //    Chrome 只按 naturalWidth 光栅化 SVG，裁出的那一小块是从这张小位图上取的，
    //    再放大十几倍就是"糊上去的放大图"；而只有 viewBox 没有 width/height 的 SVG
    //    naturalWidth 只是默认的 150，实测直接画出**全透明空白**。
    //    先整体画到 rw×rh（裁切区 ≈ W×H，严格 1:1、不再放大），再从这个位图上裁。
    const need = Math.max(W / Math.max(sw, 1e-6), H / Math.max(sh, 1e-6));
    let rw = Math.round(iw * need), rh = Math.round(ih * need);
    const cap = 4096, k = Math.min(1, cap / Math.max(rw, rh));
    rw = Math.max(1, Math.round(rw * k));
    rh = Math.max(1, Math.round(rh * k));
    const rast = document.createElement('canvas');
    rast.width = rw; rast.height = rh;
    rast.getContext('2d').drawImage(img, 0, 0, rw, rh);

    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    // ② 先铺一层不透明底。SVG 常常自带透明区，透明像素的 RGB 是反预乘出来的
    //    垃圾值，折射/色散一采样就变成可见的"彩色像素点"，Canvas2D 模糊在透明区
    //    还会发暗。垫底后全画布 alpha=255，这些伪影都没有了。
    const base = ctx.createLinearGradient(0, 0, W * 0.3, H);
    base.addColorStop(0.00, '#0a3a4a');
    base.addColorStop(0.45, '#0e5f6b');
    base.addColorStop(0.75, '#14417a');
    base.addColorStop(1.00, '#101a4d');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, W, H);
    const f = rw / iw;
    ctx.drawImage(rast, sx * f, sy * f, sw * f, sh * f, 0, 0, W, H);

    /* ③ 上下边缘羽化到整图平均色 —— 让「普通平铺」也能无缝。
       旧方案是镜像平铺（原图 + 垂直翻转交替），接缝虽无缝，但下一张是上下颠倒的，
       用户觉得怪。这里换成：把顶部/底部各 BG_FEATHER_FRAC 的高度渐隐到同一个颜色
       （整图平均色），平铺时接缝两边都是这个颜色 → 值连续、看不出缝，
       且每一张方向都一样。 */
    if (BG_FEATHER_FRAC > 0) {
      const band = Math.max(2, Math.round(H * BG_FEATHER_FRAC));
      // 平均色：先缩到 32×32 求均值（只求底色，够用且快）
      let r = 16, g = 44, b = 64;
      try {
        const small = document.createElement('canvas');
        small.width = 32; small.height = 32;
        const sctx = small.getContext('2d');
        sctx.drawImage(canvas, 0, 0, 32, 32);
        const d = sctx.getImageData(0, 0, 32, 32).data;
        let sr = 0, sg = 0, sb = 0;
        for (let i = 0; i < d.length; i += 4) { sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; }
        const n = d.length / 4;
        r = Math.round(sr / n); g = Math.round(sg / n); b = Math.round(sb / n);
      } catch (e) {}
      const solid = 'rgb(' + r + ',' + g + ',' + b + ')';
      const clear = 'rgba(' + r + ',' + g + ',' + b + ',0)';
      let gr = ctx.createLinearGradient(0, 0, 0, band);   // 顶部：平均色 → 透明
      gr.addColorStop(0, solid); gr.addColorStop(1, clear);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, band);
      gr = ctx.createLinearGradient(0, H - band, 0, H);   // 底部：透明 → 平均色
      gr.addColorStop(0, clear); gr.addColorStop(1, solid);
      ctx.fillStyle = gr; ctx.fillRect(0, H - band, W, band);
    }

    texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    material.uniforms.tDiffuse.value = texture;
    material.uniforms.bgTexSize.value.set(W, H);
    bgSourceEl = canvas;      // 模糊源用这张已裁好的画布
    thumbTexDirty = true; thumbTexFull = true;   // 同上：换图后垫在滑块折射纹理里的背景也要整屏重铺
    clearBlurCache();
    bgScale = 1; bgOffsetX = 0; bgOffsetY = 0;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

/* ===== 毛玻璃模糊（复用原实现） ===== */
let videoCanvas = null;
// ===== 毛玻璃模糊 =====
// 用 Canvas2D 的 ctx.filter = 'blur(Npx)' 生成背景的模糊副本，
// 与 CSS backdrop-filter 走的是同一套高斯实现，效果一致且没有采样噪点。
// （在着色器里用稀疏采样模拟高斯，遇到网格/文字这类高频内容会产生摩尔纹，观感像马赛克）
let bgSourceEl = null;        // 当前背景可绘制源：canvas / img / video
let bgSourceIsVideo = false;
const blurTexCache = new Map(); // 整数模糊半径 -> { canvas, ctx, texture, dirty }
let canvasFilterSupported = null;

function supportsCanvasFilter() {
  if (canvasFilterSupported === null) {
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      canvasFilterSupported = (typeof ctx.filter === 'string');
    } catch (e) { canvasFilterSupported = false; }
  }
  return canvasFilterSupported;
}

// 背景纹理的实际像素尺寸（模糊副本必须同尺寸，保证 UV 映射一致）
function getBgPixelSize() {
  if (bgSourceIsVideo && videoCanvas) return [videoCanvas.width, videoCanvas.height];
  const el = bgSourceEl;
  if (!el) return [1, 1];
  return [el.width || el.naturalWidth || el.videoWidth || 1,
          el.height || el.naturalHeight || el.videoHeight || 1];
}

/* 【模糊副本降采样】
   模糊纹理原本与背景同分辨率（780×1688 = 5.3MB/张）。控制中心出场要用到
   壁纸 5 档 + 玻璃 4 档，最坏同时驻留 6 张 ≈ 30MB，且每跨一档就要现场生成
   一整张全屏高斯 —— 滑动时正好卡在生成那一两帧上（掉帧）。
   模糊本身是低频信号，降采样后再放大回来看不出差别，所以这里按
   BLUR_TEX_DIV 缩小画布：面积降到 1/DIV²，生成耗时与显存同步下降。
   UV 是 0~1 归一化坐标，shader 与调用方都不需要改。 */
const BLUR_TEX_DIV = 3;   // 1=原分辨率（旧行为），2=1/4 面积，3=1/9（默认）

// 模糊副本的画布尺寸（降采样后）
function getBlurTexSize() {
  const [sw, sh] = getBgPixelSize();
  const d = Math.max(1, BLUR_TEX_DIV | 0);
  return [Math.max(1, Math.round(sw / d)), Math.max(1, Math.round(sh / d))];
}

// 屏幕像素模糊半径 → 纹理像素模糊半径（再按降采样比例缩小）
function texBlurPx(screenPx) {
  const [sw] = getBgPixelSize();
  const tw = (material && material.uniforms) ? material.uniforms.bgTexSize.value.x : sw;
  const per = (tw * bgScale) / Math.max(1, sw); // 1 纹理像素 = 多少屏幕像素
  return screenPx / Math.max(0.0001, per) / Math.max(1, BLUR_TEX_DIV | 0);
}

function markBlurDirty() { blurTexCache.forEach(e => { e.dirty = true; }); }

function clearBlurCache() {
  blurTexCache.forEach(e => { try { e.texture.dispose(); } catch (err) {} });
  blurTexCache.clear();
  /* 【降采样源图缓存必须一起作废 —— 否则换背景后所有模糊仍是旧图】
     getBgSmall() 的 key = 模糊画布尺寸 + 源的固有尺寸 + 源的 src。
     自定义图片的源是一张 **canvas**（setImageBackground 会把图 cover 裁到 W×H
     再交给 bgSourceEl），而 canvas 没有 src 属性 → key 里那一段恒为空；
     默认几何背景同样是一张 W×H 的 canvas，两者尺寸又都被归一到 780×1688。
     于是换图前后 key 完全相同 → getBgSmall() 一直返回**第一张**背景的降采样副本。
     就算这里把 blurTexCache 清空、drawBlurred 重新画，画出来的仍是旧背景。
     表现：有模糊的玻璃 / 控制中心背景 = 默认背景；无模糊的玻璃 = 新图（正常）。
     换背景必然走本函数，所以在这里一并作废是最彻底的修复点。 */
  _bgSmall = null; _bgSmallKey = '';
  /* 缓存被整体清空（换背景 / 换分辨率）：预热成果作废，下次静止时重新备好。 */
  if (typeof _ccPrewarmDone !== 'undefined') _ccPrewarmDone = false;
}

function ensureBlurEntry(key) {
  const [sw, sh] = getBlurTexSize();
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, sw); canvas.height = Math.max(1, sh);
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  // 与背景图一致：垂直方向循环，滚动靠 wrapT 卷回来（模糊副本本身也画成上下无缝）
  tex.wrapT = THREE.RepeatWrapping;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  if (tex.colorSpace !== undefined) tex.colorSpace = THREE.SRGBColorSpace;
  const entry = { canvas, ctx, texture: tex, dirty: true };
  blurTexCache.set(key, entry);
  return entry;
}

// 源的固有像素尺寸（img/video 的画布尺寸可能与纹理尺寸不同）
function getSourceNaturalSize() {
  const el = bgSourceEl;
  if (!el) return [1, 1];
  return [el.naturalWidth || el.videoWidth || el.width || 1,
          el.naturalHeight || el.videoHeight || el.height || 1];
}

/* 【降采样源图缓存 —— 模糊生成的最大单项开销】
   drawBlurred 每次都要把整张源图（780×1688）缩放画到模糊画布（约 260×563）上，
   而且为了边缘不暗还要再画十几条边带，每条都是一次「大图 → 小画布」缩放。
   一个档位要画十几回，7 个档位就是上百次大图缩放 —— 真机日志里「模糊」单项
   占到 80~130ms/帧（占该帧 99%），就是这里。
   模糊是低频信号，先把源图一次性降采样到模糊画布尺寸缓存起来，
   之后所有档位、所有边带都从这张小图取样（1:1，无缩放），
   大图缩放从「每档十几回」降到「总共一次」。 */
let _bgSmall = null, _bgSmallKey = '', _bgVFrame = 0;
function getBgSmall() {
  const [cw, ch] = getBlurTexSize();
  const [nw, nh] = getSourceNaturalSize();
  let key = cw + 'x' + ch + '|' + nw + 'x' + nh;
  if (bgSourceIsVideo) key += '|v' + (_bgVFrame++);       // 视频每帧都变，不能缓存
  else if (bgSourceEl && bgSourceEl.src) key += '|' + bgSourceEl.src;
  if (_bgSmall && _bgSmallKey === key) return _bgSmall;
  const c = document.createElement('canvas');
  c.width = Math.max(1, cw); c.height = Math.max(1, ch);
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = 'high';
  try { cx.drawImage(bgSourceEl, 0, 0, nw, nh, 0, 0, cw, ch); } catch (e) {}
  _bgSmall = c; _bgSmallKey = key;
  return c;
}

// 画一张模糊副本。
// canvas 的 blur 会把画布外的区域当透明，直接画会让四周发暗；
// 这里先把源贴到一张「外扩」画布中心（1:1，不缩放），边缘用边缘像素拉伸填满，
// 再整张模糊后取中心区域 —— 内容与源严格对齐，边缘也不发暗。
function drawBlurred(entry, screenPx) {
  const cw = entry.canvas.width, ch = entry.canvas.height;
  const cb = Math.max(0, texBlurPx(screenPx));
  const pad = Math.min(Math.ceil(cb * 3), Math.max(1, Math.floor(Math.min(cw, ch) / 2)));
  if (!entry.tmp || entry.tmp.width !== cw + pad * 2 || entry.tmp.height !== ch + pad * 2) {
    entry.tmp = document.createElement('canvas');
    entry.tmp.width = cw + pad * 2;
    entry.tmp.height = ch + pad * 2;
    entry.tmpCtx = entry.tmp.getContext('2d');
  }
  const src = getBgSmall();            // 已降采样到 cw×ch，后续全部 1:1 取样
  const tc = entry.tmpCtx;
  tc.clearRect(0, 0, entry.tmp.width, entry.tmp.height);
  // 中心：完整内容，1:1 映射到纹理尺寸
  tc.drawImage(src, 0, 0, cw, ch, pad, pad, cw, ch);
  // 四条边：左右把边缘像素向外拉伸（wrapS 是 ClampToEdge，水平方向不卷绕）；
  //         上下必须**逐行**卷绕源的底部/顶部若干行。
  //
  // 之前这里只把「对面的那一行」拉伸成一整块 pad 高，等于让高斯核在边缘看到的
  // 是同一行重复 pad 次，而不是连续的 pad 行。源在纵向有明暗周期时
  // （斜条纹纵向半周期约 60 设备px，与 pad 同量级），两者相差近一个周期 ——
  // 于是模糊副本上下边缘那一圈的值与真实的无缝模糊不符，
  // 反映到画面上就是：只有走 blurred 分支（有高斯模糊的玻璃）才看得见的横向接缝。
  const bandUp = (dx, dw, sx, sWidth) => {          // 上带：源底部若干行
    let yy = pad, remain = pad;
    while (remain > 0) {
      const take = Math.min(remain, ch);
      tc.drawImage(src, sx, ch - take, sWidth, take, dx, yy - take, dw, take);
      yy -= take; remain -= take;
    }
  };
  const bandDown = (dx, dw, sx, sWidth) => {        // 下带：源顶部若干行
    let yy = pad + ch, remain = pad;
    while (remain > 0) {
      const take = Math.min(remain, ch);
      tc.drawImage(src, sx, 0, sWidth, take, dx, yy, dw, take);
      yy += take; remain -= take;
    }
  };
  // 左右：边缘列向外拉伸（只覆盖中心那一段高度）
  tc.drawImage(src, 0, 0, 1, ch, 0, pad, pad, ch);
  tc.drawImage(src, cw - 1, 0, 1, ch, pad + cw, pad, pad, ch);
  if (pad > 0) {
    bandUp(pad, cw, 0, cw);                       // 上·中
    bandDown(pad, cw, 0, cw);                     // 下·中
    // 四角：水平仍是边缘列拉伸，垂直逐行卷绕
    bandUp(0, pad, 0, 1);                         // 左上
    bandUp(pad + cw, pad, cw - 1, 1);             // 右上
    bandDown(0, pad, 0, 1);                       // 左下
    bandDown(pad + cw, pad, cw - 1, 1);           // 右下
  }

  entry.ctx.clearRect(0, 0, cw, ch);
  entry.ctx.save();
  entry.ctx.filter = 'blur(' + cb.toFixed(2) + 'px)';
  entry.ctx.drawImage(entry.tmp, -pad, -pad); // 外扩图整张模糊，中心区域即所需结果
  entry.ctx.restore();
  entry.texture.needsUpdate = true;
  entry.dirty = false;
}

// 每帧按需刷新：视频源每帧重画，静态源只在脏时重画
let _blurNeedSig = '';
function refreshBlurTextures() {
  if (!supportsCanvasFilter() || !bgSourceEl || !material) return;
  const need = new Set();
  for (const g of glasses) {
    if (g.hidden) continue;   // 不在当前场景里的玻璃（开关场景摘掉了按钮）
    const b = Math.round(g.blur || 0);
    if (b > 0) need.add(b);
  }
  // 关键：整屏「背景模糊」也要算进需要绘制的档位。
  // 之前只收集玻璃自己的 blur，于是 bgBlur 那一档永远不会被 drawBlurred 画到 ——
  // 更糟的是下面的清理循环会把「不在 need 里」的档位直接 dispose 掉，
  // 导致 getBgTextureForBlur 每次都拿到一张刚创建、还没画过的空画布 → 全黑。
  const bb = Math.round(bgBlur || 0);
  if (bb > 0) need.add(bb);
  /* 控制中心：壁纸模糊随出场进度走，需要哪一档就先准备好哪一档
     （否则 getBgTextureForBlur 会拿到一张刚创建、还没画过的空纹理 → 全黑背景）。
     顺带保住最近 6 档，来回滑动时不重复生成。 */
  if (ccSheetOn()) {
    /* 交叉淡入后只需要「最大模糊」这一张，不再需要逐档缓存。 */
    if (CC_BG_BLUR_ON) need.add(CC_BG_BLUR_MAX);
    /* 玻璃自己的模糊（ccGlassBlurPx）也必须**提前备好**。
       漏掉它的话：setGlassUniforms 里 getBgTextureForBlur(6) 会 ensureBlurEntry
       新建一张空画布，而它不在 need 里 → 永远不会被 drawBlurred 画 → 全黑纹理；
       更糟的是下面的清理循环每帧把它 dispose 掉，于是每帧重建、一直黑。
       玻璃模糊档位只有 0/2/4/6 四种，全部预备开销可忽略。 */
    if (CC_GLASS_BLUR_ON) need.add(CC_GLASS_BLUR_MAX);   // 恒定单档，见 ccGlassBlurPx
    /* 【全部档位常驻 need —— 滑动掉帧的主因】
       原来只留「最近 6 档」，其余会被下面的清理循环 dispose 掉。
       于是从完全展开往下滑时，每经过一个还没预热到的档位就要
       **现场生成一整张模糊图**（大画布 blur + 一次全屏纹理上传），
       一次收起最多触发 5 次 —— 卡就卡在生成这几帧上。
       现在控制中心总共只需要 2 张（壁纸最大模糊 + 玻璃最大模糊），
       降采样后合计约 2.5MB，滑动时零生成。 */
  }
  /* 【目录页后台预热 —— 消掉「点进控制中心卡半秒」】
     真机日志：切到控制中心后连着 5 帧各花 80~130ms 生成模糊（占该帧 99%），
     累计约 0.5s —— 因为 need 里的档位一个都还没画，must 又要求本帧必须用。
     用户点进控制中心之前总要在目录页停留一下，这里趁那段时间按每帧 1 档
     慢慢把控制中心要用的档位全部备好；真正点进去时 dirty 已经是 false，零生成。
     只在目录页做：其它展示页自己也有动画，不该替控制中心背这份开销。 */
  if (!ccSheetOn()) {
    /* 【原判断写成 sceneMode === 'menu'，是段从未执行过的死代码】
       sceneMode 只有 buttons / switches / slider / tabbar / control 五种取值，
       目录页是用 menuOpen 标志表示的，'menu' 从来不是场景值 —— 所以这段预热
       **一次都没跑过**。真机日志里「进控制中心那一帧 render 花 61.9ms」
       （jsSum=124 的那一帧）就是这么来的：需要的 2 张模糊图一张都没备，
       全靠 must 在进场那一帧现场生成。
       改成「只要不在控制中心就预热」：目录页 / 其它展示页都会慢慢备好，
       开销受 warmBudget 限制（静止时每帧最多 1 张），且画完即止。 */
    if (CC_GLASS_BLUR_ON) need.add(CC_GLASS_BLUR_MAX);
    if (CC_BG_BLUR_ON) need.add(CC_BG_BLUR_MAX);
  }
  /* 性能 ③：这一函数每帧都被调用，而它做的事（遍历 glasses、建 Set、逐档检查、
     必要时 drawBlurred 一张全屏图）在绝大多数帧里是完全重复的 ——
     需要的档位集合不变、纹理也都画好了。这里先算一个签名：
     档位集合 + 纹理尺寸 + 「有没有条目还脏着」。三者都没变就直接返回，
     一次 Set 构造和 28 次遍历全省掉。
     判据刻意保守：只要 need 变了、尺寸变了、或有任一条目 dirty，就照原样全跑。 */
  const [sw, sh] = getBlurTexSize();
  const sig = Array.from(need).sort((a, b) => a - b).join(',') + '|' + sw + 'x' + sh
            + '|n=' + blurTexCache.size;   // 缓存被整体清空时也要重跑（否则条目不会重建）
  if (sig === _blurNeedSig && !bgSourceIsVideo) {
    let anyDirty = false;
    blurTexCache.forEach(e => { if (e.dirty) anyDirty = true; });
    if (!anyDirty) return;
  }
  _blurNeedSig = sig;
  // 清理不再需要的档位
  blurTexCache.forEach((e, k) => {
    if (!need.has(k)) { try { e.texture.dispose(); } catch (err) {} blurTexCache.delete(k); }
  });
  /* 【每帧的生成预算】need 里现在有控制中心全部 8 档，若一口气全画出来
     会卡住两三帧（每张都是一次大画布 blur + 全屏纹理上传），
     那正是原来「滑动掉帧」的样子。所以分两批：
       ① 本帧**正在用**的两档（壁纸档 + 玻璃档）无条件画 —— 保证不闪空；
       ② 其余每帧最多再画 1 档（后台预热），剩下的下一帧继续。
     用户从完全展开开始滑，等手指滑到那一档时它早已就绪。
     视频源仍然每帧全画（画面每帧都在变，没有缓存可言）。 */
  const must = new Set();
  if (ccSheetOn() && CC_BG_BLUR_ON) {
    must.add(CC_BG_BLUR_MAX);
    const gb = ccGlassBlurPx(); if (gb > 0) must.add(gb);
  }
  /* 预热只留给静止帧：拖动 / 回弹时画面正在动，多花一帧去生成模糊纹理
     就等于在手势最敏感的时刻插一帧 100ms 的卡顿（真机日志里最慢的几帧
     全是这么来的）。当前正在用的档位（must）不受影响，照旧保证不闪空。 */
  /* 合并版不带 sceneIdle()（那是新版「静止整帧跳过」机制的一部分），
     这里改用「不在任何手势中」当判据：拖动 / 回弹时画面正在动，
     多花一帧去生成全屏模糊就等于在手感最敏感的时刻插一下 100ms 卡顿。
     与 sceneIdle() 判据等价，但不依赖那套跳帧机制。 */
  const _ccWarmIdle = (typeof sceneIdle === 'function' && sceneIdle())
    || ((typeof dragging !== 'undefined' && !dragging)
        && (typeof ccRevealDrag === 'undefined' || !ccRevealDrag));
  let warmBudget = _ccWarmIdle ? 1 : 0;
  const keys = Array.from(need).sort((a, b) => a - b);
  for (let ki = 0; ki < keys.length; ki++) {
    const k = keys[ki];
    let e = blurTexCache.get(k);
    // 背景尺寸变了（换背景 / 视频分辨率变化）→ 重建
    if (e && (e.canvas.width !== sw || e.canvas.height !== sh)) {
      try { e.texture.dispose(); } catch (err) {}
      blurTexCache.delete(k);
      e = null;
    }
    if (!e) e = ensureBlurEntry(k);
    if (bgSourceIsVideo) { drawBlurred(e, k); continue; }
    if (!e.dirty) continue;
    if (must.has(k)) { drawBlurred(e, k); continue; }
    if (warmBudget > 0) { warmBudget--; drawBlurred(e, k); }
  }
}

// 取该玻璃应使用的背景纹理
/* 【静止帧预热 —— 打破死锁】
   预热只在 sceneIdle() 时才被允许（warmBudget=1），而静止时主循环整帧跳过、
   render() 不跑，refreshBlurTextures() 也就跟着不跑 —— 于是「只在静止时预热」
   和「静止时不渲染」互相锁死，预热永远不可能发生。
   这里单独给主循环的静止分支调用：它只做纹理生成，不触发任何渲染，
   画完两张后 _ccPrewarmDone 置位、之后一帧都不再进（签名缓存也会直接 return）。
   换背景 / 清缓存时由 clearBlurCache 重置，下次静止时重新备好。 */
let _ccPrewarmDone = false;
function prewarmCcBlur() {
  if (_ccPrewarmDone) return;
  if (typeof ccSheetOn !== 'function') { _ccPrewarmDone = true; return; }
  if (ccSheetOn()) { _ccPrewarmDone = true; return; }   // 已经在控制中心：热身结束
  if (typeof refreshBlurTextures !== 'function') { _ccPrewarmDone = true; return; }

         必须拼在 jellyTransform 之后 —— syncLabels 每帧重写 iconEls[i].transform，
         单独写进 style.transform 会被这一行直接覆盖掉。
         缩放原点由 setTbarGlassBox 写成「条自己的中心」(.tbar 是 132px 32px)，
         与 JS 侧算出的玻璃中心严格同一个变换。
         只有条（i===7）弹 —— 搜索按钮（i===8）是独立控件，不跟着弹（用户要求），
         它的 transform 只走 jellyTransform 那一份。
         注意 .tbar 是 .tbar-sel（选中框本体）的定位父级，所以这份放大会自动带进
         thumbStep 读到的 rect，本体与条严格同步。 */
      const b = (sceneMode === 'tabbar' && i === 7 && tbarBounce > 0.0005)
        ? ' scale(' + (1 + tbarBounce).toFixed(4) + ')' : '';
      const tfI = jellyTransform(g, LABEL_SQUASH) + b;   // 图标/按钮文字同步形变
      if (c.IT !== tfI) { ic.style.transform = tfI; c.IT = tfI; }

    }
  }
}

/* ================= 拖动第一个玻璃 ================= */
const canvas = document.getElementById('glass-canvas');
const pickBtnEl = document.getElementById('pickBtn');
const fileInputEl = document.getElementById('fileInput');
const pickHitEl   = document.getElementById('pickHit');
/* ================= 果冻物理：欠阻尼阻尼谐振子 =================
   方程：a = -k·(x - target) - c·v   （质量 m = 1）
   自然频率 ω = √k，阻尼比 ζ = c / (2√k)
     ζ >= 1  临界/过阻尼 —— 单调收敛，不弹
     ζ <  1  欠阻尼     —— 来回振荡，正是果冻
   这里取 ζ = 0.20：约弹 2~3 下、0.5s 停稳。
   拖拽中改用 ζ = 1.0：形变稳稳跟住速度，不会边拖边抖。
   松手瞬间切回欠阻尼，并补一记释放冲量 —— 慢慢拖松手也会弹。        */
/* ================= 果冻物理：固定在原位，拽它只会被拉扯变形 =================
   两块弹簧并联：
   ① 位置弹簧 —— 玻璃是「钉住」的。拖它只会偏移一点点（PULL_FOLLOW=22%），
      松手弹回原位（ζ=0.61，轻微过冲，有 Q 感）。
   ② 形变弹簧 —— 拉扯量转成沿轴拉伸：被拽的那一侧放大得多、另一侧少，
      形状变水滴；垂直轴按 1/√w 收缩做体积守恒。松手后来回振荡几次归零。
   阻尼比：拖拽中 ζ=1（跟手、不抖），松手切 ζ<1（欠阻尼 → 才是果冻）。   */
const JELLY_K      = 816;    // 形变刚度 → ω≈28.6 rad/s，周期 0.22s
const JELLY_C_DRAG = 57;     // 拖拽中：ζ=1.0
const JELLY_C_FREE = 11.4;   // 松手后：ζ=0.20（弹 2~3 下）
const JELLY_MAX    = 0.55;   // 形变渐近上限（软饱和，永不到顶：拉得越远越接近）
const JELLY_KICK   = 4.0;    // 松手释放冲量
const JELLY_RELMIN = 0.060;  // 松手最小形变（保证「松开总会抖两下」）
const JELLY_PRESS  = 0.085;  // 按下时的挤压量（点击反馈）
/* 控制中心那块整屏大玻璃**不要**按下挤压：它是「背景」，不是可点的控件。
   留着的话，向上/向左/向右拖时拉扯长度被投影成 0，形变就停在 -JELLY_PRESS
   —— 观感是整块往中间缩一下（用户反馈的「往中间挤压」）。这里对它取 0，
   于是非向下方向 = 完全没反应；向下拖的拉伸不受影响。 */
function jPress(g) {
  return (CC_DRAG_ONLY_DOWN && typeof ccSheet !== 'undefined' && g === ccSheet) ? 0 : JELLY_PRESS;
}

const POS_K      = 520;      // 位置刚度 → ω≈22.8 rad/s，周期 0.28s
const POS_C_DRAG = 45.6;     // 拖拽中：ζ=1.0
const POS_C_FREE = 22.0;     // 松手后：ζ=0.48（过冲约 20%，弹回看得见）
const PULL_FOLLOW = 0.0;     // 玻璃本体完全钉死：拉它只变形，位置一动不动（还是「钉住」的）
// 拉扯量 → 形变：用「软饱和」代替硬夹断。
//   m = JELLY_MAX · len/(len + L0)
// 随拉扯距离单调增长、永不到顶（可以一直拉），但增量越来越小 —— 这就是
// 「阻尼感越来越强」。原来用 if (len > lim) 夹断：一旦超界形状就卡住不动，
// 绕圈拖拽时夹断点在圆上滑动，看起来就是一跳一跳的。
const PULL_SOFT   = 0.44;    // 软饱和特征长度 = 屏幕短边半径 × 0.44（≈86 CSS px）
const PULL_SOFT_SCREEN = true;   // 特征长度取「屏幕尺度」而非玻璃尺寸：

   -0.085 的「挤压井」再爬回 +0.05 的拉伸 —— 扁条只有 52px 高，纵向一晃就穿过去了，
   看起来就是「一跳一跳」。死区压到 0.04（≈1 CSS px）后，稍有拖动就完全是拉伸，
   挤压只在真正按住不动时出现。 */
const PULL_DEAD   = 0.04;
/* 浮起（lift）弹簧：按下/拖动 → 目标 1，松开 → 目标 0。
   与位置弹簧同一套方程，阻尼比分两段：
     按住中 ζ=1.0  —— 稳稳升到顶，不抖（否则手指压着时玻璃一直在颤）
     松开后 ζ=0.45 —— 欠阻尼，沉到 0 以下再坐回来（过冲约 20%），
                      这一下"沉过头"正是浮起→沉下动画连贯的关键：
                      如果 ζ>=1 单调收敛，看着就是"啪"地掉下去，断了一截。 */
const LIFT_K      = 520;      // 与 POS_K 同刚度 → ω≈22.8 rad/s
const LIFT_C_HELD = 45.6;     // 按住中：ζ=1.0
const LIFT_C_FREE = 20.5;     // 松开后：ζ=0.45
const LIFT_SCALE  = 0.06;     // 浮起量：尺寸 ×(1+6%)，圆角同步，构图不变形
const LIFT_SHADOW = 14;       // 投影额外下移/扩散（CSS px）
// 轴平滑时间常数。轴必须连续变化：若一帧内从「水平」直接跳到「竖直」，
// 形状会瞬间从扁变高 —— 这就是「顿一下」。指数平滑让它扫过中间角度。
// 轴取「模 180°」（无方向），左右之分交给位移量 t 的正负，
// 所以从「往右拉」切到「往左拉」时轴纹丝不动，只有 t 平滑过零。
/* 形变轴平滑时间常数。之前 0.055s：拖着绕圈时形变轴以 55ms 追鼠标方向，
   视觉上就是「先转一圈才跟上鼠标」。现在压到 12ms（约一帧），
   形变方向基本 = 当帧鼠标方向 —— 鼠标往哪拖就往哪变形，不转。 */
const DIR_TAU     = 0.035;
/* 形变轴的长度门控：拉扯长度不足时不更新轴方向。
   这是「一抖一抖」的真正根因 —— 轴由瞬时 atan2(oy, ox) 决定，而鼠标总有
   ±1~2px 噪声。在按钮里拖动时 ox 常常很小，一点点 oy 噪声就能让角度在
   0° 与 90° 之间乱跳（实测带噪声拖动时轴角在 -22°~59° 间每帧跳 3.2°、
   最大 81°），形状就在「横向拉伸」和「纵向拉伸」之间疯狂切换。
   门控之后：小幅抖动（< 短边半径 × 此系数）轴完全冻结，噪声进不来；
   真实拖动一超过门控就更新，配合下面的平滑仍然即时。 */
const DIR_LEN_GATE = 0.40;
/* 角度滞回：新方向与当前轴相差不足此角度就完全不更新。
   门控挡住了「拉得太短」的情形，但拉得较远时鼠标噪声仍会带来几度的角度抖动
   （实测残留 ±3°、二阶跳变 10°）。加一层滞回后噪声被整个吃掉，
   而真实绕圈每帧方向变化远大于此值，照常即时跟随。 */
const DIR_ANG_DEAD = 0.0;     // 0 = 关闭滞回（滞回会让轴"跳"过阈值，改用纯平滑更连续）

function pullLimit(g) { return Math.min(g.width, g.height) * 0.5; }   // 玻璃短边半径（只用于死区）
function sstep(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a || 1))); return t * t * (3 - 2 * t); }
/* 死区 → 拉伸 的过渡区间（相对死区长度）。
   原来是一个 if：死区内 tm = -JELLY_PRESS（挤压），一越过死区就跳到 +m（拉伸）。
   鼠标在按钮里慢慢移动、反复经过中心时，形变量就在 -0.085 与 +0.02 之间来回瞬跳
   —— 这就是「按钮里拖动一跳一跳」。
   改成按拉扯长度平滑混合：挤压逐渐让位给拉伸，中间经过 0，没有台阶。 */
const PULL_BLEND   = 2.5;
function pullSoft()   { return Math.min(W, H) * 0.5 * PULL_SOFT; }     // 软饱和特征长度 L0（设备px）
/* 形状内 / 形状外 的形变档位。
   手指还在按钮里面 → 形变只给 DEFORM_INNER 的比例（很小）；
   拽出按钮之后，随溢出距离在 DEFORM_RAMP 内平滑恢复到 100%。 */
// 主页右上角那个圆形玻璃按钮（声明提前：stepGlass 要判断它是不是正在被拖）
let fabGlass = null;
let fabDrag  = null;      // 它的拖拽状态（独立于场景的 dragging）
const DEFORM_INNER = 0.22;   // 形状内形变的比例（1 = 与原来一样大）
const DEFORM_RAMP  = 70;     // 出界后恢复到满形变所需距离（设备px，35 CSS px）
                             // 太短（40）会在穿过边界的两三帧里从 0.07 猛涨，看得见跳变
/* 控制中心那块「整屏大玻璃」只认**向下**的拉扯：向上 / 向左 / 向右一律不形变
   （拉扯向量先投影到 +y，横向丢掉、向上截断为 0），后续展开/收起动画也沿这一个轴。 */
const CC_DRAG_ONLY_DOWN = true;

function stepGlass(g, dt) {
  // 主页那个圆形按钮用的是自己的 fabDrag（不能塞进 dragging：场景 canvas 的
  // endDrag/onDragMove 会误处理）。这里两套状态一起认，走完全同一套弹簧。
  const dragState = (dragging && dragging.glass === g) ? dragging
                  : (g === fabGlass && fabDrag) ? fabDrag : null;
  const isDrag = !!dragState;
  const lim = pullLimit(g);

  // ---------- ① 位置：钉在原位，只被拽偏一点点 ----------
  let tx = g.homeX, ty = g.homeY;
  if (isDrag) {
    // 不再夹断拉扯向量：夹断会让绕圈拖拽时形状卡住再跳。PULL_FOLLOW=0 时
    // 玻璃本体本来就钉死，这里只保留接口。
    tx = g.homeX + (g._ox || 0) * PULL_FOLLOW;
    ty = g.homeY + (g._oy || 0) * PULL_FOLLOW;
  }
  const cp = isDrag ? POS_C_DRAG : POS_C_FREE;
  g.vx += (-POS_K * (g.x - tx) - cp * g.vx) * dt;
  g.vy += (-POS_K * (g.y - ty) - cp * g.vy) * dt;
  g.x  += g.vx * dt;
  g.y  += g.vy * dt;
  if (!isDrag && Math.hypot(g.x - tx, g.y - ty) < 0.2 && Math.hypot(g.vx, g.vy) < 4) {
    g.x = tx; g.y = ty; g.vx = 0; g.vy = 0;      // 回位停稳
  }

  // ---------- ② 形变：拉扯量 → 沿轴拉伸 + 沿轴位移 ----------
  let tAng = g.jAng, tm = g.jTarget, tt = g.jTrT;
  if (isDrag) {
    let ox = g._ox || 0, oy = g._oy || 0;
    /* 控制中心整块玻璃：只允许「向下」拉出形变 —— 这是后面展开/收起动画的前提。
       做法：把拉扯向量投影到 +y（屏幕系，向下为正）：横向分量直接丢掉，
       向上分量截断为 0。于是向上 / 向左 / 向右拖 ⇔ 有效拉扯长度为 0 ⇔
       停在「按住挤压」的状态，观感上就是拖不动、没反应；只有往下拖才拉伸。
       过滤必须发生在**所有**派生量之前：轴、软饱和幅度、溢出 gate、平移符号
       全用过滤后的向量算，否则横向分量会把轴带偏、gate 也会拿原始指针
       位置算出虚假的溢出量。 */
    if (CC_DRAG_ONLY_DOWN && g === ccSheet) { ox = 0; oy = Math.max(0, oy); }
    const len = Math.hypot(ox, oy);
    // 轴 = 拖拽方向「模 180°」（无方向性）；左右之分记在 t 的正负里。
    // 关键：同一个轴有 a 与 a±π 两种写法，必须选**离当前轴最近**的那种，
    // 否则 t 的正负会跟着写法翻转，出现「往左拉却往右跑」。
    // 死区内也要对齐轴：那时形变只有 -PRESS 的挤压（幅度很小，轴转动看不出来），
    // 等拖出死区、形变开始增长时轴早已就位 → 既不会瞬跳，也不会滞后转圈。
    let a = g.jAng;
    // 拉扯长度不足（含鼠标噪声区间）→ 轴冻结，不更新。
    if (len > lim * DIR_LEN_GATE) {
      let raw = Math.atan2(oy, ox);
      while (raw - g.jAng >  Math.PI / 2) raw -= Math.PI;
      while (raw - g.jAng < -Math.PI / 2) raw += Math.PI;
      // 角度滞回：微小偏差（噪声）不更新，真实转向照常跟上
      if (Math.abs(raw - g.jAng) > DIR_ANG_DEAD) { a = raw; tAng = a; }
    }
    // 软饱和：单调增、无上限夹断、增量递减（阻尼越来越强）
    const L0 = pullSoft();
    const mRaw = JELLY_MAX * len / (len + L0);
    // 手指还在形状「里面」时形变要很小，拽出形状外才恢复到完整形变。
    // 逻辑：玻璃是被按在框里的 —— 手指在里面移动只是轻推它，
    // 只有把它拽出边界才是真的在拉扯，形变才该大。
    // 用**静止**矩形算溢出量：玻璃本体是钉死的（PULL_FOLLOW=0），位置不随拖拽变化，
    // 所以这里没有反馈回路 —— 若改用形变后的矩形，形状被拽大/拽走会反过来减小
    // 溢出量、又减小形变，形成来回振荡。
    const ppx = dragState.sx + ox, ppy = dragState.sy + oy;  // 当前指针（设备px，屏幕系）
    const ovx = Math.max(0, Math.abs(ppx - g.x) - g.width * 0.5);
    const ovy = Math.max(0, Math.abs(ppy - g.y) - g.height * 0.5);
    const over = Math.hypot(ovx, ovy);
    // 平滑过渡：穿过边界时不跳变（sstep 在两端导数为 0）
    /* ccSheet 铺满整个内容区，指针几乎恒在形状「里面」—— 若照用 DEFORM_INNER，
       形变会被压到 22%，观感就是「往下拖了但几乎没变」。整屏玻璃不存在
       「手指在里面只是轻推」这层语义，所以这里直接给满形变。 */
    const gate = (CC_DRAG_ONLY_DOWN && g === ccSheet)
      ? 1
      : DEFORM_INNER + (1 - DEFORM_INNER) * sstep(0, DEFORM_RAMP, over);
    const m = mRaw * gate;
    const sgn = (ox * Math.cos(a) + oy * Math.sin(a)) >= 0 ? 1 : -1;
    // 按住（挤压）↔ 拖动（拉伸）按拉扯长度平滑过渡，不再瞬跳
    const wOut = (len > 1) ? sstep(lim * PULL_DEAD, lim * PULL_DEAD * PULL_BLEND, len) : 0;
    tm = -jPress(g) * (1 - wOut) + m * wOut;
    tt = m * sgn * wOut;
  } else if (g.jHeld) {
    tm = -jPress(g); tt = 0;
  } else {
    tm = 0; tt = 0;                                 // 松手：轴冻结，两个量各自回零
  }
  // 轴指数平滑（模 180°，走最短弧，扫过 ≤90°）：绝不瞬跳
  let da = tAng - g.jAng;
  while (da >  Math.PI / 2) da -= Math.PI;
  while (da < -Math.PI / 2) da += Math.PI;
  g.jAng += da * (1 - Math.exp(-dt / DIR_TAU));
  g.jDirX = Math.cos(g.jAng); g.jDirY = Math.sin(g.jAng);

  // ---------- ③ 浮起：按住/拖动 → 抬起，松开 → 欠阻尼沉下 ----------
  {
    const tL = g.liftHeld ? 1 : 0;
    const cl = g.liftHeld ? LIFT_C_HELD : LIFT_C_FREE;
    g.liftV += (-LIFT_K * (g.lift - tL) - cl * g.liftV) * dt;
    g.lift  += g.liftV * dt;
    if (!g.liftHeld && Math.abs(g.lift) < 0.004 && Math.abs(g.liftV) < 0.25) {
      g.lift = 0; g.liftV = 0;      // 沉到位，停稳（超调要收敛到 0，不能留残余）
    }
  }

  const cj = isDrag ? JELLY_C_DRAG : JELLY_C_FREE;
  g.jTarget = tm; g.jTrT = tt;
  g.jVel += (-JELLY_K * (g.jAmt - g.jTarget) - cj * g.jVel) * dt;
  g.jAmt += g.jVel * dt;
  g.jTrV += (-JELLY_K * (g.jTr - g.jTrT) - cj * g.jTrV) * dt;
  g.jTr  += g.jTrV * dt;
  if (!isDrag && !g.jHeld && Math.abs(g.jAmt) < 0.0006 && Math.abs(g.jVel) < 0.004) {
    g.jAmt = 0; g.jVel = 0;
  }
  if (!isDrag && !g.jHeld && Math.abs(g.jTr) < 0.0006 && Math.abs(g.jTrV) < 0.004) {
    g.jTr = 0; g.jTrV = 0;
  }
}

/* 控制中心：先走大玻璃自己的弹簧，再把形变场广播给 19 块小玻璃。
   小玻璃必须**跳过** stepGlass —— 否则它们各自跑一套回零弹簧，
   会把广播下来的 jAmt/jTr 覆盖掉，看着就是「广播没生效」。 */
function updateJelly(dt) {
  if (ccSheetOn()) {
    /* 子步积分：形变弹簧在 dt 偏大时会越过显式积分的稳定域
       （JELLY_K·dt 与 JELLY_C_DRAG·dt 在 dt≈33ms 时分别到 27 和 1.88，
        后者让速度项符号翻转且被放大 → 实测 8 帧内 jAmt 从 0.01 涨到 759）。
       60fps（dt≈16.7ms）本来就在稳定域内，这里按 1/60 切子步：
       正常帧率下 n=1，与单步逐值一致；低帧率下自动细分，不会炸。 */
    const n = Math.max(1, Math.ceil(dt / (1 / 60)));
    const h = dt / n;
    for (let i = 0; i < n; i++) stepGlass(ccSheet, h);
    ccBroadcast();
  }
  for (const g of glasses) {
    if (g.hidden) continue;
    if (ccSheetOn() && g.mode === 'control') continue;
    stepGlass(g, dt);

  /* 【弹簧吸附 —— 让「静止」早点成立】
     形变弹簧是指数衰减，理论上永远到不了 0。实测松手后 jAmt 从 0.061 衰减到
     sceneIdle 的门槛 3e-4 要 2.5 秒，这 2.5 秒里：
       · 静止整帧跳过一直不生效（22 次绘制调用满负荷空转）
       · RS_MOVE_IDX 快速通道把画面判成「仍在运动」，分辨率不回满档
     而 3e-3 的形变量约 0.6 像素、0.06 设备px 的漂移不到一个像素，

  if (!dragging && !bgDrag) {

      if (Math.abs(g.jTr   || 0) < 3e-3 && Math.abs(g.jTrV  || 0) < 3e-3) { g.jTr = 0; g.jTrV = 0; }
      if (Math.abs(g.jOx   || 0) < 0.06   && Math.abs(g.jOy   || 0) < 0.06)   { g.jOx = 0; g.jOy = 0; }
      if (Math.abs(g.lift  || 0) < 3e-3 && Math.abs(g.liftV || 0) < 3e-3) { g.lift = 0; g.liftV = 0; }
    };
    if (typeof ccSheet !== 'undefined') snap(ccSheet);
    for (const g of glasses) { if (!g.hidden) snap(g); }

// 松手：清空拉扯（位置弹簧自动回原位），并给形变一记释放冲量。
// 兜一个最小形变 —— 拖到一半停住再松手时 jAmt 已衰减到接近 0，
// 不兜底就会毫无反馈，而 iOS 的观感是「松开总是要抖两下」。
function jellyRelease(g) {
  g._ox = 0; g._oy = 0;

     长按 / 原地按下时 jAmt、jTr 恒为 0（目标 0、速度 0，弹簧纹丝不动）。
     这时绝不能走 JELLY_RELMIN 兜底 —— 0 会被强行抬成 +0.060，
     再吃一记 JELLY_KICK 冲量，观感就是「明明没变形，松手却跳一下」。
     所以：真有形变（哪怕只剩拖拽衰减下来的一点残渣）才给释放反馈；
     完全没形变的直接清零、不给冲量，松手即静止。
     其它玻璃按下时 jAmt = -JELLY_PRESS = -0.085，远大于这个阈值，
     照旧拿 -0.060 的挤压回弹，不受影响。 */
  if (Math.abs(g.jAmt) < 1e-4 && Math.abs(g.jTr) < 1e-4) {
    g.jAmt = 0; g.jVel = 0; g.jTr = 0; g.jTrV = 0;
    return;
  }
  if (Math.abs(g.jAmt) < JELLY_RELMIN) g.jAmt = (g.jAmt >= 0 ? 1 : -1) * JELLY_RELMIN;
  if (Math.abs(g.jTr)  < JELLY_RELMIN) g.jTr  = (g.jTr  >= 0 ? 1 : -1) * JELLY_RELMIN;
  g.jVel -= g.jAmt * JELLY_KICK;
  g.jTrV -= g.jTr  * JELLY_KICK;
}

let dragging = null;
let bgDrag = null;

/* 背景滚动未启用：bgDrawImage 退化为普通 drawImage（与老版逐字一致）。 */
function bgDrawImage(ctx, sx, sy, sw, sh, dx, dy, dw, dh) {

const TAP_SLOP    = 12 * SCALE;

function clampToPhone(g) {

}

// 原来直接赋值 jAmt=-PRESS，形状会在按下那一帧瞬间弹一下（因为 shift∝jAmt
// 会立刻产生 reach·PRESS 的位移），观感就是「顿」。

  const [px, py] = toDevice(e);

    if (g.hidden || !g.draggable || g.pick) continue;

canvas.addEventListener('pointerdown', e => {

  const [px, py] = toDevice(e);
  setPointer(px / SCALE, py / SCALE);

  if (ccSheetOn() && ccRevealDrag) {

    ccRevealDrag.peakY = Math.min(ccRevealDrag.peakY, py);
